---
# `pre-commit install` arms gitleaks and the YAML/whitespace hooks over this
# repository's own sources. The template/ tree is excluded from the YAML hooks:
# its files are Jinja, which no YAML parser reads. gitleaks still scans it.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c, lint/yamllint-relaxed.yml]
        exclude: ^template/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^template/
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^template/
      - id: check-merge-conflict
      - id: check-yaml
        # --unsafe is a syntax-only parse, so GitLab's `!reference` tags do not
        # false-fail.
        args: [--allow-multiple-documents, --unsafe]
        exclude: ^template/
