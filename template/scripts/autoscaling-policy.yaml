---
# Policy data for check-hpa-vpa-invariant.py (--policy-config) and the shared
# CPU-limit allowlist in validate-helm-values.py; both run in `task flux:lint`
# and the CI flux-lint job. Field reference: weisssrv-lib docs/SCRIPTS.md.
chart_native_hpa_targets:
  - namespace: traefik
    kind: Deployment
    name: traefik
    source: traefik chart autoscaling.enabled

# "namespace/Kind/name": reason — workloads permitted a CPU limit. A CPU limit
# only buys CFS throttling, which hurts latency and inflates the CPU% a
# CPU-based HPA reads.
cpu_limit_allowlist: {}

# "namespace/VerticalPodAutoscaler/name": reason — VPAs exempt from the memory
# cap rule (cap == limit under a limit-controlling policy).
vpa_cap_allowlist: {}

# "namespace/Kind/name": reason — workloads permitted requests.memory ==
# limits.memory under a memory-controlling VPA. The updater preserves that
# ratio, so such a container never gains headroom.
memory_ratio_allowlist: {}
