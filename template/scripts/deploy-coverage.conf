# Config for check-deploy-coverage.sh: the playbooks and inventory paths
# deliberately reached by no deploy job. Every entry needs a trailing
# `# rationale` or the script rejects it. See docs/ci-pipeline.md.

[settings]
roles_dir = ansible/roles
playbooks_dir = ansible/playbooks
inventory_dir = ansible/inventories/prod
ci_file = .gitlab-ci.yml
job_prefix = deploy-
job_stage = deploy

# No [roles] section: this repo vendors no roles — every role comes from the
# weisssrv.infra collection, pinned in ansible/requirements.yml (which IS in
# deploy-ansible-base's changes list, so a collection bump deploys).

[playbooks]
# Operator-run playbooks. Everything else — base/site, dns, storage, mail, k3s —
# is wired to a deploy-* job; adding a job per new playbook is the documented way
# to keep it that way (docs/ci-pipeline.md).
proxmox-ha.yml                           # HA rules + replication; sensitive, `task proxmox:ha`
proxmox-enable-autostart.yml             # one-time guest reconcile; `task proxmox:configure-autostart`
zfs-encryption.yml                       # cold-boot passphrase unlock; sensitive, `task zfs:encrypt`
bootstrap/storage-bootstrap.yml          # interactive first-setup/DR path; `task disaster-recovery:storage-bootstrap`
postflight.yml                           # read-only verification; the verify stage runs it, as does `task infra:verify`
show-cert-host-keys.yml                  # read-only helper; `task certs:show-host-keys`
tasks/_check-mode-reachable.yml          # include-only task file, never run as a playbook
_reachability-probe.yml                  # import_playbook'd by site.yml + base.yml; never run alone
_reachability-gate.yml                   # import_playbook'd by site.yml + base.yml; never run alone
maintenance/update-packages.yml          # run by the maintenance tasks, not the deploy stage
maintenance/update-applications.yml      # run by the maintenance tasks, not the deploy stage
maintenance/update-k3s-nodes.yml         # rolling node upgrade; `task maintenance:update-k3s-nodes`
maintenance/update-full.yml              # wraps the three above; operator-run
maintenance/_apt-upgrade.yml             # include-only helper for the maintenance plays
maintenance/_apt-upgrade-and-reboot.yml  # include-only helper for the maintenance plays
maintenance/_reboot-if-needed.yml        # include-only helper for the maintenance plays
maintenance/_uncordon-and-wait-ready.yml # include-only helper for the maintenance plays
maintenance/_ensure-nfs-server-healthy.yml # include-only helper for the maintenance plays
maintenance/_wait-no-kured-server-reboot.yml # include-only helper for the maintenance plays

[inventory]
# Nothing: every inventory path reaches a deploy job by name, and a glob earns
# no coverage credit. A new host_vars or group_vars file needs its own entry in
# a deploy job's changes list. See docs/ci-pipeline.md.
