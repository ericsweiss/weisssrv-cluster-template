---
# Vendored copies of weisssrv-lib files, checked byte-identical at the pinned ref
# by tests/test_vendored_byte_identity.py. Entry forms, the refresh loop and the
# `forked:` rules (must differ; `reason` + `reconciled_sha256`): docs/ci-pipeline.md.
vendored:
  # The shared molecule scaffolding. No directory walk reaches it: the walk
  # covers scripts/ only.
  - lib: ansible_collections/weisssrv/infra/molecule-shared/prepare-common.yml
    consumer: ansible/molecule/prepare-common.yml
  - lib: ansible_collections/weisssrv/infra/molecule-shared/tasks/container-warmup.yml
    consumer: ansible/molecule/tasks/container-warmup.yml
  - lib: ansible_collections/weisssrv/infra/molecule-shared/tasks/prepare-apt-disable.yml
    consumer: ansible/molecule/tasks/prepare-apt-disable.yml
  - lib: ansible_collections/weisssrv/infra/molecule-shared/tasks/prepare-base.yml
    consumer: ansible/molecule/tasks/prepare-base.yml
  # Imported by gitlab-runner-reaper.py from the CronJob's mounted ConfigMap.
  - lib: kubernetes/reapers/kube_reaper.py
    consumer: kubernetes/apps/gitlab-runner-reaper/kube_reaper.py
  - scripts/check-alertmanager-behaviour.py
  - scripts/check-backup-artifact-apps.py
  - scripts/check-cluster-invariants.py
  - scripts/check-ci-include-job-names.py
  - scripts/check-comment-length.py
  - scripts/check-crd-stage-order.py
  - scripts/check-dashboards.py
  - scripts/check-default-deny-coverage.py
  - scripts/check-deploy-coverage.sh
  - scripts/check-deploy-preflight.py
  - scripts/check-doc-links.py
  - scripts/check-ephemeral-storage-cap.py
  - scripts/check-guest-endpoint-parity.py
  - scripts/check-helm-repo-parity.py
  - scripts/check-hpa-vpa-invariant.py
  - scripts/check-image-gc-threshold.py
  - scripts/check-internal-route-allowlist.py
  - scripts/check-kubectl-version-pin.py
  - scripts/check-lib-pins.py
  - scripts/check-netpol-except-parity.py
  - scripts/check-nfs-tls.py
  - scripts/check-pvc-storageclass.py
  - scripts/check-role-default-flips.py
  - scripts/check-role-inputs.py
  - scripts/check-scrape-netpol.py
  - scripts/check-scrape-wiring.py
  - scripts/check-secret-rotation-coverage.py
  - scripts/check-secretstore-scope.py
  - scripts/check-skill-refs.py
  - scripts/check-taskfile.sh
  - scripts/check-tenant-traefik-isolation.py
  - scripts/check-tenant-wiring.py
  - scripts/check-version-checksums.py
  - scripts/check-versions.py
  - scripts/ci-fetch-tools.py
  - scripts/ci-run-check.sh
  # Companion modules: each is imported from the importing gate's own directory.
  - scripts/ci_playbook_invocations.py
  - scripts/ci_yaml.py
  - scripts/cluster-config-value.sh
  - scripts/collect-state-lib.sh
  - scripts/deploy-verify-lib.sh
  - scripts/extract-prometheus-config.py
  - scripts/find-reachable-host.sh
  - scripts/flux-child-kustomizations.py
  - scripts/flux-env.sh
  # flux-lint.sh runs flux-env.sh and kubeconform-skipped.py by path; both are
  # registered beside it. The expected-skip baseline is this cluster's own.
  - scripts/flux-lint.sh
  - scripts/flux-secret-consumers.py
  - scripts/gate_common.py
  - scripts/generate-host-log-staleness.py
  - scripts/generate-hosts-env.py
  - scripts/generate-versions-configmap.py
  - scripts/inventory_tree.py
  - scripts/kubeconform-skipped.py
  - scripts/lint-prometheus-config.sh
  - scripts/maintenance-run-with-verify.sh
  - scripts/molecule-retry.sh
  - scripts/resolve-tool.sh
  - scripts/sanitize-junit-expected-failures.py
  - scripts/semantic-release.py
  - scripts/shell-lib.sh
  - scripts/supervised-apply-guard.sh
  - scripts/taskfile_tree.py
  - scripts/tenant_common.py
  # pre-commit, the yaml-lint job and `task lint` all point at this profile.
  # Kept at lint/, never as a repo-root `.yamllint`: ansible-lint discovers one
  # there and replaces its own yaml rule.
  - lint/yamllint-relaxed.yml
  - scripts/validate-helm-values.py
  - scripts/version-bump-mr.py
  # The lint profiles this cluster takes unchanged. No directory walk reaches
  # them, and their drift is quiet: a tightened library rule passes locally.
  - lib: lint/gitattributes
    consumer: .gitattributes
  - lib: lint/ruff.toml
    consumer: ruff.toml
  - lib: lint/secret-detection-ruleset.toml
    consumer: .gitlab/secret-detection-ruleset.toml
  # Only a path the library's scripts/vendorable-paths.yml offers at the pinned
  # ref may be registered here; anything else reds the byte-identity gate.

forked:
  # Cluster-owned gates that share a name with a library gate. Each keeps its
  # own CLI and its own test suite, so it is held to the library by
  # reconciled_sha256 rather than by byte-identity.
  - lib: scripts/check-flux-version-pin.py
    consumer: scripts/check-flux-version-pin.py
    reason: >-
      Reports every disagreeing pin rather than the first, and takes --root and
      --components where the library's takes --repo-root, --ci-file,
      --versions-configmap and --gotk-glob.
    reconciled_sha256: 8176f8d86fd504c1077204d99feab584048fb331ed13ebdb65d7e9f246cf0052
  # The lint profiles. No directory walk reaches these, and their drift is
  # quiet: the library tightens a rule and the local lint keeps passing.
  - lib: lint/editorconfig
    consumer: .editorconfig
    reason: >-
      Per-repo file-type sections on a shared base — `[Dockerfile*]` rather than
      `[Dockerfile]`, to cover per-app Dockerfile suffixes.
    reconciled_sha256: 9873966d0ce8a80d7ed84ecce449107b2a20387a146692ffb9aec28dd505fe02
  - lib: lint/pre-commit-config.yaml
    consumer: .pre-commit-config.yaml
    reason: >-
      Reworded header, `--unsafe` note, a yamllint hook pointed at
      lint/yamllint-relaxed.yml, a local block running this cluster's
      tool-light gates, and the whitespace hooks excluded from scripts/; the
      upstream hook set and the pinned revs are the library's.
    reconciled_sha256: f7e2dff0acee6c4787e1d89311fa72e5d089b13681ed9cd94e8b92bdcada519c
  - lib: lint/gitleaks.toml
    consumer: .gitleaks.toml
    reason: Allowlist paths and this cluster's own false-positive anchors.
    reconciled_sha256: a70051101f8045b94172594a0a89c5cf7e17aa6ad56c184843ffc5eac29891ec
