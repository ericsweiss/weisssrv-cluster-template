# Forked from weisssrv-lib `lint/ruff.toml`: same rule selection, tenant-scoped
# header. The `python-lint` CI job uses ruff's own config discovery, so this file
# is what makes the job agree with a local `ruff check` — without it ruff's
# built-in defaults flag style rules the vendored library scripts do not follow.
target-version = "py39"

[lint]
# Correctness-first selection; formatting-only rules are deliberately out.
# Rationale: weisssrv-lib lint/ruff.toml.
select = ["E4", "E7", "E9", "F", "W", "B"]
