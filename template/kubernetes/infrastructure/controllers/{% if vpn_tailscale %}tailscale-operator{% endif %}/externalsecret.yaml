---
# OAuth client the operator uses to register and manage its tailnet devices.
# Create it in the Tailscale admin console (Settings -> OAuth clients) with
# WRITE scope on Devices/Core, Keys/Auth Keys and Services, associated with the
# operator tag. Keep it distinct from the tailnet ACL client and from any
# host-join auth key. remoteRef.key is the item TITLE, .property the FIELD.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tailscale-operator-oauth
  namespace: tailscale
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: ${cluster_secret_store}
  target:
    name: operator-oauth
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: Tailscale Operator OAuth
        property: client-id
    - secretKey: client_secret
      remoteRef:
        key: Tailscale Operator OAuth
        property: client-secret
