---
# OAuth client the operator uses to register and manage its tailnet devices.
# It needs write scope on Devices, Auth Keys and Services under the operator
# tag, and stays distinct from the ACL client. key is the item title.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tailscale-operator-oauth
  namespace: tailscale
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: ${cluster_secret_store}
  target:
    name: operator-oauth
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: Tailscale Operator OAuth
        property: client-id
    - secretKey: client_secret
      remoteRef:
        key: Tailscale Operator OAuth
        property: client-secret
