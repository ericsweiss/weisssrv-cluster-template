---
# NetworkPolicy is default-deny on ingress only. Nothing here exposes a port
# and proxy pods take tailnet traffic off the CNI path, so the deny cannot
# break the data plane. Egress stays open for the proxies and for DERP.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tailscale
resources:
  - namespace.yaml
  - externalsecret.yaml
  - release.yaml
  - proxyclass.yaml

components:
  - ../../../components/netpol-baseline
