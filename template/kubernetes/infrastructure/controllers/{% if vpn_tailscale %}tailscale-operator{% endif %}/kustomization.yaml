---
# Tailscale operator: namespace, HelmRelease and netpol-baseline's ingress deny.
# Its OAuth ExternalSecret and ProxyClass are CRs in configs/tailscale-operator.
# Proxy pods take tailnet traffic off the CNI path, so the deny cannot break it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tailscale
resources:
  - namespace.yaml
  - release.yaml

components:
  - ../../../components/netpol-baseline
