---
# privileged PSA: the operator's proxy pods need NET_ADMIN for kernel-mode
# tailnet networking, which baseline/restricted forbid. Scoped to this namespace
# and to images from the pinned chart.
apiVersion: v1
kind: Namespace
metadata:
  name: tailscale
  labels:
    app.kubernetes.io/name: tailscale
    app.kubernetes.io/part-of: tailscale-operator
    app.kubernetes.io/managed-by: flux
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
