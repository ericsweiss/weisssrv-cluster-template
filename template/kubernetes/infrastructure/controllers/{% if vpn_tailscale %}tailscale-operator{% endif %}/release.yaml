---
# Watches for Services with loadBalancerClass: tailscale and gives each one a
# real tailnet device that L3-forwards to the backing Service. oauth.* is
# unset, so the chart uses the `operator-oauth` Secret ESO renders.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  interval: 30m
  # Revert out-of-band edits; the repo rule lives in traefik/release.yaml.
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: tailscale-operator
      version: "${helm_chart_versions_tailscale_operator}"
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: flux-system
      interval: 12h
  install:
    # CRITICAL: disableWait prevents a bootstrap deadlock. The operator-oauth
    # Secret comes from the configs stage, which depends on controllers, so Helm
    # --wait would block on pods that need that Secret.
    disableWait: true
    # Retry in place: the default install remediation is an uninstall, the
    # cascade the keep policy below guards against.
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    operatorConfig:
      hostname: tailscale-operator
      # The chart defaults this to "" (priority 0), below every platform
      # controller and only 10 above ci-jobs.
      priorityClassName: platform
      # The chart ships resources: {} (BestEffort); give it a floor and a memory
      # ceiling. The operator VPA right-sizes it on natural restarts.
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
    proxyConfig:
      # Tag applied to every proxy device; grant it in the tailnet ACL.
      defaultTags: "tag:k8s"
    apiServerProxyConfig:
      # Ingress/egress proxies only — not the in-process Kubernetes API proxy.
      mode: "false"
  # CRITICAL: the chart ships the tailscale.com CRDs in templates/ (installCRDs),
  # so a helm uninstall cascade-deletes every ProxyClass and the proxies built
  # from them. The keep policy stops that; a strategic merge creates the map.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apiextensions.k8s.io
              kind: CustomResourceDefinition
              name: ".*\\.tailscale\\.com"
            patch: |
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: placeholder
                annotations:
                  helm.sh/resource-policy: keep
