---
# Ingress controller for both zones: one deployment, fronted by the LoadBalancer
# Services in this directory (the chart's public VIP below, plus the siblings).
# Routes are separated by hostname and the lan-tailscale-only middleware.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 30m
  releaseName: traefik
  # Repo rule: platform HelmReleases revert out-of-band edits. Off where a chart
  # injects a webhook caBundle (cert-manager, external-secrets, metallb, vpa,
  # kube-prometheus-stack) — a reconcile would wipe it.
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: traefik
      version: "${helm_chart_versions_traefik}"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      interval: 12h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    # Flux's default is Skip, which freezes the traefik.io CRDs at their
    # first-install schema while the controller moves on.
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # `platform` (sources/priorityclasses.yaml) — the ingress path must outrank
    # apps and CI job pods when the cluster is full.
    priorityClassName: platform
    podDisruptionBudget:
      enabled: true
      minAvailable: 1

    # Chart-native autoscaling omits .spec.replicas, so a helm upgrade cannot
    # re-assert replicas:1 and drop below the HA floor. The Traefik VPA is
    # memory-only and never contends with this on CPU.
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 70
      # Require sustained pressure before adding a pod: image-pull bursts push
      # per-pod CPU well past target and, with the default 0s window, jump the
      # HPA straight to max.
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 120
          policies:
            - type: Pods
              value: 1
              periodSeconds: 60
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Pods
              value: 1
              periodSeconds: 120

    # Public VIP. externalTrafficPolicy: Local preserves the client source IP the
    # ipAllowList middlewares depend on. allocateLoadBalancerNodePorts: false drops
    # the data-plane NodePorts; MetalLB L2 announces the VIP, so nothing uses them.
    service:
      type: LoadBalancer
      annotations:
        metallb.io/loadBalancerIPs: "${cluster_metallb_public_vip}"
      spec:
        externalTrafficPolicy: Local
        allocateLoadBalancerNodePorts: false

    # api@internal (dashboard + /api/rawdata) is unauthenticated: it lists every
    # router, service backend, middleware and TLS config. The strict allowlist is
    # what keeps the pod CIDR — i.e. every workload in the cluster — out of it.
    ingressRoute:
      dashboard:
        enabled: true
        matchRule: Host(`traefik.${cluster_internal_domain}`)
        entryPoints:
          - websecure
        middlewares:
          - name: lan-tailscale-strict
            namespace: traefik
          - name: hsts-header
            namespace: traefik

    log:
      level: INFO
    accessLog:
      enabled: true
      format: json

    metrics:
      prometheus:
        enabled: true
        entryPoint: metrics
        serviceMonitor:
          enabled: true
          # Keeps Traefik's per-backend `service` label; without it Prometheus
          # renames it to exported_service and the dashboards collapse every
          # backend into one series.
          honorLabels: true

    providers:
      kubernetesCRD:
        enabled: true
        # App IngressRoutes reference the shared middlewares in this namespace.
        # Any IngressRoute may then reference another namespace's middleware or
        # Service, so review routes from untrusted authors (tenants/README.md).
        allowCrossNamespace: true
      kubernetesIngress:
        enabled: true
        publishedService:
          enabled: true

    ports:
      web:
        port: 80
      websecure:
        port: 443
        # The 60s chart default kills any request whose body takes longer,
        # such as large image pushes. 30m fits multi-GB uploads on slow links
        # while keeping a slowloris bound.
        transport:
          respondingTimeouts:
            readTimeout: 30m

    additionalArguments:
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"

    # A VIP is only announced from a node the MetalLB speaker runs on, and the
    # speaker selects this label; externalTrafficPolicy: Local then needs a
    # Traefik pod there too.
    nodeSelector:
      ${cluster_node_label_domain}/ingress: "true"

    # Preferred, not required: a hard rule leaves pods Pending whenever fewer
    # ingress nodes than replicas are available.
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: traefik
              topologyKey: kubernetes.io/hostname

    tolerations: []

    # CPU request sized so the 70% HPA target tracks real load: too small a
    # request makes every burst read as several hundred percent and pins the
    # HPA at max. Raise the request, not the threshold. Memory is the VPA's.
    resources:
      requests:
        cpu: 250m
        memory: 128Mi
      limits:
        memory: 512Mi
