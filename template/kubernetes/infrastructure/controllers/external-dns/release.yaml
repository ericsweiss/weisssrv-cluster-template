---
# Publishes DNS records for Ingresses, Services and Traefik IngressRoutes into
# the EXTERNAL zone. The internal zone is served by the LAN resolver, not here.
# The provider block is the DNS-backend seam — see ../../../README.md § Backend seams.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  interval: 30m
  releaseName: external-dns
  # Revert out-of-band edits; the repo rule lives in traefik/release.yaml.
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: external-dns
      version: "${helm_chart_versions_external_dns}"
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
      interval: 12h
  install:
    # The provider token Secret comes from the configs stage, which depends on
    # this one. Without disableWait, Helm --wait blocks on pods that block on
    # the Secret: bootstrap deadlock. Upgrades run with the Secret present.
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # `platform` (sources/priorityclasses.yaml) — outrank apps and CI job pods.
    priorityClassName: platform
    provider:
      name: cloudflare
    extraArgs:
      # Proxy public records (hides the origin IP, absorbs DDoS). Drop this for
      # records that need the origin reachable directly.
      - --cloudflare-proxied
      # IngressRoutes here and in the app template annotate with the alpha
      # prefix; external-dns >= 0.22 defaults to external-dns.kubernetes.io/.
      - --annotation-prefix=external-dns.alpha.kubernetes.io/
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: dns-api-token
            key: api-token
    sources:
      - ingress
      - service
      - traefik-proxy
    domainFilters:
      - ${cluster_external_domain}
    # Ownership registry: `policy: sync` only ever deletes records carrying
    # THIS owner's TXT record, so Terraform-managed and DDNS-managed records in
    # the same zone are never touched. Keep record names disjoint per owner.
    policy: sync
    registry: txt
    txtOwnerId: "${cluster_name}"
    txtPrefix: "_external-dns."
    logLevel: info
    logFormat: json
    interval: 5m
    triggerLoopOnEvent: true
    rbac:
      create: true
      additionalPermissions:
        - apiGroups:
            - traefik.io
          resources:
            - ingressroutes
          verbs:
            - get
            - list
            - watch
    serviceMonitor:
      enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
