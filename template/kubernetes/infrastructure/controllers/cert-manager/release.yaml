---
# This chart ships CRDs as templates gated by values.crds.enabled, not a crds/
# directory, so Flux's crds policy has no effect. crds.keep stops an uninstall
# or a failed-install remediation from taking every Certificate with it.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 30m
  releaseName: cert-manager
  # CRD upgrades take minutes while the controller revalidates existing
  # resources; a short timeout would trigger a remediation uninstall mid-upgrade.
  timeout: 10m
  chart:
    spec:
      chart: cert-manager
      version: "${helm_chart_versions_cert_manager}"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    crds:
      enabled: true
      keep: true
    replicaCount: 1
    prometheus:
      enabled: true
      servicemonitor:
        enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
    webhook:
      # 2 replicas + pdb.yaml: the webhook validates every cert-manager CR write
      # on a failurePolicy: Fail path, so a single pod fails those writes closed
      # while it drains for an unattended kured reboot.
      replicaCount: 2
      # CRITICAL: DoNotSchedule, not ScheduleAnyway. With both replicas on one
      # node the pdb.yaml minAvailable: 1 refuses the second eviction and the
      # drain never finishes. No nodeSelector here, so every node is eligible.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: webhook
              app.kubernetes.io/instance: cert-manager
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
    cainjector:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
    global:
      # `platform` (sources/priorityclasses.yaml). global.priorityClassName is
      # the chart's single key for all three controllers — controller, webhook
      # and cainjector all render it.
      priorityClassName: platform
      leaderElection:
        namespace: cert-manager
