---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Single-namespace dir: the namespace transformer places the shared components'
# NetworkPolicies here too.
namespace: cert-manager
resources:
  - namespace.yaml
  - release.yaml
  - networkpolicy.yaml

components:
  - ../../../components/netpol-baseline
  - ../../../components/netpol-egress-dns
  - ../../../components/netpol-egress-apiserver
  # ACME directory + the DNS provider API + the DNS-01 self-check.
  - ../../../components/netpol-egress-public
