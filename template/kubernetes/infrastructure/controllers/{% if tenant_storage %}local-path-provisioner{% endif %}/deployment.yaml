---
# One replica and Recreate: the provisioner runs without leader election, so
# two pods would race for the same claim. It needs only the apiserver; running
# volumes do not depend on it, so a drain that moves it costs nothing.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-path-provisioner
  labels:
    app.kubernetes.io/name: local-path-provisioner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: local-path-provisioner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: local-path-provisioner
    spec:
      serviceAccountName: local-path-provisioner-service-account
      priorityClassName: platform
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: local-path-provisioner
          image: docker.io/rancher/local-path-provisioner:${local_path_provisioner_version}
          imagePullPolicy: IfNotPresent
          command:
            - /usr/bin/local-path-provisioner
            - start
            - --config
            - /etc/config/config.json
            - --provisioner-name
            - rancher.io/tenant-local
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CONFIG_MOUNT_PATH
              value: /etc/config/
            - name: HEALTH_PORT
              value: "8080"
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: health
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            # Memory limit only, no CPU limit (docs/33).
            limits:
              memory: 128Mi
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config/
      volumes:
        - name: config-volume
          configMap:
            name: local-path-config
