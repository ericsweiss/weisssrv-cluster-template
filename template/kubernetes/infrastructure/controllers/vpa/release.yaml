---
# Vertical Pod Autoscaler. Per-workload policies live next to the workloads
# (configs/vpa/, observability/vpa.yaml, apps/*/vpa.yaml). Metrics come from the
# k3s-bundled metrics-server.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vpa
  namespace: vpa-system
spec:
  interval: 30m
  releaseName: vpa
  chart:
    spec:
      chart: vpa
      version: "${helm_chart_versions_vpa}"
      sourceRef:
        kind: HelmRepository
        name: fairwinds-stable
        namespace: flux-system
      interval: 12h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # `platform` (sources/priorityclasses.yaml). The chart's top-level key
    # covers all three controllers (recommender, updater, admissionController);
    # the certgen Jobs are one-off and stay unclassed.
    priorityClassName: platform
    recommender:
      enabled: true
      # Defaults (25m / 250Mi) floor every recommendation above what small
      # exporters actually use.
      extraArgs:
        pod-recommendation-min-cpu-millicores: 10
        pod-recommendation-min-memory-mb: 32
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
    updater:
      enabled: true
      # Upstream default --min-replicas=2 refuses to evict single-replica
      # workloads, which would make every updateMode: Auto policy inert here.
      extraArgs:
        min-replicas: "1"
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
    admissionController:
      enabled: true
      # CRITICAL: this webhook is on the admission path for every pod and is
      # failurePolicy: Ignore, so pods admitted while it is down run at the raw
      # manifest numbers. The chart renders the PDB only when replicas > 1.
      replicaCount: 2
      podDisruptionBudget:
        minAvailable: 1
      # Soft, not required: a hard rule would leave the second replica Pending
      # on a single-node or tightly-labelled cluster.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: vpa
                    app.kubernetes.io/instance: vpa
                    app.kubernetes.io/component: admission-controller
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
