---
# CRITICAL: privileged PSA, declared rather than inherited. The device-plugin
# DaemonSet hostPath-mounts the NVIDIA character devices and the kubelet
# device-plugin socket, which baseline and restricted both refuse.
# Every namespace here states its posture explicitly; warn and audit match
# enforce so the plugin's own pods do not emit permanent warnings.
apiVersion: v1
kind: Namespace
metadata:
  name: nvidia-device-plugin
  labels:
    app.kubernetes.io/name: nvidia-device-plugin
    app.kubernetes.io/managed-by: flux
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
