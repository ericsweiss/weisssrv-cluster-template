---
# Advertises the node's GPU to the kubelet as the nvidia.com/gpu extended
# resource. Exports NO metrics — a GPU node is dark in Grafana until you add an
# exporter; see "GPU telemetry" in ../../observability/README.md.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvidia-device-plugin
  namespace: nvidia-device-plugin
spec:
  interval: 30m
  releaseName: nvidia-device-plugin
  # Revert out-of-band edits; the repo rule lives in traefik/release.yaml.
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: nvidia-device-plugin
      version: "${helm_chart_versions_nvidia_device_plugin}"
      sourceRef:
        kind: HelmRepository
        name: nvidia
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    runtimeClassName: nvidia
    nodeSelector:
      ${cluster_node_label_domain}/gpu: nvidia
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
    # Null, not {}: Helm deep-merges maps, so an empty map keeps the chart's
    # Node Feature Discovery requirement and the DaemonSet sits at DESIRED=0.
    # Null removes the key, leaving the nodeSelector above in charge.
    affinity:
      nodeAffinity: null
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        memory: 64Mi
    # Time-slicing advertises one physical GPU as 4 shareable units. It shares
    # compute, not VRAM, so co-scheduled workloads must fit in the card's
    # memory together. `default: any` applies map.any to unlabelled nodes.
    config:
      default: any
      map:
        any: |-
          version: v1
          flags:
            migStrategy: none
          sharing:
            timeSlicing:
              resources:
                - name: nvidia.com/gpu
                  replicas: 4
  # `config.map` makes the chart inject a config-manager sidecar for which it
  # exposes no values key, so it renders with no requests and no memory limit.
  postRenderers:
    - kustomize:
        patches:
          # target.name is a FULL-match regex, so this hits only the plugin
          # DaemonSet, not the mps-control-daemon one rendered beside it.
          - target:
              group: apps
              version: v1
              kind: DaemonSet
              name: nvidia-device-plugin
            patch: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: nvidia-device-plugin
              spec:
                template:
                  spec:
                    containers:
                      - name: nvidia-device-plugin-sidecar
                        resources:
                          requests:
                            cpu: 10m
                            memory: 16Mi
                          limits:
                            memory: 32Mi
