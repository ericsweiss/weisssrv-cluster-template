---
# L2 load balancer for the ingress VIPs. Pools + L2Advertisement live in the
# configs stage (they are CRs this chart's CRDs define).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 30m
  releaseName: metallb
  chart:
    spec:
      chart: metallb
      version: "${helm_chart_versions_metallb}"
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: flux-system
      interval: 12h
  install:
    # RetryOnFailure, not the default RemediateOnFailure: install remediation
    # uninstalls the release, tearing down the speaker and controller. Retrying in
    # place does not; the CRDs are separately pinned by the keep policy below.
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # The chart owns the metallb.io CRDs; see the CRITICAL note at postRenderers.
    crds:
      enabled: true
    prometheus:
      serviceMonitor:
        enabled: true
      # The chart authorises exactly ONE (ServiceAccount, namespace) pair to
      # scrape through its kube-rbac-proxy — it must be Prometheus's identity,
      # not MetalLB's own.
      serviceAccount: kube-prometheus-stack-prometheus
      namespace: observability
    speaker:
      # `platform` (sources/priorityclasses.yaml). The chart has no global key,
      # so controller and speaker are set separately.
      priorityClassName: platform
      # A VIP flow is filtered by the ANNOUNCING guest's firewall, so only nodes
      # carrying sg-k3s-ingress-* may announce one. Label them in hosts.yml
      # (k3s_labels) before bootstrap: with no carrier, no VIP is announced.
      nodeSelector:
        ${cluster_node_label_domain}/ingress: "true"
      tolerations: []
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
    # L2-only cluster: no BGP, so neither FRR mode runs and the speaker pod is
    # the single speaker container.
    frrk8s:
      enabled: false
    controller:
      priorityClassName: platform
      nodeSelector: {}
      tolerations: []
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
  # CRITICAL: the chart must own the metallb.io CRDs. With crds.enabled false a
  # version switch renders them as deletions, and a helm uninstall cascade-deletes
  # them; either takes every IPAddressPool and VIP. The keep policy stops the
  # uninstall cascade; a strategic merge creates metadata.annotations.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apiextensions.k8s.io
              kind: CustomResourceDefinition
              name: ".*\\.metallb\\.io"
            patch: |
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: placeholder
                annotations:
                  helm.sh/resource-policy: keep
