---
# L2 load balancer for the ingress VIPs. Pools + L2Advertisement live in the
# configs stage (they are CRs this chart's CRDs define).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 30m
  releaseName: metallb
  chart:
    spec:
      chart: metallb
      version: "${helm_chart_versions_metallb}"
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: flux-system
      interval: 12h
  install:
    # RetryOnFailure, not the default RemediateOnFailure: install remediation
    # uninstalls the release, tearing down the speaker and controller. Retrying in
    # place does not; the CRDs are separately pinned by the keep policy below.
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # crds.enabled MUST stay true. With it false, a chart version change renders
    # the CRD templates as deletions and takes every IPAddressPool +
    # L2Advertisement with them — i.e. every LoadBalancer IP goes <pending>.
    crds:
      enabled: true
    prometheus:
      serviceMonitor:
        enabled: true
      # The chart authorises exactly ONE (ServiceAccount, namespace) pair to
      # scrape through its kube-rbac-proxy — it must be Prometheus's identity,
      # not MetalLB's own.
      serviceAccount: kube-prometheus-stack-prometheus
      namespace: observability
    speaker:
      # `platform` (sources/priorityclasses.yaml). The chart has no global key,
      # so controller and speaker are set separately.
      priorityClassName: platform
      # A VIP flow is filtered by the ANNOUNCING guest's firewall, so only nodes
      # carrying sg-k3s-ingress-* may announce one. Label them in hosts.yml
      # (k3s_labels) before bootstrap: with no carrier, no VIP is announced.
      nodeSelector:
        ${cluster_node_label_domain}/ingress: "true"
      tolerations: []
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
      frr:
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 256Mi
    controller:
      priorityClassName: platform
      nodeSelector: {}
      tolerations: []
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
  # The chart owns the metallb.io CRDs, so a helm uninstall cascade-deletes
  # every IPAddressPool and L2Advertisement. The keep policy stops that; a
  # strategic merge creates metadata.annotations.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apiextensions.k8s.io
              kind: CustomResourceDefinition
              name: ".*\\.metallb\\.io"
            patch: |
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: placeholder
                annotations:
                  helm.sh/resource-policy: keep
          # The chart exposes no values key for the speaker's reloader and
          # frr-metrics sidecars, so bound them here.
          - target:
              group: apps
              version: v1
              kind: DaemonSet
              name: metallb-speaker
            patch: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: metallb-speaker
              spec:
                template:
                  spec:
                    containers:
                      - name: reloader
                        resources:
                          limits:
                            memory: 64Mi
                      - name: frr-metrics
                        resources:
                          requests:
                            memory: 64Mi
                          limits:
                            memory: 128Mi
