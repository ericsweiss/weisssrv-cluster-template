---
# Webhook source cannot be pinned by IP (apiserver call, post-DNAT); the
# webhook's own TLS is the authenticity control.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-webhook-and-metrics-ingress
  namespace: metallb-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 9443
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 7472
