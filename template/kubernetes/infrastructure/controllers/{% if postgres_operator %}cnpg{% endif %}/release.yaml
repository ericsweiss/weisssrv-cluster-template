---
# CloudNativePG operator, cluster-wide. Its CRDs own every tenant database
# object, so they are kept through an uninstall twice over: the chart stamps
# resource-policy keep and the postRenderer below pins it if upstream drops it.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg
  namespace: cnpg-system
spec:
  interval: 30m
  releaseName: cnpg
  chart:
    spec:
      chart: cloudnative-pg
      version: "${helm_chart_versions_cloudnative_pg}"
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: flux-system
      interval: 12h
  install:
    # RetryOnFailure, not the default RemediateOnFailure: install remediation
    # uninstalls the release, which would cascade-delete the CRDs and CRs.
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apiextensions.k8s.io
              kind: CustomResourceDefinition
              name: ".*\\.postgresql\\.cnpg\\.io"
            patch: |
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: placeholder
                annotations:
                  helm.sh/resource-policy: keep
  values:
    # The plugin docs and kubectl-cnpg both look the operator up by this name.
    fullnameOverride: cnpg-controller-manager
    priorityClassName: platform
    crds:
      create: true
    config:
      clusterWide: true
    monitoring:
      podMonitorEnabled: true
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      # Memory limit only, no CPU limit.
      limits:
        memory: 512Mi
