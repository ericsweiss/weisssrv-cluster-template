---
# Coordinated node reboots: the maintenance playbooks only touch the sentinel
# file and each node reboots itself under a cluster-wide lock. A playbook that
# drained nodes would evict its own in-cluster CI executor pod and deadlock.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kured
  namespace: kube-system
spec:
  interval: 30m
  releaseName: kured
  # Revert out-of-band edits; the repo rule lives in traefik/release.yaml.
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: kured
      version: "${helm_chart_versions_kured}"
      sourceRef:
        kind: HelmRepository
        name: kured
        namespace: flux-system
      interval: 12h
  # disableWait: this is a DaemonSet in a wait:true Kustomization — one NotReady
  # node (e.g. mid-reboot) would otherwise stall the whole controllers stage.
  install:
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    disableWait: true
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    configuration:
      period: "5m"
      # One node at a time — this is what keeps the etcd quorum safe.
      concurrency: 1
      # Non-expiring lock: a time-based steal has no health check on the holder,
      # so it could reboot a second server while the first is still down.
      # Clearing a stuck lock: docs/RUNBOOKS.md, coordinated reboots.
      lockTtl: "0"
      # Never force: on drain failure leave the sentinel set and retry next
      # period rather than hard-killing pods.
      drainTimeout: "5m"
      forceReboot: false
      # Auto-clears on reboot because /var/run is a tmpfs symlink to /run — a
      # system where it is not would loop-reboot.
      rebootSentinel: "/var/run/reboot-required"
      rebootCommand: "/bin/systemctl reboot"
      annotateNodes: true
      # Never reboot a node out from under an INFRASTRUCTURE-tier CI job pod;
      # shared-tier jobs are not blocked. Harmless if no pod carries the label.
      blockingPodSelector:
        - ${cluster_node_label_domain}/runner-class=infrastructure
    # Reboot-orchestration metrics, so a stuck or blocked reboot cycle is
    # alertable directly rather than only via node conditions.
    service:
      create: true
    metrics:
      create: true
    # Per-node agent: must run everywhere, including tainted nodes.
    tolerations:
      - operator: Exists
    priorityClassName: system-node-critical
    rbac:
      create: true
    serviceAccount:
      create: true
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 96Mi
