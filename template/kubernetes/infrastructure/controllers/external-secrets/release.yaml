---
# External Secrets Operator; provider selection is per-store, in
# infrastructure/configs/cluster-secret-store.yaml. CRDs ship as chart
# templates, so the resource-policy annotation is what keeps them installed.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 30m
  chart:
    spec:
      chart: external-secrets
      version: "${helm_chart_versions_external_secrets}"
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
      interval: 12h
  install:
    # RetryOnFailure, not the default RemediateOnFailure: install remediation
    # remediates by uninstalling, which cascade-deletes the ESO CRDs and CRs.
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # `platform` (sources/priorityclasses.yaml). The chart has no global key —
    # the controller reads the top-level one and webhook/certController each
    # read their own, so all three are set.
    priorityClassName: platform
    serviceMonitor:
      enabled: true
    installCRDs: true
    crds:
      annotations:
        helm.sh/resource-policy: keep
    replicaCount: 2
    leaderElect: true
    # CRITICAL: DoNotSchedule, not a preferred rule. With both replicas on one
    # node the pdb.yaml minAvailable: 1 refuses the second eviction and a kured
    # drain never finishes. matchLabelKeys keeps a rollout unblocked.
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        matchLabelKeys:
          - pod-template-hash
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: external-secrets
    webhook:
      replicaCount: 2
      priorityClassName: platform
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 128Mi
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: external-secrets-webhook
    certController:
      replicaCount: 2
      priorityClassName: platform
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 128Mi
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: external-secrets-cert-controller
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
