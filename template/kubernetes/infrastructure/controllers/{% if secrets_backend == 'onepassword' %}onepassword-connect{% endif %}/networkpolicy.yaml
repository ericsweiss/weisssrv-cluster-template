---
# Connect's API is reachable only from the ESO pods, plus Traefik for the
# internal ingress that host-side clients, such as boot-time storage key
# fetches, use. Kubelet probes come from the host network and bypass policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: onepassword-connect
  namespace: external-secrets
spec:
  podSelector:
    matchLabels:
      app: onepassword-connect
  policyTypes:
    - Ingress
  ingress:
    # ESO calls the API port only; the sync sidecar talks to it over localhost.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: external-secrets
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 8080

---
# The egress half: the external-secrets namespace runs default-deny egress, so
# ESO needs this to reach Connect. Matched by pod, not ClusterIP, because
# kube-proxy DNATs before policy evaluation.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-onepassword-connect
  namespace: external-secrets
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: external-secrets
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: onepassword-connect
      ports:
        - protocol: TCP
          port: 8080
