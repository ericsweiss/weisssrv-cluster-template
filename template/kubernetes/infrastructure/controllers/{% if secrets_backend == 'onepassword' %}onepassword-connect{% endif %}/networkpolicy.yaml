---
# Connect's API is reachable only from ESO in the same namespace, plus Traefik
# for the internal ingress that host-side clients (e.g. boot-time storage
# key fetches) use. Kubelet probes come from the host network and bypass policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: onepassword-connect
  namespace: external-secrets
spec:
  podSelector:
    matchLabels:
      app: onepassword-connect
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
    # Only the API port is published; the sync sidecar stays in-namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 8080

---
# The egress half of the same contract: the external-secrets namespace runs
# default-deny egress, so ESO needs this to reach Connect. Matched by pod, not
# ClusterIP — kube-proxy DNATs before policy evaluation.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-onepassword-connect
  namespace: external-secrets
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: external-secrets
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: onepassword-connect
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
