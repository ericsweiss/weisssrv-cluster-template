---
# 1Password Connect: connect-sync pulls vault data into a local encrypted
# cache and connect-api serves ESO reads from it, with no cloud round-trip.

# The op-credentials and onepassword-connect-token Secrets are created by hand
# in the external-secrets namespace, as https://github.com/ericsweiss/weisssrv-cluster-template/blob/main/docs/PRE-SETUP.md describes. They are
# the only hand-created Secrets in the cluster.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: onepassword-connect
  namespace: external-secrets
spec:
  interval: 30m
  # Revert out-of-band edits (repo rule in traefik/release.yaml). This chart
  # renders .spec.replicas while its own HPA scales past it, so that one path
  # must be ignored or every reconcile would scale back to the floor.
  driftDetection:
    mode: enabled
    ignore:
      - paths: ["/spec/replicas"]
        target:
          kind: Deployment
          name: onepassword-connect
  chart:
    spec:
      chart: connect
      version: "${helm_chart_versions_onepassword_connect}"
      sourceRef:
        kind: HelmRepository
        name: onepassword-connect
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    connect:
      # Empty on purpose: the chart then mounts the pre-existing op-credentials
      # Secret instead of expecting the credentials inline.
      credentials_base64: ""
      serviceType: ClusterIP
      # `platform` (sources/priorityclasses.yaml). Only the connect key is set:
      # operator.create is false below, so the operator pod never renders.
      priorityClassName: platform
      replicas: 2
      # Chart-native HPA on CPU only; the Connect VPA is memory-only so the two
      # never drive the same resource. replicas stays equal to minReplicas so
      # the static count cannot flap against the HPA.
      hpa:
        enabled: true
        minReplicas: 2
        maxReplicas: 3
        avgCpuUtilization: 80
        avgMemoryUtilization: 0
      # Preferred, not required: a hard one-per-host rule leaves the third
      # replica unschedulable on a small cluster and blocks failover during a
      # drain. The PDB is what guards voluntary disruption.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: onepassword-connect
                topologyKey: kubernetes.io/hostname
      api:
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 256Mi
      sync:
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 256Mi
    operator:
      create: false
  # Connect never calls the Kubernetes API, and the chart exposes no automount
  # value — patch the token projection off the rendered Deployment.
  postRenderers:
    - kustomize:
        patches:
          - patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: onepassword-connect
              spec:
                template:
                  spec:
                    automountServiceAccountToken: false
