---
# Holds the HelmRelease bookkeeping for a chart of cluster-scoped CRDs; no pod
# runs here. PSA is declared at the strictest level so a pod that lands here by
# accident is refused rather than admitted under the cluster default.
apiVersion: v1
kind: Namespace
metadata:
  name: prometheus-operator-crds
  annotations:
    # CRITICAL: same opt-out as the HelmRelease (release.yaml). Pruning this
    # Namespace cascade-deletes the namespaced HelmRelease, which triggers a
    # `helm uninstall` of every monitoring.coreos.com CRD and CR.
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    app.kubernetes.io/name: prometheus-operator-crds
    app.kubernetes.io/part-of: kube-prometheus-stack
    app.kubernetes.io/managed-by: flux
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
