---
# The monitoring.coreos.com CRDs, in their own stage before controllers: the
# Traefik chart renders a ServiceMonitor and hard-fails without them. This
# chart owns them, so kube-prometheus-stack sets crds.enabled false.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-operator-crds
  namespace: prometheus-operator-crds
  annotations:
    # Pruning this release would `helm uninstall` it and take every
    # monitoring.coreos.com CRD — and every CR — with it.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  interval: 30m
  releaseName: prometheus-operator-crds
  # Revert out-of-band edits; the repo rule lives in traefik/release.yaml.
  driftDetection:
    mode: enabled
  timeout: 10m
  chart:
    spec:
      chart: prometheus-operator-crds
      version: "${helm_chart_versions_prometheus_operator_crds}"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 12h
  install:
    # RetryOnFailure, not the default RemediateOnFailure: a failed install
    # otherwise remediates by uninstalling, which cascade-deletes every
    # monitoring.coreos.com CRD and CR.
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # Keeps the CRDs through any helm uninstall of this release, the protection
    # cert-manager gets from crds.keep and ESO from crds.annotations. All CRDs
    # stay enabled (chart default), matching what kube-prometheus-stack expects.
    crds:
      annotations:
        helm.sh/resource-policy: keep
