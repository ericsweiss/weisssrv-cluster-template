# Pod-layer controls for the observability namespace. Loki runs
# auth_enabled=false and Prometheus, Alertmanager and Grafana are unguarded at
# the pod layer, so their ClusterIPs are open to any pod without these.

---
# Intra-namespace ingress: Prometheus scrapes every component here, Grafana
# queries Prometheus and Loki, the operator talks to its workloads.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace-ingress
  namespace: observability
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability

---
# Loki :3100 — push ingestion from host-side collectors arrives via the Traefik
# ingress; the in-cluster Alloy DaemonSet is covered by the intra-namespace rule.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-loki-ingress
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: loki
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 3100

---
# Grafana UI from Traefik only. Prometheus :9090 / Alertmanager :9093 have no
# ingress route (access is kubectl port-forward); add a per-port allowance here
# if one is ever created.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ui-ingress-from-traefik
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 3000

---
# prometheus-operator admission webhook (:10250, TLS), called by the apiserver.
# It arrives as the node's pod-network gateway address, so the peer is the pod
# CIDR; the LAN CIDR covers a call that leaves the node unmasqueraded.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-operator-admission-webhook
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kube-prometheus-stack-prometheus-operator
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: ${cluster_pod_cidr}
        - ipBlock:
            cidr: ${cluster_lan_cidr}
      ports:
        - protocol: TCP
          port: 10250
