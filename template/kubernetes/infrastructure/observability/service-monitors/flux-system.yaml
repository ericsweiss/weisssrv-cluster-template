---
# Flux controller metrics on :8080. Only some controllers have Services and
# those do not expose the metrics port, so this is a PodMonitor selecting on
# the label every controller pod carries.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: flux-system
  namespace: observability
spec:
  namespaceSelector:
    matchNames:
      - flux-system
  selector:
    matchLabels:
      app.kubernetes.io/part-of: flux
  podMetricsEndpoints:
    - port: http-prom
      interval: 30s
      path: /metrics
