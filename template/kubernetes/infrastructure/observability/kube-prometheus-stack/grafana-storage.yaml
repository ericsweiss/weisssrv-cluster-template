---
# Grafana state on NFS, so Grafana can float to any node. The storage host's
# Ansible role creates and owns the export directory, so a from-scratch build
# needs the storage deploy rather than a manual mkdir.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: grafana-data
  annotations:
    # Lets Flux delete+recreate this PV if spec.nfs (server or path) changes -
    # the only immutable field here; Retain keeps the data. The PVC must be gone
    # first: a Bound PV blocks on the pv-protection finalizer.
    kustomize.toolkit.fluxcd.io/force: "Enabled"
  labels:
    app: grafana
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: observability
    name: grafana-data
  nfs:
    # Hostname, not IP: xprtsec=tls verifies the server certificate, whose SAN
    # covers the name and not the address. An IP mount fails the handshake.
    server: ${cluster_nas_host}
    path: /appdata/grafana
  mountOptions:
    - nfsvers=4.2
    - hard
    - noatime
    # NFSv4-over-TLS. Requires tlshd on every node (nfs_tls role) and an export
    # that permits or requires xprtsec=tls. Drop this option if the export is
    # plaintext — it is the one line that decides whether the mount is encrypted.
    - xprtsec=tls
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: observability
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: grafana-data
  resources:
    requests:
      storage: 1Gi
