---
# Prometheus TSDB volume: a hostPath on the storage node over a dedicated block
# device at /mnt/prometheus-data (Ansible provisions it, not Kubernetes). Node
# affinity is by label, so replacing the node needs no edit here.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: prometheus-data
  labels:
    type: local
    app: prometheus
spec:
  capacity:
    storage: 150Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  # Pre-bound: a classless RWO PV is otherwise claimable by any classless RWO
  # PVC <= 150Gi in any namespace. The name is
  # <volumeClaimTemplate>-<statefulset>-<ordinal> and moves with the release name.
  claimRef:
    namespace: observability
    name: prometheus-kube-prometheus-stack-prometheus-db-prometheus-kube-prometheus-stack-prometheus-0
  hostPath:
    path: /mnt/prometheus-data
    type: Directory
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: ${cluster_node_label_domain}/nas
              operator: In
              values:
                - "true"
