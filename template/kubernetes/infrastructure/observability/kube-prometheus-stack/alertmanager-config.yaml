---
# Alertmanager configuration, rendered by ESO from the secrets backend.
#
# The config is a Secret (not a plain ConfigMap) because it embeds credentials.
# Values are interpolated through the `quote` template function so a rotated
# password or a webhook URL containing special characters stays valid YAML.
# webhook_url is used rather than webhook_url_file: the Prometheus Operator's
# config parser does not support the _file suffix for every receiver type.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-config
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: ${cluster_secret_store}
  target:
    name: alertmanager-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        alertmanager.yaml: |
          global:
            smtp_smarthost: "${cluster_smtp_host}:587"
            smtp_from: "Alertmanager <alertmanager@${cluster_internal_domain}>"
            smtp_require_tls: true
            smtp_auth_username: {{ .smtpUsername | quote }}
            smtp_auth_password: {{ .smtpPassword | quote }}

          inhibit_rules:
            - source_matchers:
                - severity="critical"
              target_matchers:
                - severity="warning"
              equal:
                - alertname
                - namespace
            # The warning/critical pairs below use DIFFERENT alertnames, so the
            # generic rule above never matches them. Each pairs on its own
            # identity labels — keyed too coarsely, one object crossing critical
            # would silence a different object's warning on the same host.
            - source_matchers:
                - alertname="DiskUsageCritical"
              target_matchers:
                - alertname="DiskUsageWarning"
              equal:
                - instance
                - mountpoint
            - source_matchers:
                - alertname="InodeUsageCritical"
              target_matchers:
                - alertname="InodeUsageWarning"
              equal:
                - instance
                - mountpoint
            - source_matchers:
                - alertname="PVCUsageCritical"
              target_matchers:
                - alertname="PVCUsageWarning"
              equal:
                - namespace
                - persistentvolumeclaim
            - source_matchers:
                - alertname="CertExpiringCritical"
              target_matchers:
                - alertname="CertExpiringWarning"
              equal:
                - namespace
                - name
            - source_matchers:
                - alertname="InfoInhibitor"
              target_matchers:
                - severity="info"
            # Node-outage storm control: while a node is down, per-pod and
            # per-workload warnings are noise, so they stay suppressed for as
            # long as the node is NotReady. Tradeoff: an unrelated pod failure
            # elsewhere is also suppressed during the window. Criticals are
            # deliberately NOT inhibited — a serialized reboot must never lose
            # quorum, so their firing is a genuine signal. EndpointDown and
            # TargetDown are also excluded: they cover off-cluster
            # infrastructure whose health is independent of node readiness.
            - source_matchers:
                - alertname=~"KubeNodeNotReady|KubeNodeUnreachable"
              target_matchers:
                - alertname=~"KubePodNotReady|KubeContainerWaiting|KubeDaemonSetRolloutStuck|KubeDaemonSetMisScheduled|KubeDeploymentReplicasMismatch|KubeStatefulSetReplicasMismatch|KubeletInstanceUnreachable|KubeAggregatedAPIDown|NodeSystemSaturation"

          route:
            receiver: chat-default
            # instance is included so host-level (non-namespaced) alerts group
            # per-host instead of collapsing into one empty-namespace bucket.
            group_by:
              - alertname
              - namespace
              - instance
            group_wait: 30s
            group_interval: 10m
            repeat_interval: 4h
            routes:
              # Dead-man's switch: the chart's Watchdog alert always fires, and
              # the external heartbeat service alarms when the pings STOP — i.e.
              # when Prometheus, Alertmanager, the node, or notification egress is
              # down. This is the only signal that survives a total
              # observability-plane outage, including loss of DNS (on which the
              # SMTP and chat receivers depend). MUST precede the severity=none
              # null route: Watchdog carries severity=none, and InfoInhibitor
              # (also severity=none) must stay null-routed.
              - receiver: watchdog-heartbeat
                matchers:
                  - alertname="Watchdog"
                group_wait: 0s
                group_interval: 1m
                repeat_interval: 1m
              - receiver: "null"
                matchers:
                  - severity="none"
              - receiver: email-and-chat
                matchers:
                  - severity="critical"
              - receiver: chat-default
                matchers:
                  - severity="warning"
                repeat_interval: 12h

          receivers:
            - name: "null"
            # Any POST counts as a ping; send_resolved false because Watchdog
            # never resolves (the switch pages on silence, not on content).
            - name: watchdog-heartbeat
              webhook_configs:
                - url: {{ .healthchecksPingUrl | quote }}
                  send_resolved: false
            # Generic JSON webhook — works with a chat bridge, ntfy, or any
            # receiver that accepts an Alertmanager POST. Swap to slack_configs /
            # discord_configs / msteams_configs if you prefer the native
            # integration; the routes above do not change.
            - name: chat-default
              webhook_configs:
                - url: {{ .alertWebhookUrl | quote }}
                  send_resolved: true
            - name: email-and-chat
              email_configs:
                - to: "${cluster_alert_email}"
                  send_resolved: true
              webhook_configs:
                - url: {{ .alertWebhookUrl | quote }}
                  send_resolved: true
  data:
    - secretKey: alertWebhookUrl
      remoteRef:
        key: Alertmanager Webhook
        property: url
    - secretKey: smtpUsername
      remoteRef:
        key: SMTP Relay Auth
        property: username
    - secretKey: smtpPassword
      remoteRef:
        key: SMTP Relay Auth
        property: password
    # Heartbeat ping URL for the Watchdog dead-man's switch. Until the item
    # exists ESO keeps serving the last rendered Secret and
    # ExternalSecretSyncFailure fires — create it before first reconcile.
    - secretKey: healthchecksPingUrl
      remoteRef:
        key: Healthchecks Watchdog
        property: ping url
