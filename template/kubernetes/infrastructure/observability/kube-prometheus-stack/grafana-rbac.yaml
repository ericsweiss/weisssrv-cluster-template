---
# Replaces the grafana subchart's ClusterRole+Binding (grafana.rbac.create:
# false). The chart's version grants cluster-wide secrets get/list/watch
# whenever a sidecar is on; both sidecars here read ConfigMaps only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-prometheus-stack-grafana-configmaps
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: kube-prometheus-stack
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "watch", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-prometheus-stack-grafana-configmaps
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: kube-prometheus-stack
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-prometheus-stack-grafana-configmaps
subjects:
  - kind: ServiceAccount
    name: kube-prometheus-stack-grafana
    namespace: observability
