---
# kube-prometheus-stack — Prometheus, Alertmanager, Grafana, node-exporter and
# kube-state-metrics. Chart version and every site value are substituted at
# reconcile time (cluster-versions / cluster-config ConfigMaps).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: observability
spec:
  interval: 30m
  releaseName: kube-prometheus-stack
  # CRD install and Prometheus startup can take several minutes.
  timeout: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "${helm_chart_versions_kube_prometheus_stack}"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 12h
  install:
    # The monitoring.coreos.com CRDs are owned by the infrastructure-crds stage,
    # which runs before controllers so a fresh bootstrap has them when any
    # controller renders a ServiceMonitor. crds.enabled:false below stops this
    # chart shipping its own copies; crds:Skip stops Helm managing them.
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    crds: Skip
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    crds:
      enabled: false

    # -------------------------------------------------------------------------
    # Prometheus
    # -------------------------------------------------------------------------
    prometheus:
      prometheusSpec:
        # Runs as nobody (65534); fsGroup makes the PV writable.
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          fsGroup: 65534

        # Pinned to the storage node, where the statically-provisioned TSDB
        # volume lives (storage.yaml).
        nodeSelector:
          ${cluster_node_label_domain}/nas: "true"
        tolerations:
          - key: ${cluster_node_label_domain}/nas
            operator: Equal
            value: "true"
            effect: PreferNoSchedule

        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: ""
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 150Gi
              volumeName: prometheus-data

        # retentionSize bounds persisted blocks only — the WAL, the head being
        # flushed and compaction scratch consume more on top. Hold it well under
        # the PV size so those non-block costs have room.
        retention: 365d
        retentionSize: 120GB

        # Discover ServiceMonitors, PodMonitors and PrometheusRules in ALL
        # namespaces, so an app module ships its own without editing this file.
        serviceMonitorSelectorNilUsesHelmValues: false
        serviceMonitorNamespaceSelector: {}
        podMonitorSelectorNilUsesHelmValues: false
        podMonitorNamespaceSelector: {}
        ruleSelectorNilUsesHelmValues: false
        ruleNamespaceSelector: {}

        # VPA is Off for Prometheus (recording-only) — these are hand-tuned.
        resources:
          requests:
            cpu: 200m
            memory: 2Gi
          limits:
            memory: 4Gi

    # -------------------------------------------------------------------------
    # Alertmanager
    # -------------------------------------------------------------------------
    alertmanager:
      alertmanagerSpec:
        configSecret: alertmanager-config
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 128Mi

    # -------------------------------------------------------------------------
    # Grafana
    # -------------------------------------------------------------------------
    grafana:
      # Ingress is a Traefik IngressRoute (ingress/).
      ingress:
        enabled: false

      grafana.ini:
        server:
          root_url: https://grafana.${cluster_internal_domain}

        # SSO-ONLY, AND THAT MEANS ALL THREE OF THE SETTINGS BELOW. The chart
        # ships a built-in `admin` account whose password is a WELL-KNOWN
        # CHART DEFAULT (`prom-operator`), and that account is a Grafana Admin:
        # it can read every datasource, run arbitrary queries against Prometheus
        # and Loki, edit dashboards and mint API tokens.
        #
        #   disable_login_form            removes the browser login form, but
        #                                 ONLY the browser form — it does not
        #                                 close the HTTP path.
        #   auth.basic.enabled=false      closes that path. Without it, anyone
        #                                 who can reach the ingress can still
        #                                 `curl -u admin:prom-operator .../api/...`
        #                                 and get full Admin.
        #   disable_initial_admin_creation removes the account itself, so the
        #                                 chart's password authenticates nothing
        #                                 even if basic auth is re-enabled later.
        #
        # Authorization then comes entirely from the OIDC role mapping below:
        # the first member of the admin group to sign in becomes a Grafana
        # Admin. Running WITHOUT an identity provider means deleting all three
        # of these AND the OIDC block, and setting a real admin password
        # (`grafana.admin.existingSecret` pointed at an ESO-managed Secret) —
        # never leaving the chart default in place.
        #
        # BREAK-GLASS (identity provider down, nobody can sign in): temporarily
        # set disable_login_form: false, auth.basic.enabled: true and
        # disable_initial_admin_creation: false, wire
        # `grafana.admin.existingSecret` to a Secret you control, reconcile, fix
        # the IdP, then revert. Do not leave that state committed.
        auth:
          disable_login_form: true
        auth.basic:
          enabled: false
        security:
          disable_initial_admin_creation: true

        analytics:
          check_for_updates: false
          check_for_plugin_updates: false
          reporting_enabled: false
          feedback_links_enabled: false

      # OIDC via the cluster's identity provider (apps/authentik). Users in the
      # grafana-users group get Viewer, grafana-admins get Admin — create both
      # groups in the IdP.
      env:
        GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
        GF_AUTH_GENERIC_OAUTH_NAME: "SSO"
        GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
        GF_AUTH_GENERIC_OAUTH_SCOPES: "openid profile email"
        GF_AUTH_GENERIC_OAUTH_AUTH_URL: "https://auth.${cluster_internal_domain}/application/o/authorize/"
        GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "https://auth.${cluster_internal_domain}/application/o/token/"
        GF_AUTH_GENERIC_OAUTH_API_URL: "https://auth.${cluster_internal_domain}/application/o/userinfo/"
        GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups, 'grafana-admins') && 'Admin' || contains(groups, 'grafana-users') && 'Viewer' || ''"
        GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "true"

      envValueFrom:
        GF_AUTH_GENERIC_OAUTH_CLIENT_ID:
          secretKeyRef:
            name: observability-secrets
            key: grafana-oidc-client-id
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
          secretKeyRef:
            name: observability-secrets
            key: grafana-oidc-client-secret

      # Dashboard sidecar — discovers ConfigMaps labelled grafana_dashboard in
      # every namespace, so app modules ship their own dashboards.
      #
      # skipReload on BOTH sidecars follows from the SSO-only posture above. By
      # default each sidecar POSTs Grafana's /api/admin/provisioning/*/reload
      # endpoint using the built-in admin account over HTTP basic auth — a path
      # that no longer exists, so every write would log a 401 and reload nothing.
      #
      # Dashboards need nothing further: Grafana's file provisioner rescans the
      # provisioning directory on its own interval (~10s).
      #
      # DATASOURCES DO. Grafana reads datasource provisioning files ONLY at
      # startup, and the Prometheus datasource itself arrives as a
      # sidecar-discovered ConfigMap from this chart. Without initDatasources the
      # sidecar would write that file just after Grafana had already finished
      # provisioning, and a fresh install would come up with NO datasource until
      # something restarted the pod. initDatasources adds the sidecar as an
      # init container so every datasource file exists before Grafana starts —
      # the chart documents it as the required companion to skipReload.
      sidecar:
        dashboards:
          enabled: true
          label: grafana_dashboard
          labelValue: "1"
          searchNamespace: ALL
          folderAnnotation: grafana_folder
          skipReload: true
        datasources:
          # Fixed UID so dashboard JSON can reference "prometheus".
          uid: prometheus
          skipReload: true
          initDatasources: true

      additionalDataSources:
        - name: Loki
          type: loki
          uid: loki
          url: http://loki.observability.svc.cluster.local:3100
          access: proxy
          isDefault: false

      persistence:
        enabled: true
        type: pvc
        existingClaim: grafana-data

      # The NFS export squashes all operations to a fixed uid:gid and does not
      # permit chown, so the init-chown-data container can only fail.
      initChownData:
        enabled: false

      # NFS-ESTALE self-heal. After a NAS reboot an established mount returns
      # stale file handles that Grafana never recovers from — the pod has to be
      # deleted by hand. Replace the default httpGet liveness with a stat of the
      # mount: it surfaces ESTALE (immediate error) or a hung hard-mount (probe
      # timeout), either of which restarts the pod so it remounts. The chart's
      # readinessProbe is left alone, preserving app-health de-rotation.
      #
      # httpGet MUST be explicitly nulled: Helm deep-merges into the subchart
      # defaults, whose livenessProbe carries httpGet — without the null the
      # rendered probe has two handlers and the apiserver rejects the Deployment
      # ("may not specify more than 1 handler type"). Schema validation cannot
      # catch this; only a live upgrade does.
      livenessProbe:
        httpGet: null
        exec:
          command:
            - sh
            - -c
            - stat /var/lib/grafana >/dev/null 2>&1 || exit 1
        initialDelaySeconds: 30
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 3

      # SQLite on a network filesystem cannot tolerate two writers, and
      # RollingUpdate runs old+new pods against the same DB on every upgrade.
      # rollingUpdate must be nulled explicitly: a live Deployment created as
      # RollingUpdate keeps those defaults, and the API rejects the combination
      # ("rollingUpdate: Forbidden ... when strategy type is 'Recreate'").
      deploymentStrategy:
        type: Recreate
        rollingUpdate: null

      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1Gi

    # -------------------------------------------------------------------------
    # node-exporter
    # -------------------------------------------------------------------------
    nodeExporter:
      enabled: true

    prometheus-node-exporter:
      # Run on every node, including tainted ones.
      tolerations:
        - operator: Exists
      # processes collector is off by default; node_processes_* gives process,
      # thread and PID-limit visibility and populates the node-exporter-full
      # dashboard's System Processes panels.
      extraArgs:
        - --collector.processes
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          # No CPU limit: node-exporter bursts during scrape collection and CFS
          # throttling here is the dominant CPUThrottlingHigh source. The memory
          # limit stays (OOM is a real failure mode) and matches the VPA ceiling.
          memory: 128Mi

    # -------------------------------------------------------------------------
    # kube-state-metrics
    # -------------------------------------------------------------------------
    kube-state-metrics:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
      # Flux controllers no longer export per-resource readiness
      # (gotk_reconcile_condition); it comes from kube-state-metrics
      # customResourceState instead, per the flux2-monitoring-example pattern.
      rbac:
        extraRules:
          - apiGroups:
              - kustomize.toolkit.fluxcd.io
              - helm.toolkit.fluxcd.io
            resources:
              - kustomizations
              - helmreleases
            verbs: [list, watch]
          - apiGroups:
              - source.toolkit.fluxcd.io
            resources:
              - gitrepositories
              - helmrepositories
              - helmcharts
            verbs: [list, watch]
          - apiGroups:
              - autoscaling.k8s.io
            resources:
              - verticalpodautoscalers
            verbs: [list, watch]
      customResourceState:
        enabled: true
        config:
          spec:
            resources:
              - groupVersionKind:
                  group: kustomize.toolkit.fluxcd.io
                  version: v1
                  kind: Kustomization
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: Flux Kustomization readiness
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                          exported_namespace: [metadata, namespace]
                          ready: [status, conditions, "[type=Ready]", status]
                          suspended: [spec, suspend]
              - groupVersionKind:
                  group: helm.toolkit.fluxcd.io
                  version: v2
                  kind: HelmRelease
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: Flux HelmRelease readiness
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                          exported_namespace: [metadata, namespace]
                          ready: [status, conditions, "[type=Ready]", status]
                          suspended: [spec, suspend]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: GitRepository
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: Flux GitRepository readiness
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                          exported_namespace: [metadata, namespace]
                          ready: [status, conditions, "[type=Ready]", status]
                          suspended: [spec, suspend]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: HelmRepository
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: Flux HelmRepository readiness
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                          exported_namespace: [metadata, namespace]
                          ready: [status, conditions, "[type=Ready]", status]
                          suspended: [spec, suspend]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: HelmChart
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: Flux HelmChart readiness
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                          exported_namespace: [metadata, namespace]
                          ready: [status, conditions, "[type=Ready]", status]
                          suspended: [spec, suspend]
              # The VPA components export no recommendation metrics of their own,
              # so a recommendation clamped at maxAllowed (workload outgrew its
              # ceiling) is otherwise only visible via manual kubectl. One series
              # per container and resource, for both the capped and uncapped
              # recommendation — consumed by VPARecommendationCapped below.
              - groupVersionKind:
                  group: autoscaling.k8s.io
                  version: v1
                  kind: VerticalPodAutoscaler
                metricNamePrefix: vpa
                labelsFromPath:
                  verticalpodautoscaler: [metadata, name]
                  exported_namespace: [metadata, namespace]
                  target_kind: [spec, targetRef, kind]
                  target_name: [spec, targetRef, name]
                # valueFrom must resolve to a scalar quantity, so target and
                # uncappedTarget are split into their cpu and memory members;
                # commonLabels carry resource/unit so the series never collide.
                metrics:
                  - name: recommendation_target
                    # Same metric family as the memory series below — HELP must match.
                    help: VPA recommended resource request after minAllowed/maxAllowed capping (see resource/unit labels)
                    commonLabels:
                      resource: cpu
                      unit: core
                    each:
                      type: Gauge
                      gauge:
                        path: [status, recommendation, containerRecommendations]
                        labelsFromPath:
                          container: [containerName]
                        valueFrom: [target, cpu]
                  - name: recommendation_target
                    help: VPA recommended resource request after minAllowed/maxAllowed capping (see resource/unit labels)
                    commonLabels:
                      resource: memory
                      unit: byte
                    each:
                      type: Gauge
                      gauge:
                        path: [status, recommendation, containerRecommendations]
                        labelsFromPath:
                          container: [containerName]
                        valueFrom: [target, memory]
                  - name: recommendation_uncappedtarget
                    help: VPA recommended resource request ignoring minAllowed/maxAllowed (see resource/unit labels)
                    commonLabels:
                      resource: cpu
                      unit: core
                    each:
                      type: Gauge
                      gauge:
                        path: [status, recommendation, containerRecommendations]
                        labelsFromPath:
                          container: [containerName]
                        valueFrom: [uncappedTarget, cpu]
                  - name: recommendation_uncappedtarget
                    help: VPA recommended resource request ignoring minAllowed/maxAllowed (see resource/unit labels)
                    commonLabels:
                      resource: memory
                      unit: byte
                    each:
                      type: Gauge
                      gauge:
                        path: [status, recommendation, containerRecommendations]
                        labelsFromPath:
                          container: [containerName]
                        valueFrom: [uncappedTarget, memory]

    # -------------------------------------------------------------------------
    # Components k3s does not expose
    # -------------------------------------------------------------------------
    # k3s bundles kube-scheduler, kube-controller-manager and kube-proxy into the
    # server process with no separate metrics endpoints. Leaving them enabled
    # produces permanent *Down criticals and dashboards that read "No data".
    kubeProxy:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeControllerManager:
      enabled: false
    # etcd is the one component whose failure loses the cluster, so it is
    # monitored. k3s serves etcd metrics on :2381 over plain HTTP (the k3s role
    # sets `etcd-expose-metrics` on every server, and the host firewall scopes
    # 2381 to the k3s node set). Enabling this component is ALSO what enables the
    # upstream etcd alert rules — quorum loss, leader flapping, DB-size growth,
    # fsync latency — which are gated on kubeEtcd.enabled.
    #
    # endpoints is the one site value here that cannot be an ordinary
    # substitution: Helm needs a real YAML list, not a string. ${cluster_etcd_endpoints}
    # is therefore stored in cluster-config as a JSON FLOW SEQUENCE, which parses
    # as a list once Flux substitutes it inline. Keep it in step with the server
    # addresses in the inventory — stale entries show up as etcd targets that are
    # permanently down (loud), never as silence.
    kubeEtcd:
      enabled: true
      endpoints: ${cluster_etcd_endpoints}
      service:
        enabled: true
        port: 2381
        targetPort: 2381
      serviceMonitor:
        enabled: true
        scheme: http

    # -------------------------------------------------------------------------
    # Custom alert rules — PLATFORM ONLY
    # -------------------------------------------------------------------------
    # App-specific rules belong in a PrometheusRule CR next to the app (rules are
    # discovered in every namespace). Keep this map to things that are true of
    # any cluster built from this template.
    #
    # Every rule carries a runbook_url. ${cluster_node_exporter_job_regex} scopes
    # the host-metric rules so they cover the in-cluster node-exporter DaemonSet
    # AND any host-level node-exporter job the cluster adds (see README).
    additionalPrometheusRulesMap:
      platform-storage:
        groups:
          - name: platform.storage
            rules:
              # efivarfs is the kernel's NVRAM-backed virtual fs and routinely
              # sits above 70%; devtmpfs/iso9660 are virtual or read-only.
              - alert: DiskUsageWarning
                expr: >-
                  (1 - node_filesystem_avail_bytes{job=~"${cluster_node_exporter_job_regex}", fstype!~"tmpfs|overlay|squashfs|efivarfs|devtmpfs|iso9660"}
                  / node_filesystem_size_bytes{job=~"${cluster_node_exporter_job_regex}", fstype!~"tmpfs|overlay|squashfs|efivarfs|devtmpfs|iso9660"})
                  * 100 > 80
                for: 10m
                labels:
                  severity: warning
                annotations:
                  runbook_url: '${cluster_runbook_base_url}/RUNBOOKS.md'
                  summary: 'Disk usage above 80% on {{ $labels.instance }}:{{ $labels.mountpoint }}'
                  description: >-
                    Disk usage is {{ $value | printf "%.1f" }}%
                    on {{ $labels.instance }} mount {{ $labels.mountpoint }}.

              - alert: DiskUsageCritical
                expr: >-
                  (1 - node_filesystem_avail_bytes{job=~"${cluster_node_exporter_job_regex}", fstype!~"tmpfs|overlay|squashfs|efivarfs|devtmpfs|iso9660"}
                  / node_filesystem_size_bytes{job=~"${cluster_node_exporter_job_regex}", fstype!~"tmpfs|overlay|squashfs|efivarfs|devtmpfs|iso9660"})
                  * 100 > 90
                for: 5m
                labels:
                  severity: critical
                annotations:
                  runbook_url: '${cluster_runbook_base_url}/RUNBOOKS.md'
                  summary: 'Disk usage above 90% on {{ $labels.instance }}:{{ $labels.mountpoint }}'
                  description: >-
                    Disk usage is {{ $value | printf "%.1f" }}%
                    on {{ $labels.instance }} mount {{ $labels.mountpoint }}.

              # Inode exhaustion: the byte-usage rules above miss a filesystem
              # that fills its inode table while still having free bytes. The
              # chart's NodeFilesystemAlmostOutOfFiles covers only the in-cluster
              # job; this one follows the job regex.
              - alert: InodeUsageWarning
                expr: >-
                  (node_filesystem_files_free{job=~"${cluster_node_exporter_job_regex}", fstype!~"tmpfs|overlay|squashfs|efivarfs|devtmpfs|iso9660"}
                  / node_filesystem_files{job=~"${cluster_node_exporter_job_regex}", fstype!~"tmpfs|overlay|squashfs|efivarfs|devtmpfs|iso9660"})
                  * 100 < 10
                for: 10m
                labels:
                  severity: warning
                annotations:
                  runbook_url: '${cluster_runbook_base_url}/RUNBOOKS.md'
                  summary: 'Inodes below 10% free on {{ $labels.instance }}:{{ $labels.mountpoint }}'
                  description: >-
                    Only {{ $value | printf "%.1f" }}% of inodes are free
                    on {{ $labels.instance }} mount {{ $labels.mountpoint }}.

              - alert: InodeUsageCritical
                expr: >-
                  (node_filesystem_files_free{job=~"${cluster_node_exporter_job_regex}", fstype!~"tmpfs|overlay|squashfs|efivarfs|devtmpfs|iso9660"}
                  / node_filesystem_files{job=~"${cluster_node_exporter_job_regex}", fstype!~"tmpfs|overlay|squashfs|efivarfs|devtmpfs|iso9660"})
                  * 100 < 5
                for: 5m
                labels:
                  severity: critical
                annotations:
                  runbook_url: '${cluster_runbook_base_url}/RUNBOOKS.md'
                  summary: 'Inodes below 5% free on {{ $labels.instance }}:{{ $labels.mountpoint }}'
                  description: >-
                    Only {{ $value | printf "%.1f" }}% of inodes are free
                    on {{ $labels.instance }} mount {{ $labels.mountpoint }}.

              - alert: PVCUsageWarning
                expr: (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) * 100 > 80
                for: 10m
                labels:
                  severity: warning
                annotations:
                  runbook_url: '${cluster_runbook_base_url}/RUNBOOKS.md'
                  summary: 'PVC {{ $labels.persistentvolumeclaim }} in {{ $labels.namespace }} above 80%'
                  description: 'PVC usage is {{ $value | printf "%.1f" }}%.'

              - alert: PVCUsageCritical
                expr: (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) * 100 > 90
                for: 5m
                labels:
                  severity: critical
                annotations:
                  runbook_url: '${cluster_runbook_base_url}/RUNBOOKS.md'
                  summary: 'PVC {{ $labels.persistentvolumeclaim }} in {{ $labels.namespace }} above 90%'
                  description: 'PVC usage is {{ $value | printf "%.1f" }}%.'

              # Every stateful PV in this platform is statically provisioned with
              # storageClassName "". A PV on k3s's default local-path class means
              # a claim silently fell through to the cluster-default class — the
              # data lands on a stateless node bootdisk that no backup covers.
              # Delete this rule if you adopt a real dynamic provisioner.
              - alert: LocalPathPVExists
                expr: kube_persistentvolume_info{storageclass="local-path"} > 0
                for: 15m
                labels:
                  severity: warning
                annotations:
                  runbook_url: '${cluster_runbook_base_url}/RUNBOOKS.md#backups-and-restore'
                  summary: 'PersistentVolume {{ $labels.persistentvolume }} is on the local-path StorageClass'
                  description: >-
                    PV {{ $labels.persistentvolume }} uses the local-path
                    StorageClass, which lands on a stateless node bootdisk and is
                    excluded from backups. Pin its storageClassName to "" and
                    rebind it to the intended static PV.

      platform-nodes:
        groups:
          - name: platform.nodes
            rules:
              - alert: NodeMemoryPressure
                expr: kube_node_status_condition{condition="MemoryPressure", status="true"} == 1
                for: 5m
                labels:
                  severity: warning
                annotations:
                  runbook_url: '${cluster_runbook_base_url}/RUNBOOKS.md'
                  summary: 'Node {{ $labels.node }} is under memory pressure'
                  description: 'Kubelet on {{ $labels.node }} has reported memory pressure for 5 minutes. Pods may be evicted.'

              - alert: NodeStuckCordoned
                expr: kube_node_spec_unschedulable == 1
                for: 30m
                labels:
                  severity: warning
                annotations:
                  runbook_url: '${cluster_runbook_base_url}/RUNBOOKS.md'
                  summary: 'Node {{ $labels.node }} cordoned (unschedulable) for 30m'
                  description: >-
                    Node {{ $labels.node }} has been SchedulingDisabled for 30
                    minutes. If maintenance is not in progress, suspect a stuck
                    uncordon or a timed-out drain, then
                    `kubectl uncordon {{ $labels.node }}`.

              # kured_reboot_required==1 means a node holds the reboot sentinel
              # and is waiting to be rebooted. A healthy cycle clears within one
              # drain+reboot; even a full serial (concurrency:1) rollout clears
              # each node well inside a couple of hours. Still flagged after 3h
              # means the cycle is STUCK and NO node is being serviced — a dead
              # kured pod holding the cluster lock, a blocking pod that never
              # ended, or a PDB refusing the drain. NodeStuckCordoned catches a
              # node left cordoned; this catches a never-serviced reboot on a
              # node that is still schedulable.
              - alert: KuredRebootStuck
                expr: kured_reboot_required == 1
                for: 3h
                labels:
                  severity: warning
                annotations:
                  runbook_url: '${cluster_runbook_base_url}/RUNBOOKS.md'
                  summary: 'kured reboot for {{ $labels.node }} pending over 3h (stuck cycle)'
                  description: >-
                    Node {{ $labels.node }} has held the kured reboot sentinel for
                    more than 3 hours. Check the cluster-wide lock
                    (`kubectl -n kube-system get ds kured -o jsonpath='{.metadata.annotations}'`),
                    any CI job pinning the node, and PDBs blocking the drain.
                    Clear a dead lock with `kubectl -n kube-system annotate
                    ds/kured weave.works/kured-node-lock-`.

              # The maintenance playbooks write this node-exporter textfile metric
              # when they DEFER a host reboot to an operator (encrypted pools to
              # unlock, an etcd server running a CI executor, a fail-closed
              # detection). It self-clears once the host no longer needs a reboot.
              - alert: MaintenanceRebootDeferred
                expr: maintenance_reboot_deferred == 1
                for: 10m
                labels:
                  severity: warning
                annotations:
                  runbook_url: '${cluster_runbook_base_url}/RUNBOOKS.md'
                  summary: 'Host {{ $labels.host }} has a maintenance-deferred reboot pending'
                  description: >-
                    Maintenance deferred a kernel reboot of {{ $labels.host }} to
                    an operator. Reboot it manually when convenient; the alert
                    clears on the next run.

      platform-gitops:
        groups:
          - name: platform.gitops
            rules:
              - alert: FluxReconciliationFailure
                expr: sum by (controller) (rate(controller_runtime_reconcile_errors_total{job="observability/flux-system"}[5m])) > 0
                for: 15m
                labels:
                  severity: warning
                annotations:
                  runbook_url: '${cluster_runbook_base_url}/RUNBOOKS.md'
                  summary: 'Flux controller {{ $labels.controller }} has reconciliation errors'
                  description: >-
                    Flux controller {{ $labels.controller }} has produced
                    reconciliation errors at {{ $value | printf "%.2f" }}/s for 15
                    minutes.

              # Catches a HelmRelease/Kustomization that is durably not Ready
              # (stale chart cache, missing CRD, failing values render) regardless
              # of error rate — the complement to the rate-based rule above.
              # gotk_resource_info comes from kube-state-metrics
              # customResourceState; the controllers no longer export readiness.
              - alert: FluxResourceNotReady
                expr: gotk_resource_info{ready="False", suspended!="true"} == 1
                for: 15m
                labels:
                  severity: warning
                annotations:
                  runbook_url: '${cluster_runbook_base_url}/RUNBOOKS.md'
                  summary: >-
                    Flux resource {{ $labels.customresource_kind }}/{{ $labels.exported_namespace }}/{{ $labels.name }} not Ready
                  description: >-
                    Ready=False for 15 minutes. Run `flux get all -A | grep -v True`
                    and `kubectl describe {{ $labels.customresource_kind }}
                    {{ $labels.name }} -n {{ $labels.exported_namespace }}`.

              # Fed by the kube-state-metrics VPA customResourceState above.
              # uncappedTarget above target means the recommendation is clamped at
              # maxAllowed — the workload outgrew its ceiling. 24h hold because
              # recommendations swing with daily load; a full day clamped is a
              # real capacity signal.
              - alert: VPARecommendationCapped
                expr: vpa_recommendation_uncappedtarget > vpa_recommendation_target
                for: 24h
                labels:
                  severity: warning
                annotations:
                  runbook_url: '${cluster_runbook_base_url}/RUNBOOKS.md'
                  summary: >-
                    VPA {{ $labels.exported_namespace }}/{{ $labels.verticalpodautoscaler }} recommendation capped at maxAllowed
                  description: >-
                    The recommendation for container {{ $labels.container }}
                    ({{ $labels.resource }}) has been clamped by maxAllowed for 24
                    hours — it wants {{ $value }} {{ $labels.unit }} uncapped.
                    Raise the cap or investigate the growth.

      platform-secrets:
        groups:
          - name: platform.secrets
            rules:
              - alert: ExternalSecretSyncFailure
                expr: externalsecret_status_condition{condition="Ready", status="False"} == 1
                for: 15m
                labels:
                  severity: warning
                annotations:
                  runbook_url: '${cluster_runbook_base_url}/RUNBOOKS.md'
                  summary: 'ExternalSecret {{ $labels.name }} sync failing'
                  description: 'ExternalSecret {{ $labels.name }} in {{ $labels.namespace }} has not synced for 15 minutes.'

              # The secrets provider is the dependency every ExternalSecret shares:
              # while it is down nothing can be created or rotated. Retarget the
              # deployment label if you swap secrets backends.
              - alert: SecretsProviderDown
                expr: >-
                  kube_deployment_status_replicas_available{namespace="external-secrets", deployment="onepassword-connect"} == 0
                  or absent(kube_deployment_status_replicas_available{namespace="external-secrets", deployment="onepassword-connect"})
                for: 5m
                labels:
                  severity: warning
                annotations:
                  runbook_url: '${cluster_runbook_base_url}/RUNBOOKS.md'
                  summary: 'The in-cluster secrets provider has no available replicas'
                  description: >-
                    The secrets provider deployment in the external-secrets
                    namespace has had 0 available replicas for 5 minutes, or the
                    metric is absent (kube-state-metrics also down). No secret can
                    be created or rotated until it recovers.

      platform-certificates:
        groups:
          - name: platform.certificates
            rules:
              - alert: CertExpiringWarning
                expr: certmanager_certificate_expiration_timestamp_seconds - time() < 86400 * 14
                for: 1h
                labels:
                  severity: warning
                annotations:
                  runbook_url: '${cluster_runbook_base_url}/RUNBOOKS.md#certificates'
                  summary: 'Certificate {{ $labels.name }} expiring in less than 14 days'
                  description: 'Certificate {{ $labels.name }} in {{ $labels.namespace }} expires in {{ $value | humanizeDuration }}.'

              - alert: CertExpiringCritical
                expr: certmanager_certificate_expiration_timestamp_seconds - time() < 86400 * 3
                for: 1h
                labels:
                  severity: critical
                annotations:
                  runbook_url: '${cluster_runbook_base_url}/RUNBOOKS.md#certificates'
                  summary: 'Certificate {{ $labels.name }} expiring in less than 3 days'
                  description: 'Certificate {{ $labels.name }} in {{ $labels.namespace }} expires in {{ $value | humanizeDuration }}.'

              # Covers TLS that cert-manager does NOT issue: anything terminated
              # at a CDN/edge or by a host-side ACME client. blackbox exports
              # probe_ssl_earliest_cert_expiry for every https target, so this
              # backstop surfaces a silently-lapsed edge cert before it breaks
              # (which would otherwise only show up as EndpointDown at expiry).
              #
              # Scoped to public hostnames on purpose. Unscoped, it would also
              # cover the internal endpoints cert-manager already watches, and
              # both would fire on the same certificate at the same threshold —
              # with different alertnames and different label sets, so no inhibit
              # rule could ever pair them. It matches nothing until you add a
              # public https probe, which is the correct quiet default.
              - alert: BlackboxCertExpiringSoon
                expr: probe_ssl_earliest_cert_expiry{instance=~"https://.*${cluster_external_domain}.*"} - time() < 86400 * 14
                for: 1h
                labels:
                  severity: warning
                annotations:
                  runbook_url: '${cluster_runbook_base_url}/RUNBOOKS.md#certificates'
                  summary: 'TLS cert presented by {{ $labels.instance }} expires in under 14 days'
                  description: >-
                    The certificate presented by {{ $labels.instance }} expires in
                    {{ $value | humanizeDuration }}. If it is edge/CDN-managed this
                    normally auto-renews — investigate if it does not clear.

      platform-probes:
        groups:
          - name: platform.probes
            rules:
              # for: 10m (not 5m): the warning tier absorbs brief probe dips that
              # a 5m hold re-fires on. Load-bearing endpoints get their own
              # critical rule with a shorter hold — add one per cluster, matched
              # on instance, and pair it with an Alertmanager inhibit.
              - alert: EndpointDown
                expr: max by (instance) (probe_success) == 0
                for: 10m
                labels:
                  severity: warning
                annotations:
                  runbook_url: '${cluster_runbook_base_url}/RUNBOOKS.md#where-to-look-first'
                  summary: 'Endpoint {{ $labels.instance }} is down'
                  description: 'Blackbox probe for {{ $labels.instance }} has failed for 10 minutes.'

              - alert: BlackboxExporterDown
                expr: absent(up{job=~".*blackbox.*"} == 1)
                for: 5m
                labels:
                  severity: critical
                annotations:
                  runbook_url: '${cluster_runbook_base_url}/RUNBOOKS.md#where-to-look-first'
                  summary: 'Blackbox exporter is down'
                  description: 'All endpoint monitoring is blind — the blackbox exporter has been down for 5 minutes.'

      platform-backups:
        groups:
          - name: platform.backups
            rules:
              # Off-node etcd snapshot copy. Losing every server node without an
              # off-node snapshot loses etcd. 26h = two 12h snapshot cycles; the
              # absent() arm fires if the copy metric never appears at all.
              - alert: EtcdSnapshotStale
                expr: (time() - etcd_snapshot_last_copy_timestamp_seconds > 93600) or absent(etcd_snapshot_last_copy_timestamp_seconds)
                for: 1h
                labels:
                  severity: warning
                annotations:
                  runbook_url: '${cluster_runbook_base_url}/RUNBOOKS.md#backups-and-restore'
                  summary: 'etcd snapshot off-node copy is stale'
                  description: >-
                    The newest off-node etcd snapshot is more than 26 hours old, or
                    the copy metric is missing. Check the snapshot copy timer on
                    the server nodes.

              - alert: OffsiteBackupFailed
                expr: restic_offsite_last_run_success == 0
                for: 1h
                labels:
                  severity: warning
                annotations:
                  runbook_url: '${cluster_runbook_base_url}/RUNBOOKS.md#backups-and-restore'
                  summary: 'Offsite backup run failed'
                  description: >-
                    The last offsite backup run exited unsuccessfully. Offsite
                    durability is at risk — check the backup unit's journal on the
                    storage host.

              # 50h deliberately tolerates one skipped night: the offsite run
              # chains off the local snapshot job, which can defer, and a 26h
              # window would flap on a single deferred night.
              #
              # The absent() arm is GATED, because ungated it fires an hour after
              # a fresh bootstrap and every hour after that, on every cluster that
              # has not opted into the offsite tier (`restic_offsite_enabled` ships
              # false) — and a permanently-firing alert is one nobody reads,
              # including the day it means something.
              #
              # The gate is a metric NAME, not a boolean, and that is forced:
              # Flux substitutes TEXT, so `${...}` is only valid PromQL inside a
              # quoted string, and these rules are linted pre-substitution by
              # `scripts/lint-prometheus-config.sh`. So:
              #   tier OFF (default) — ${cluster_offsite_backup_probe_metric} is
              #     `up`, which always has series, so absent() is never true and
              #     the arm is inert.
              #   tier ON — set the key to
              #     `restic_offsite_last_success_timestamp_seconds` in the same
              #     change that flips `restic_offsite_enabled`. absent() then
              #     means what it should: the unit was never installed, was
              #     removed, or the storage host is unreachable.
              - alert: OffsiteBackupStale
                expr: >-
                  (time() - restic_offsite_last_success_timestamp_seconds > 180000)
                  or absent({__name__=~"${cluster_offsite_backup_probe_metric}"})
                for: 1h
                labels:
                  severity: warning
                annotations:
                  runbook_url: '${cluster_runbook_base_url}/RUNBOOKS.md#backups-and-restore'
                  summary: 'Offsite backup has not succeeded in over 50 hours'
                  description: >-
                    No successful offsite backup in more than 50 hours (one skipped
                    night plus grace), or the metric is absent.

              # Integrity of the offsite repository, distinct from freshness of the
              # last upload. Fires if the last verify FAILED (a failed repo check
              # means the offsite copy may be unrestorable — the whole point of the
              # tier is defeated) or the newest successful verify is over 8 days
              # old. Deliberately NO absent() arm: the verify metric only appears
              # after the first verify, so absent() would fire forever on a fresh
              # deploy.
              - alert: OffsiteBackupVerifyStale
                expr: >-
                  (time() - restic_offsite_last_verify_timestamp_seconds > 691200)
                  or restic_offsite_last_verify_success == 0
                for: 1h
                labels:
                  severity: warning
                annotations:
                  runbook_url: '${cluster_runbook_base_url}/RUNBOOKS.md#backups-and-restore'
                  summary: 'Offsite repository verify is stale (>8d) or failing'
                  description: >-
                    The offsite repository has not passed an integrity check in
                    over 8 days, or the last check failed. Run the verify command
                    on the storage host before relying on it for recovery.
