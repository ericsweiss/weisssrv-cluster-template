---
# Observability stack secrets. Consumed by Grafana: the OIDC SSO credentials
# and the break-glass admin password (see release.yaml's grafana.ini note).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: observability-secrets
  namespace: observability
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: ${cluster_secret_store}
  target:
    name: observability-secrets
    creationPolicy: Owner
    template:
      mergePolicy: Merge
      engineVersion: v2
      data:
        grafana-admin-user: admin
  data:
    - secretKey: grafana-oidc-client-id
      remoteRef:
        key: Grafana SSO
        property: oidc-client-id
    - secretKey: grafana-oidc-client-secret
      remoteRef:
        key: Grafana SSO
        property: oidc-client-secret
    # Break-glass admin password. Applied once at first start and never again;
    # recovery and generation are in ../README.md.
    - secretKey: grafana-admin-password
      remoteRef:
        key: Grafana SSO
        property: admin-password
