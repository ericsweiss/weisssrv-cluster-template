---
# Observability stack secrets. Consumed by Grafana: the OIDC SSO credentials
# and the break-glass admin password (see release.yaml's grafana.ini note).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: observability-secrets
  namespace: observability
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: ${cluster_secret_store}
  target:
    name: observability-secrets
    creationPolicy: Owner
    template:
      # The admin USERNAME is a constant, not a secret — templating it here
      # keeps the vault item down to the one field that is. mergePolicy: Merge
      # keeps every fetched key in data[] below alongside it.
      mergePolicy: Merge
      engineVersion: v2
      data:
        grafana-admin-user: admin
  data:
    - secretKey: grafana-oidc-client-id
      remoteRef:
        key: Grafana SSO
        property: oidc-client-id
    - secretKey: grafana-oidc-client-secret
      remoteRef:
        key: Grafana SSO
        property: oidc-client-secret
    # Break-glass only: the login form and basic auth are both off, so this
    # authenticates nothing until an operator turns them back on. Generate it
    # like any other password (`openssl rand -base64 32`) — it must never be
    # the chart default.
    - secretKey: grafana-admin-password
      remoteRef:
        key: Grafana SSO
        property: admin-password
