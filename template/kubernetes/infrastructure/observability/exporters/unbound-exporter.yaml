---
# Recursive-resolver metrics: remote scrape of unbound_exporter (:9167), which
# ansible/playbooks/dns.yml installs on every resolver. A cluster on another
# resolver stack drops this file and clears the cluster-config roster key.
apiVersion: v1
kind: Service
metadata:
  name: unbound-exporter
  namespace: observability
  labels:
    app.kubernetes.io/name: unbound-exporter
    app.kubernetes.io/part-of: observability
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: 9167
      targetPort: 9167

---
# Nothing controls this slice but this file, so conditions.ready is set
# explicitly per address.
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: unbound-exporter
  namespace: observability
  labels:
    kubernetes.io/service-name: unbound-exporter
addressType: IPv4
ports:
  - name: metrics
    port: 9167
    protocol: TCP
endpoints: ${cluster_unbound_exporter_addresses}

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: unbound-exporter
  namespace: observability
  labels:
    app.kubernetes.io/name: unbound-exporter
spec:
  jobLabel: app.kubernetes.io/name
  selector:
    matchLabels:
      app.kubernetes.io/name: unbound-exporter
  endpoints:
    - port: metrics
      interval: 60s
