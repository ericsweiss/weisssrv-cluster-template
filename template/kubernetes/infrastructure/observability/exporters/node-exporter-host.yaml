---
# Host node-exporter scrape target on :9101 (9100 belongs to the in-cluster
# DaemonSet; a k3s server runs both). Covers what the DaemonSet cannot see:
# bare-metal hardware metrics and the LXC/VM TEXTFILE metrics (etcd-snapshot
# freshness, offsite-backup timestamps) that `platform.backups` alerts on.
#
# Selectorless headless Service + hand-written EndpointSlice: the addresses are
# outside the cluster, so no controller fills the slice in.
#
# `jobLabel: app.kubernetes.io/name` is what labels these series
# `job="node-exporter-host"`; `${cluster_node_exporter_job_regex}` must include
# that job or every host rule matches nothing.
apiVersion: v1
kind: Service
metadata:
  name: node-exporter-host
  namespace: observability
  labels:
    app.kubernetes.io/name: node-exporter-host
    app.kubernetes.io/part-of: observability
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: 9101
      targetPort: 9101

---
# discovery.k8s.io/v1, not the deprecated core/v1 Endpoints. The
# kubernetes.io/service-name label binds the slice to the Service above, and
# each entry sets conditions.ready explicitly — no controller fills it in.
#
# The roster is substituted from cluster-config as a JSON flow sequence (a real
# YAML list is required here and Flux substitutes text). The per-host annotation
# of who is who lives with the key in infrastructure/sources/cluster-config.yaml
# — edit it there, never here.
#
# A host that is listed but not yet running the role scrapes as `up == 0`, which
# is the correct, visible failure. A host that runs the role but is missing from
# the list is invisible, which is not — re-check this roster whenever the
# inventory grows a machine.
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: node-exporter-host
  namespace: observability
  labels:
    kubernetes.io/service-name: node-exporter-host
addressType: IPv4
ports:
  - name: metrics
    port: 9101
    protocol: TCP
endpoints: ${cluster_node_exporter_host_addresses}

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: node-exporter-host
  namespace: observability
  labels:
    app.kubernetes.io/name: node-exporter-host
spec:
  jobLabel: app.kubernetes.io/name
  selector:
    matchLabels:
      app.kubernetes.io/name: node-exporter-host
  endpoints:
    # 60s, not the 30s default: these are remote scrapes over the LAN of hosts
    # whose metrics (thermals, SMART, backup timestamps) change slowly.
    - port: metrics
      interval: 60s
