---
# Host node-exporter on :9101 (9100 is the in-cluster DaemonSet). Covers
# bare-metal and textfile metrics the DaemonSet cannot see. jobLabel makes the
# job "node-exporter-host"; ${cluster_node_exporter_job_regex} must include it.
apiVersion: v1
kind: Service
metadata:
  name: node-exporter-host
  namespace: observability
  labels:
    app.kubernetes.io/name: node-exporter-host
    app.kubernetes.io/part-of: observability
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: 9101
      targetPort: 9101

---
# Roster substituted from infrastructure/sources/cluster-config.yaml — edit it
# there. A listed host not yet running the role scrapes up == 0.
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: node-exporter-host
  namespace: observability
  labels:
    kubernetes.io/service-name: node-exporter-host
addressType: IPv4
ports:
  - name: metrics
    port: 9101
    protocol: TCP
endpoints: ${cluster_node_exporter_host_addresses}

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: node-exporter-host
  namespace: observability
  labels:
    app.kubernetes.io/name: node-exporter-host
spec:
  jobLabel: app.kubernetes.io/name
  selector:
    matchLabels:
      app.kubernetes.io/name: node-exporter-host
  endpoints:
    # 60s, not the 30s default: these are remote scrapes over the LAN of hosts
    # whose metrics (thermals, SMART, backup timestamps) change slowly.
    - port: metrics
      interval: 60s
