---
# Blackbox prober — synthetic probes of the endpoints Prometheus cannot scrape:
# ingress paths, TLS chains, off-cluster hosts. Feeds EndpointDown,
# BlackboxExporterDown and BlackboxCertExpiringSoon.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox-exporter
  namespace: observability
spec:
  interval: 30m
  releaseName: blackbox-exporter
  # Revert out-of-band edits; the repo rule lives in traefik/release.yaml.
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: prometheus-blackbox-exporter
      version: "${helm_chart_versions_prometheus_blackbox_exporter}"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # icmp_ping needs an unprivileged ICMP datagram socket: the chart drops all
    # capabilities and runs as gid 1000, and Debian's default ping_group_range
    # ("1 0") is empty, so every icmp probe fails without this.
    podSecurityContext:
      sysctls:
        - name: net.ipv4.ping_group_range
          value: "0 2147483647"
    config:
      modules:
        http_2xx:
          prober: http
          timeout: 10s
          http:
            valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
            follow_redirects: true
            preferred_ip_protocol: ip4
            tls_config:
              insecure_skip_verify: false
        # For endpoints behind SSO: an unauthenticated probe draws a redirect
        # or a 401/403. Accepting those proves ingress, TLS and backend
        # reachability, not an authenticated session.
        http_sso:
          prober: http
          timeout: 10s
          http:
            valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
            valid_status_codes: [200, 301, 302, 401, 403]
            follow_redirects: false
            preferred_ip_protocol: ip4
            tls_config:
              insecure_skip_verify: false
        dns_resolution:
          prober: dns
          timeout: 5s
          dns:
            query_name: ${cluster_internal_domain}
            query_type: A
            valid_rcodes:
              - NOERROR
        icmp_ping:
          prober: icmp
          timeout: 5s
        tcp_connect:
          prober: tcp
          timeout: 5s
    serviceMonitor:
      enabled: true
      defaults:
        interval: 60s
      # Starter list — only targets this template guarantees exist, every one
      # derived from cluster-config. Add your own; a target that is often
      # offline by design needs a gated alert, not a bare EndpointDown.
      targets:
        - name: grafana
          url: https://grafana.${cluster_internal_domain}
          module: http_2xx
        - name: sso
          url: https://auth.${cluster_internal_domain}
          module: http_sso
        # Split-horizon exception: auth.<external> answers on the LAN (the
        # rewrite in group_vars/dns.yml), so this probes the OIDC issuer origin
        # every login uses, over the external router and cert.
        - name: sso-external
          url: https://auth.${cluster_external_domain}
          module: http_sso
        # loki-push returns 401 without credentials, which http_sso accepts —
        # this probes the ingress + TLS + Loki hop, not auth. The path is
        # required: the router matches the push prefix only.
        - name: loki-push
          url: https://loki.${cluster_internal_domain}/loki/api/v1/push
          module: http_sso
        - name: kube-api-vip
          url: ${cluster_api_vip}:6443
          module: tcp_connect
        - name: smtp-relay
          url: ${cluster_smtp_host}:587
          module: tcp_connect
        # Outside-in WAN witness, not a monitored endpoint: it tells a cluster
        # fault from an ISP outage. Suppress on
        # `max(probe_success{instance="1.1.1.1"}) == 0`; EndpointDown excludes it.
        - name: internet-witness
          url: 1.1.1.1
          module: icmp_ping
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        memory: 64Mi
