---
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    app.kubernetes.io/name: observability
    app.kubernetes.io/managed-by: flux
    # ClusterSecretStore opt-in label (configs/cluster-secret-store.yaml).
    ${cluster_node_label_domain}/cluster-secrets: "true"
    # Host-level workloads here (node-exporter, the Alloy DaemonSet) need
    # hostPID/hostNetwork/hostPath, which only the privileged PSS permits.
    # audit/warn stay at baseline so other privileged requests still surface.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
