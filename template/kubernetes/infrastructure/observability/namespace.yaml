---
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    app.kubernetes.io/name: observability
    app.kubernetes.io/managed-by: flux
    # Opts this namespace into the platform ClusterSecretStore, whose
    # spec.conditions admit only namespaces carrying this label.
    ${cluster_node_label_domain}/cluster-secrets: "true"
    # The bundled node-exporter DaemonSet needs hostPID/hostNetwork/hostPath,
    # which only the privileged PSS permits, so enforce must stay privileged for
    # the namespace. audit/warn stay at baseline (they never gate admission) so a
    # privileged request from any OTHER workload here still surfaces.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
