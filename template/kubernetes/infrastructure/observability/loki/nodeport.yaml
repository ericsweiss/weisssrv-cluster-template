---
# Apply on demand only, and deliberately absent from kustomization.yaml. An
# always-on NodePort is an unauthenticated Loki push/read path on every node IP.
# Recipe and teardown: README.md and RUNBOOKS.md#loki-push-emergency-fallback.
apiVersion: v1
kind: Service
metadata:
  name: loki-external
  namespace: observability
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: loki
  ports:
    - name: http
      port: 3100
      targetPort: 3100
      nodePort: 31100
