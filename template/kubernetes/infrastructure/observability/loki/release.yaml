---
# Loki in single-binary (monolithic) mode, pinned to the storage node for its
# local WAL + chunk volume. Ingested by the in-cluster Alloy DaemonSet (container
# logs) and by host-side collectors via the authenticated push ingress.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: observability
spec:
  interval: 30m
  releaseName: loki
  # Revert out-of-band edits; the repo rule lives in traefik/release.yaml.
  driftDetection:
    mode: enabled
  timeout: 10m
  chart:
    spec:
      chart: loki
      version: "${helm_chart_versions_loki}"
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    global:
      # `platform` is defined in sources/priorityclasses.yaml. `global` is the
      # chart's all-pods override and reaches the singleBinary StatefulSet.
      priorityClassName: platform

    # Monolithic is configured by the `singleBinary:` values block below.
    deploymentMode: Monolithic

    # The rules sidecar watches its own namespace and reads only loki_rule
    # ConfigMaps, so a namespace Role replaces the chart's cluster-wide
    # configmaps+secrets grant to the Loki ServiceAccount.
    rbac:
      namespaced: true

    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      schemaConfig:
        configs:
          - from: "2024-01-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
      storage:
        type: filesystem
        filesystem:
          chunks_directory: /var/loki/chunks
          rules_directory: /var/loki/rules
      limits_config:
        # Retention is bounded by on-disk compressed chunks, roughly an order of
        # magnitude under raw ingest: size it against the volume's measured
        # growth. max_query_length must track retention or the extra is unqueryable.
        retention_period: 720h
        max_query_length: 720h
        # A host down for days replays journald older than Loki's 7d default;
        # 14d stays inside the 30d retention.
        reject_old_samples_max_age: 336h
        # Ingestion caps sized to absorb a fleet-wide WAL replay after an outage
        # rather than steady state — a rejected line is lost at RF=1. Retention,
        # not these caps, bounds the volume. Raise them as the fleet grows.
        ingestion_rate_mb: 8
        ingestion_burst_size_mb: 16
        per_stream_rate_limit: 4MB
        per_stream_rate_limit_burst: 8MB
      compactor:
        retention_enabled: true
        delete_request_store: filesystem
        working_directory: /var/loki/compactor
      # Ruler: LogQL alerting rules evaluated in-process and pushed to
      # Alertmanager. The sidecar must land rule files in /rules/fake — the
      # ruler scans <directory>/<tenant>/ and "fake" is the auth-less tenant.
      rulerConfig:
        wal:
          dir: /var/loki/ruler-wal
        storage:
          type: local
          local:
            directory: /rules
        rule_path: /var/loki/ruler-rule-tmp
        alertmanager_url: http://kube-prometheus-stack-alertmanager.observability.svc:9093
        enable_alertmanager_v2: true
        enable_api: true
        evaluation_interval: 1m
        poll_interval: 1m

    # Routes each loki_rule ConfigMap into the tenant subdir via the
    # k8s-sidecar-target-directory annotation set in kustomization.yaml.
    # singleBinary.sidecar and sidecar.rules.enabled stay at chart defaults.
    sidecar:
      # The chart ships the rules sidecar with no requests and no OOM ceiling.
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 256Mi
      rules:
        folderAnnotation: k8s-sidecar-target-directory
        resource: configmap

    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        size: 75Gi
        # "-" is LOAD-BEARING, not a typo for "": the sentinel emits a literal
        # `storageClassName: ""` and binds the loki-data PV, while "" is falsy
        # to the chart's `with` and lets the default class capture the claim.
        storageClass: "-"
      nodeSelector:
        ${cluster_node_label_domain}/nas: "true"
      tolerations:
        - key: ${cluster_node_label_domain}/nas
          operator: Equal
          value: "true"
          effect: PreferNoSchedule
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi

    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0

    monitoring:
      serviceMonitor:
        enabled: true
      selfMonitoring:
        enabled: false
        grafanaAgent:
          installOperator: false

    gateway:
      enabled: false

    test:
      enabled: false

    lokiCanary:
      enabled: false

    chunksCache:
      enabled: false

    resultsCache:
      enabled: false
