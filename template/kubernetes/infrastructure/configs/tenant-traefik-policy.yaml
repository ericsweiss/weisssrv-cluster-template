---
# These policies bound future writes only; run scripts/audit-tenant-services.sh
# once at rollout and before each onboarding for objects that predate them.

# Tenants hold full traefik.io write while Traefik allows cross-namespace refs
# for the platform. These policies pin every reference a tenant route makes to
# its own namespace, except the platform middlewares listed below.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: tenant-traefik-route-refs
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["traefik.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["ingressroutes", "ingressroutetcps", "ingressrouteudps"]
  variables:
    - name: ns
      expression: "object.metadata.namespace"
    - name: platformMiddlewares
      expression: >-
        ['traefik/lan-tailscale-only', 'traefik/lan-tailscale-strict',
        'traefik/hsts-header', 'traefik/security-headers', 'authentik/authentik-auth']
  validations:
    - expression: >-
        !has(object.spec.routes) || object.spec.routes.all(r,
        !has(r.services) || r.services.all(s,
        !has(s.namespace) || s.namespace == variables.ns))
      message: "a tenant route may reference Services only in its own namespace"
    - expression: >-
        !has(object.spec.routes) || object.spec.routes.all(r,
        !has(r.middlewares) || r.middlewares.all(m,
        !has(m.namespace) || m.namespace == variables.ns
        || (m.namespace + '/' + m.name) in variables.platformMiddlewares))
      message: "a tenant route may reference only its own middlewares or the platform allowlist"
    # Traefik resolves a name@provider reference (for example
    # other-ns-mw@kubernetescrd) ignoring the namespace field, so it is refused.
    - expression: >-
        !has(object.spec.routes) || object.spec.routes.all(r,
        (!has(r.middlewares) || r.middlewares.all(m, !m.name.contains('@')))
        && (!has(r.services) || r.services.all(s, !s.name.contains('@')
        && (!has(s.serversTransport) || !s.serversTransport.contains('@')))))
      message: "a tenant route may not use a name@provider middleware, service or transport reference"
    - expression: >-
        !has(object.spec.tls) || ((!has(object.spec.tls.options)
        || ((!has(object.spec.tls.options.namespace)
        || object.spec.tls.options.namespace == variables.ns)
        && !object.spec.tls.options.name.contains('@')))
        && (!has(object.spec.tls.store)
        || ((!has(object.spec.tls.store.namespace)
        || object.spec.tls.store.namespace == variables.ns)
        && !object.spec.tls.store.name.contains('@'))))
      message: "a tenant route may reference TLS options and stores only in its own namespace"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: tenant-traefik-route-refs
spec:
  policyName: tenant-traefik-route-refs
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: fluxcd.io/tenant
          operator: Exists
---
# Middlewares and TraefikServices can point across namespaces too: a chain, an
# errors page service, a forwardAuth address, and weighted or mirrored services.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: tenant-traefik-object-refs
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["traefik.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["middlewares", "traefikservices"]
  variables:
    - name: ns
      expression: "object.metadata.namespace"
    # The Authentik outpost the platform authentik-auth middleware calls.
    - name: platformForwardAuth
      expression: >-
        ['http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/traefik']
    - name: ownServiceAddress
      expression: >-
        '^https?://[a-z]([-a-z0-9]*[a-z0-9])?[.]' + variables.ns
        + '[.]svc([.]cluster[.]local)?(:[0-9]{1,5})?(/.*)?$'
  validations:
    - expression: >-
        !has(object.spec.chain) || !has(object.spec.chain.middlewares)
        || object.spec.chain.middlewares.all(m, !m.name.contains('@')
        && (!has(m.namespace) || m.namespace == variables.ns))
      message: "a tenant chain middleware may reference only its own namespace"
    - expression: >-
        !has(object.spec.errors) || !has(object.spec.errors.service)
        || !has(object.spec.errors.service.namespace)
        || object.spec.errors.service.namespace == variables.ns
      message: "a tenant errors middleware may reference only its own namespace"
    # Traefik, whose egress is wider than the tenant's, calls this address
    # itself. redirectRegex only answers the client, and plugin settings reach
    # only plugins Traefik's static config loads, of which there are none.
    - expression: >-
        !has(object.spec.forwardAuth)
        || object.spec.forwardAuth.address in variables.platformForwardAuth
        || object.spec.forwardAuth.address.matches(variables.ownServiceAddress)
      message: "a tenant forwardAuth middleware may call only a Service in its own namespace"
    - expression: >-
        !has(object.spec.weighted) || !has(object.spec.weighted.services)
        || object.spec.weighted.services.all(s,
        !has(s.namespace) || s.namespace == variables.ns)
      message: "a tenant weighted service may reference only its own namespace"
    - expression: >-
        !has(object.spec.mirroring)
        || ((!has(object.spec.mirroring.namespace)
        || object.spec.mirroring.namespace == variables.ns)
        && (!has(object.spec.mirroring.mirrors)
        || object.spec.mirroring.mirrors.all(s,
        !has(s.namespace) || s.namespace == variables.ns)))
      message: "a tenant mirroring service may reference only its own namespace"
    # As for routes: a TraefikService-kind name such as api@internal or
    # other-ns-svc@kubernetescrd is resolved ignoring the namespace field.
    - expression: >-
        (!has(object.spec.errors) || !has(object.spec.errors.service)
        || (!object.spec.errors.service.name.contains('@')
        && (!has(object.spec.errors.service.serversTransport)
        || !object.spec.errors.service.serversTransport.contains('@'))))
        && (!has(object.spec.weighted) || !has(object.spec.weighted.services)
        || object.spec.weighted.services.all(s, !s.name.contains('@')
        && (!has(s.serversTransport) || !s.serversTransport.contains('@'))))
        && (!has(object.spec.mirroring)
        || (!object.spec.mirroring.name.contains('@')
        && (!has(object.spec.mirroring.serversTransport)
        || !object.spec.mirroring.serversTransport.contains('@'))
        && (!has(object.spec.mirroring.mirrors)
        || object.spec.mirroring.mirrors.all(s, !s.name.contains('@')
        && (!has(s.serversTransport) || !s.serversTransport.contains('@'))))))
      message: "a tenant errors, weighted or mirroring service may not use a name@provider service or transport reference"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: tenant-traefik-object-refs
spec:
  policyName: tenant-traefik-object-refs
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: fluxcd.io/tenant
          operator: Exists
---
# The kubernetesIngress provider resolves name@provider annotations on plain
# Ingresses and Services in any namespace, and allowCrossNamespace does not
# govern it, so only the platform middlewares below may be referenced that way.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: tenant-traefik-ingress-refs
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["ingresses"]
      - apiGroups: [""]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["services"]
  variables:
    - name: platformRefs
      expression: >-
        ['traefik-lan-tailscale-only@kubernetescrd', 'traefik-lan-tailscale-strict@kubernetescrd',
        'traefik-hsts-header@kubernetescrd', 'traefik-security-headers@kubernetescrd',
        'authentik-authentik-auth@kubernetescrd']
  validations:
    - expression: >-
        !has(object.metadata.annotations) || object.metadata.annotations.all(k,
        !k.startsWith('traefik.ingress.kubernetes.io/')
        || object.metadata.annotations[k].split(',').all(v,
        !v.contains('@') || v.trim() in variables.platformRefs))
      message: "a tenant Traefik annotation may use a name@provider reference only from the platform allowlist"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: tenant-traefik-ingress-refs
spec:
  policyName: tenant-traefik-ingress-refs
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: fluxcd.io/tenant
          operator: Exists
---
# An ExternalName or selectorless Service passes the forwardAuth pin by name,
# then sends Traefik, whose egress is wider, into another namespace by CNAME or
# by hand-written endpoints.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: tenant-no-externalname-services
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["services"]
  validations:
    - expression: "!has(object.spec.type) || object.spec.type != 'ExternalName'"
      message: "tenant Services may not be ExternalName (it would CNAME Traefik to another namespace)"
    - expression: "has(object.spec.selector) && size(object.spec.selector) > 0"
      message: "tenant Services must select pods (selectorless Services allow hand-written endpoints)"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: tenant-no-externalname-services
spec:
  policyName: tenant-no-externalname-services
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: fluxcd.io/tenant
          operator: Exists
---
# k3s runs kube-controller-manager with use-service-account-credentials=true
# (pkg/daemons/control/server.go): the endpoint, endpointslice and mirroring
# controllers write as those three kube-system ServiceAccounts, and only they may.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: tenant-no-manual-endpoints
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["endpoints"]
      - apiGroups: ["discovery.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["endpointslices"]
  validations:
    - expression: >-
        request.userInfo.username == 'system:kube-controller-manager' ||
        request.userInfo.username in ['system:serviceaccount:kube-system:endpoint-controller',
        'system:serviceaccount:kube-system:endpointslice-controller',
        'system:serviceaccount:kube-system:endpointslicemirroring-controller']
      message: "tenant Endpoints and EndpointSlices are managed by the control plane only"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: tenant-no-manual-endpoints
spec:
  policyName: tenant-no-manual-endpoints
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: fluxcd.io/tenant
          operator: Exists
