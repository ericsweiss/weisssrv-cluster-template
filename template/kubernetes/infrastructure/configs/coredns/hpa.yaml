---
# Pins k3s's bundled CoreDNS at 2 replicas. k3s owns that Deployment as an AddOn
# and resets replicas, so an HPA holds them instead of a patch — the metrics block
# below never fires. See ../../../README.md § In-cluster DNS.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: coredns
  namespace: kube-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: coredns
  minReplicas: 2
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 90
