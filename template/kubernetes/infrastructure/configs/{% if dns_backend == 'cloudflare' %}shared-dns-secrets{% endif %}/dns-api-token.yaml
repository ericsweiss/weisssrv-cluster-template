---
# One ClusterExternalSecret fans the DNS provider token out to every namespace
# labelled <label-domain>/dns-api-token=true, so a new consumer just adds the
# label. remoteRef.key is the backend item title and .property is the field.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: dns-api-token
spec:
  namespaceSelectors:
    - matchLabels:
        ${cluster_node_label_domain}/dns-api-token: "true"
  externalSecretName: dns-api-token
  externalSecretSpec:
    refreshInterval: 24h
    secretStoreRef:
      kind: ClusterSecretStore
      name: ${cluster_secret_store}
    target:
      name: dns-api-token
      creationPolicy: Owner
    data:
      - secretKey: api-token
        remoteRef:
          key: Cloudflare DNS Token
          property: credential
