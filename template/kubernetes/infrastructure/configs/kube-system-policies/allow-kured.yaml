---
# kured's metrics port 8080, scraped by the chart-native ServiceMonitor.
# check-scrape-netpol.py cannot see it (the chart spells it `metrics.create`),
# so without this rule the scrape is CNI-REJECTed and only TargetDown shows.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kured-metrics-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kured
      app.kubernetes.io/instance: kured
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 8080
