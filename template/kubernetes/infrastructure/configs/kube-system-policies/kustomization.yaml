---
# Every kube-system NetworkPolicy: the ingress default-deny plus its complete
# allow set. A new kube-system workload needs a new allow here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kube-system
resources:
  - namespace.yaml
  - allow-coredns.yaml
  - allow-metrics-server.yaml
  - allow-kured.yaml
components:
  - ../../../components/netpol-baseline
