---
# Every kube-system NetworkPolicy: the ingress default-deny (from
# components/netpol-baseline) plus its complete allow set (coredns 53/9153,
# metrics-server 10250, kured 8080). New workload, new allow.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# k3s owns the kube-system Namespace object; namespace.yaml adopts it only to
# add the PSA labels (see that file). This transformer places the policies below
# (and the component's deny) into the namespace.
namespace: kube-system
resources:
  - namespace.yaml
  - allow-coredns.yaml
  - allow-metrics-server.yaml
  - allow-kured.yaml
components:
  - ../../../components/netpol-baseline
