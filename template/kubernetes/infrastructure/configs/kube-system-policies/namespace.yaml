---
# k3s owns kube-system; this adopts it only to set its Pod Security Admission
# labels. It is the one built-in namespace that needs privileged; audit and
# warn stay at `baseline`.
apiVersion: v1
kind: Namespace
metadata:
  name: kube-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/audit: baseline
