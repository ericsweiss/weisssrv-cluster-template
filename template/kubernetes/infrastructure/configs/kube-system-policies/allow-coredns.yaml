---
# CoreDNS ingress under the kube-system default-deny. Peers: all namespaces, the
# pod CIDR (kube-proxy masquerades ClusterIP traffic) and the LAN. Narrowing any
# peer can break DNS cluster-wide — see docs/RUNBOOKS.md, kube-system fencing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-coredns-ingress
spec:
  podSelector:
    matchLabels:
      k8s-app: kube-dns
  policyTypes:
    - Ingress
  ingress:
    # Cluster DNS (container ports `dns` 53/UDP and `dns-tcp` 53/TCP).
    - from:
        - namespaceSelector: {}
        - ipBlock:
            cidr: ${cluster_pod_cidr}
        - ipBlock:
            cidr: ${cluster_lan_cidr}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Prometheus scrape of the `metrics` container port, via the
    # kube-prometheus-stack-coredns Service + ServiceMonitor the chart renders.
    # Chart-rendered monitors are invisible to check-scrape-netpol.py.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 9153
