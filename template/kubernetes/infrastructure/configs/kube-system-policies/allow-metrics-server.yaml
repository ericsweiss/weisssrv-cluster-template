---
# metrics-server's aggregated API on :10250 (k3s AddOn, `k8s-app: metrics-server`).
# Peer is unrestricted: the aggregation call is DNAT'd and masqueraded, so no
# source IP is pinnable — its own TLS and delegated authn/authz is the gate.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metrics-server-ingress
spec:
  podSelector:
    matchLabels:
      k8s-app: metrics-server
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 10250
