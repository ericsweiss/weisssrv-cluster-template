---
# metrics-server's aggregated API (metrics.k8s.io) on :10250. The peer is
# unrestricted because the aggregation call is DNAT'd and masqueraded; its TLS
# and delegated authn are the gate. Label-scoped to the chart's pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metrics-server-chart-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: metrics-server
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 10250
