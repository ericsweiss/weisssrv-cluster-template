---
# A TLSOption named `default` in Traefik's namespace applies to every route that
# does not name its own, so this one resource covers all current and future
# IngressRoutes.
#
# TLS 1.3 only. Its cipher set is fixed and entirely forward-secret, so no
# cipherSuites list is needed. If a legacy client breaks, add a second TLSOption
# and reference it from that route rather than lowering this one.
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: default
  namespace: traefik
spec:
  minVersion: VersionTLS13
  curvePreferences:
    - CurveP521
    - CurveP384
    - CurveP256
