---
# A TLSOption named `default` in Traefik's namespace covers every route that
# does not name its own. TLS 1.3 only, with Go's default cipher and curve
# order. A legacy client gets a second TLSOption, not a lower bar here.
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: default
  namespace: traefik
spec:
  minVersion: VersionTLS13
