---
# Anchor copies of both wildcards; no IngressRoute lives in `default`. Traefik reads
# Secrets only from the IngressRoute's namespace, so a namespace whose route needs a
# wildcard keeps its own copy, at a renewBefore staggered off this 720h anchor.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: external-wildcard
  namespace: default
spec:
  secretName: external-wildcard-tls
  issuerRef:
    name: ${cluster_issuer}
    kind: ClusterIssuer
  # `dnsNames` alone: Let's Encrypt issues no Common Name, and a CN built from a
  # long domain would breach the 64-byte X.509 limit.
  dnsNames:
    - "*.${cluster_external_domain}"
    - ${cluster_external_domain}
  renewBefore: 720h
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: internal-wildcard
  namespace: default
spec:
  secretName: internal-wildcard-tls
  issuerRef:
    name: ${cluster_issuer}
    kind: ClusterIssuer
  dnsNames:
    - "*.${cluster_internal_domain}"
    - ${cluster_internal_domain}
  renewBefore: 720h
