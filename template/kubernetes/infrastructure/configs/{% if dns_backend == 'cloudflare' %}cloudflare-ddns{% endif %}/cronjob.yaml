---
# CRITICAL: keeps the external zone's A records on the site's current public
# IPv4. Terraform and external-dns also write this zone, so the three owners
# must stay on disjoint record NAMES or they will fight.
# The record list comes from cluster-config (cluster_ddns_records).
# The program is cloudflare-ddns.py here, mounted by the configMapGenerator.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cloudflare-ddns
  namespace: cloudflare-ddns
spec:
  schedule: "*/5 * * * *"
  # Without a deadline the controller counts missed schedules back from
  # lastScheduleTime and stops scheduling for good past 100 of them; it also
  # bounds how late a missed run may start.
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 3600
      # Two retries ride out an API blip without queuing six failing pods
      # inside one 5-minute window, and leave the failure visible.
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: ddns-update
              # Debian-based, not Alpine: musl's getaddrinfo() misbehaves in
              # cluster DNS setups. Digest-pinned for reproducibility.
              image: python:3.14-slim@sha256:b877e50bd90de10af8d82c57a022fc2e0dc731c5320d762a27986facfc3355c1
              command:
                - python3
                - /opt/ddns/cloudflare-ddns.py
              env:
                - name: DDNS_ZONE
                  value: "${cluster_external_domain}"
                - name: DDNS_RECORDS
                  value: "${cluster_ddns_records}"
                - name: CF_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: dns-api-token
                      key: api-token
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: script
                  mountPath: /opt/ddns
                  readOnly: true
          volumes:
            - name: script
              configMap:
                # kustomize rewrites this to the hashed generator name, so a
                # script edit rolls a new ConfigMap instead of mutating in place.
                name: cloudflare-ddns-script
                defaultMode: 0555
