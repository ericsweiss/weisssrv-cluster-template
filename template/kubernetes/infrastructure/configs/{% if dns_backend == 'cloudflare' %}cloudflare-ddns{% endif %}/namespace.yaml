---
apiVersion: v1
kind: Namespace
metadata:
  name: cloudflare-ddns
  labels:
    app.kubernetes.io/name: cloudflare-ddns
    app.kubernetes.io/managed-by: flux
    ${cluster_node_label_domain}/dns-api-token: "true"
    pod-security.kubernetes.io/enforce: restricted
