---
# ACME issuers for both zones, solving DNS-01 so internal-only names work. Point
# `cluster_issuer` at letsencrypt-staging while the zone and token scope are unproven.
# DNS-backend seam: ../../README.md § Backend seams.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ${cluster_acme_email}
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: dns-api-token
              key: api-token
        selector:
          dnsZones:
            - ${cluster_external_domain}
            - ${cluster_internal_domain}

---
# Staging: same solver, far higher rate limits, untrusted certificates. Costs one unused
# object while `cluster_issuer` names the production issuer.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: ${cluster_acme_email}
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: dns-api-token
              key: api-token
        selector:
          dnsZones:
            - ${cluster_external_domain}
            - ${cluster_internal_domain}
