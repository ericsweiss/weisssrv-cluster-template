---
# Two single-address pools: the public and internal ingress VIPs. autoAssign is
# false, so each Service claims its address with the metallb.io/loadBalancerIPs
# annotation. Keep both outside your DHCP pool — MetalLB answers ARP for them.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: public-pool
  namespace: metallb-system
spec:
  autoAssign: false
  addresses:
    - ${cluster_metallb_public_vip}/32
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: internal-pool
  namespace: metallb-system
spec:
  autoAssign: false
  addresses:
    - ${cluster_metallb_internal_vip}/32
---
# L2 (ARP) announcement. No interface list: MetalLB filters CNI/virtual
# interfaces itself, and an explicit list breaks on nodes whose NIC is not
# named eth0/ens18.
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: l2-advertisement
  namespace: metallb-system
spec:
  ipAddressPools:
    - public-pool
    - internal-pool
