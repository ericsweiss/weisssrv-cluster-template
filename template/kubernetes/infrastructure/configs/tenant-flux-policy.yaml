---
# A tenant may run its own Flux Kustomizations and HelmReleases, but only as a
# ServiceAccount of its namespace and from a source in that namespace; without
# one the controller applies with its own cluster-admin identity.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: tenant-flux-impersonation
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["kustomize.toolkit.fluxcd.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["kustomizations"]
      - apiGroups: ["helm.toolkit.fluxcd.io"]
        apiVersions: ["v2"]
        operations: ["CREATE", "UPDATE"]
        resources: ["helmreleases"]
  # A finalizer's removal from a terminating object is an UPDATE that changes
  # neither spec nor annotations; refusing it strands the object in
  # Terminating, and admitting it admits nothing new.
  matchConditions:
    - name: enforce-unless-finalizing-unchanged
      expression: >-
        request.operation != 'UPDATE'
        || !has(object.metadata.deletionTimestamp)
        || object.spec != oldObject.spec
        || (has(object.metadata.annotations) ? object.metadata.annotations : {})
        != (has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {})
  variables:
    - name: ns
      expression: "object.metadata.namespace"
    - name: isKustomization
      expression: "request.resource.resource == 'kustomizations'"
  validations:
    - expression: >-
        has(object.spec.serviceAccountName) && object.spec.serviceAccountName != ''
      message: "a tenant Kustomization or HelmRelease must set spec.serviceAccountName"
    - expression: >-
        !variables.isKustomization || !has(object.spec.sourceRef.namespace)
        || object.spec.sourceRef.namespace == variables.ns
      message: "a tenant Kustomization may reference a source only in its own namespace"
    # A HelmRelease names its source in chart.spec.sourceRef or in chartRef.
    - expression: >-
        variables.isKustomization || ((!has(object.spec.chart)
        || !has(object.spec.chart.spec.sourceRef.namespace)
        || object.spec.chart.spec.sourceRef.namespace == variables.ns)
        && (!has(object.spec.chartRef) || !has(object.spec.chartRef.namespace)
        || object.spec.chartRef.namespace == variables.ns))
      message: "a tenant HelmRelease may reference a chart source only in its own namespace"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: tenant-flux-impersonation
spec:
  policyName: tenant-flux-impersonation
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: fluxcd.io/tenant
          operator: Exists
