---
# Flux controller VPAs. Initial: an eviction mid-reconcile could abort a helm
# upgrade, so resizing waits for natural restarts. RequestsOnly keeps the
# upstream 1Gi limit as the ceiling, and every memory cap equals it.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: source-controller
  namespace: flux-system
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: source-controller
  updatePolicy:
    updateMode: Initial
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        controlledValues: RequestsOnly
        minAllowed: {cpu: 25m, memory: 64Mi}
        maxAllowed: {cpu: 1, memory: 1Gi}
        controlledResources: [cpu, memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: kustomize-controller
  namespace: flux-system
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kustomize-controller
  updatePolicy:
    updateMode: Initial
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        controlledValues: RequestsOnly
        minAllowed: {cpu: 25m, memory: 64Mi}
        maxAllowed: {cpu: 1, memory: 1Gi}
        controlledResources: [cpu, memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: helm-controller
  namespace: flux-system
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: helm-controller
  updatePolicy:
    updateMode: Initial
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        controlledValues: RequestsOnly
        minAllowed: {cpu: 25m, memory: 64Mi}
        maxAllowed: {cpu: 1, memory: 1Gi}
        controlledResources: [cpu, memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: notification-controller
  namespace: flux-system
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: notification-controller
  updatePolicy:
    updateMode: Initial
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        controlledValues: RequestsOnly
        minAllowed: {cpu: 10m, memory: 32Mi}
        maxAllowed: {cpu: 500m, memory: 1Gi}
        controlledResources: [cpu, memory]
