---
# HelmRelease fields shared by both runner releases, defined once so a fix here
# reaches both. Each runner's release.yaml keeps only its own deltas: identity,
# secret, tags, concurrency, executor TOML, image and job resources.

# Keep ExternalSecrets out of this component: a namespace-less copy keys
# rotation coverage once instead of once per including namespace. Each runner
# declares its own.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  # `target` selects what gets patched; the patch's own metadata.name is required
  # for the strategic-merge parse but is ignored for matching, so it does not
  # rename the selected HelmRelease.
  - target:
      kind: HelmRelease
      name: gitlab-runner.*
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: gitlab-runner-common
      spec:
        interval: 30m
        driftDetection:
          mode: enabled
        # The liveness probe plus the GitLab connection handshake can take 6-8
        # minutes on a cold start; the 5m default times out prematurely.
        timeout: 15m
        chart:
          spec:
            chart: gitlab-runner
            version: "${gitlab_runner_helm_version}"
            sourceRef:
              kind: HelmRepository
              name: gitlab
              namespace: flux-system
            interval: 12h
        install:
          timeout: 15m
          remediation:
            retries: 3
        upgrade:
          timeout: 15m
          remediation:
            retries: 3
            remediateLastFailure: true
        values:
          # With split-horizon DNS, use the name resolving to the internal
          # ingress so runner<->GitLab traffic stays on the LAN. clone_url in the
          # executor TOML must match; clone URLs follow external_url, not this.
          gitlabUrl: https://${cluster_git_host}

          # One manager pod; job parallelism is `concurrent` per runner.
          # driftDetection reverts an out-of-band scale.
          replicas: 1

          checkInterval: 30

          # RBAC bound only to the manager SA; job pods run as an unprivileged SA.
          # clusterWideAccess:false confines the manager to its own namespace. Jobs
          # that must touch other namespaces bring their own kubeconfig.
          rbac:
            create: true
            clusterWideAccess: false
            rules:
              - apiGroups: [""]
                resources: ["pods", "pods/exec", "pods/attach", "pods/log", "secrets", "configmaps"]
                verbs: ["get", "list", "watch", "create", "update", "delete", "patch"]
              - apiGroups: [""]
                resources: ["services"]
                verbs: ["get", "list", "watch"]

          # Manager pod resources (NOT the job pods).
          resources:
            requests:
              cpu: 150m
              memory: 128Mi
            limits:
              # No CPU limit: the manager bursts when spawning and reaping job
              # pods, and CFS throttling here drives CPUThrottlingHigh. The
              # request still grants a scheduling share.
              memory: 512Mi

          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: ${cluster_node_label_domain}/nas
                        operator: DoesNotExist

          # Tolerated for clusters that taint ingress/compute nodes; the starter
          # roster taints only the NAS node, so these are inert until you do.
          tolerations:
            - key: ${cluster_node_label_domain}/ingress
              operator: Equal
              value: "true"
              effect: PreferNoSchedule
            - key: ${cluster_node_label_domain}/compute
              operator: Equal
              value: "true"
              effect: PreferNoSchedule
