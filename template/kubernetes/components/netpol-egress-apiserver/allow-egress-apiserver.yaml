---
# kube-proxy DNATs the in-cluster API VIP to a real server node IP before
# NetworkPolicy evaluation, so this allows the node range, not the VIP.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-apiserver
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: ${cluster_apiserver_egress_cidr}
      ports:
        - protocol: TCP
          port: 6443
