---
# Platform controller HelmReleases; the stage's kustomization.yaml has the set.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-controllers
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  # Headroom over the slowest release this stage waits on (cert-manager, 10m).
  timeout: 15m
  dependsOn:
    - name: infrastructure-sources
    - name: infrastructure-crds
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/infrastructure/controllers
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-versions
        optional: false
      - kind: ConfigMap
        name: cluster-config
        optional: false
