---
# Shared RBAC for tenant Flux reconciliation: the CRD groups the built-in
# `admin` ClusterRole does not aggregate. Bound per-tenant alongside `admin`
# (see README.md); unbound it does nothing.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tenant-crd-editor
  labels:
    app.kubernetes.io/managed-by: flux
rules:
  # Must equal `kubectl api-resources --api-group=traefik.io --namespaced=true`;
  # re-check after a Traefik chart bump.
  - apiGroups: ["traefik.io"]
    resources:
      - ingressroutes
      - ingressroutetcps
      - ingressrouteudps
      - middlewares
      - middlewaretcps
      - traefikservices
      - serverstransports
      - serverstransporttcps
      - tlsoptions
      - tlsstores
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
  - apiGroups: ["monitoring.coreos.com"]
    resources:
      - servicemonitors
      - podmonitors
      - prometheusrules
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
  - apiGroups: ["autoscaling.k8s.io"]
    resources:
      - verticalpodautoscalers
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
  # Explicit, though admin usually aggregates these, so a partial install still
  # applies them.
  - apiGroups: ["external-secrets.io"]
    resources:
      - externalsecrets
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
  - apiGroups: ["cert-manager.io"]
    resources:
      - certificates
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
  # Must equal `kubectl api-resources --api-group=postgresql.cnpg.io
  # --namespaced=true`; re-check after a CNPG chart bump. A tenant owns its
  # own Cluster, ScheduledBackup and on-demand Backup objects.
  - apiGroups: ["postgresql.cnpg.io"]
    resources:
      - backups
      - clusters
      - databaseroles
      - databases
      - failoverquorums
      - imagecatalogs
      - poolers
      - publications
      - scheduledbackups
      - subscriptions
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
  - apiGroups: ["barmancloud.cnpg.io"]
    resources:
      - objectstores
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
