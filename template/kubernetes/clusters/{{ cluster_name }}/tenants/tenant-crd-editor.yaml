---
# Shared RBAC for tenant Flux reconciliation. The built-in `admin` ClusterRole
# does not cover traefik.io, monitoring.coreos.com or autoscaling.k8s.io, so a
# tenant's first route, monitor or VPA fails Forbidden without this.

# external-secrets.io and cert-manager.io are granted explicitly rather than
# relying on admin's aggregated edit roles.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tenant-crd-editor
  labels:
    app.kubernetes.io/managed-by: flux
rules:
  # Must equal `kubectl api-resources --api-group=traefik.io --namespaced=true`;
  # re-check after a Traefik chart bump.
  - apiGroups: ["traefik.io"]
    resources:
      - ingressroutes
      - ingressroutetcps
      - ingressrouteudps
      - middlewares
      - middlewaretcps
      - traefikservices
      - serverstransports
      - serverstransporttcps
      - tlsoptions
      - tlsstores
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
  - apiGroups: ["monitoring.coreos.com"]
    resources:
      - servicemonitors
      - podmonitors
      - prometheusrules
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
  - apiGroups: ["autoscaling.k8s.io"]
    resources:
      - verticalpodautoscalers
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
  - apiGroups: ["external-secrets.io"]
    resources:
      - externalsecrets
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
  - apiGroups: ["cert-manager.io"]
    resources:
      - certificates
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
