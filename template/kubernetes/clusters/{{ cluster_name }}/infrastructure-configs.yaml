---
# Stage 4/5 — cluster-wide CRs that need the controllers' CRDs and webhooks
# (ClusterIssuer, ClusterSecretStore, MetalLB pools, Traefik middlewares/TLS
# options, CoreDNS HPA/PDB, VPA policies).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-configs
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  dependsOn:
    - name: infrastructure-controllers
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/infrastructure/configs
  prune: true
  wait: true
  # optional:false — see infrastructure-sources.yaml for why only that stage
  # tolerates a miss.
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-versions
        optional: false
      - kind: ConfigMap
        name: cluster-config
        optional: false
