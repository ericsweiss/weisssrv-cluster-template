---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- gotk-components.yaml
- gotk-sync.yaml
patches:
# Enforce restricted PSA (bootstrap ships warn-only). Patched here, not
# hand-edited: flux install regenerates gotk-components.yaml.
- target:
    kind: Namespace
    name: flux-system
  patch: |
    - op: add
      path: /metadata/labels/pod-security.kubernetes.io~1enforce
      value: restricted
    - op: add
      path: /metadata/labels/pod-security.kubernetes.io~1enforce-version
      value: latest
# Bootstrap default 64Mi is too low; VPA Initial policies
# (infrastructure/configs/vpa/flux-system.yaml) own the value from the first
# pod recreation. Strategic merge, so a missing upstream request is added.
- target:
    kind: Deployment
    name: (source-controller|kustomize-controller|helm-controller)
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: flux-controller
    spec:
      template:
        spec:
          containers:
            - name: manager
              resources:
                requests:
                  memory: 256Mi
- target:
    kind: Deployment
    name: notification-controller
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: notification-controller
    spec:
      template:
        spec:
          containers:
            - name: manager
              resources:
                requests:
                  memory: 128Mi
# Drop the bootstrap CPU limit; the memory limit stays, and
# check-hpa-vpa-invariant.py gates the policy. op: remove fails loud if a
# regenerated manifest already drops it.
- target:
    kind: Deployment
    name: (source-controller|kustomize-controller|helm-controller|notification-controller)
  patch: |
    - op: remove
      path: /spec/template/spec/containers/0/resources/limits/cpu
# An undefined ${var} in a stage's postBuild is a reconcile error, not an
# empty string.
- target:
    kind: Deployment
    name: kustomize-controller
  patch: |
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --feature-gates=StrictPostBuildSubstitutions=true
    # A tenant tree builds from its own reviewed source only, never a remote
    # base fetched by the cluster-admin controller.
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --no-remote-bases=true
# A tenant holds admin over notification.toolkit.fluxcd.io in its namespace, so
# its Alerts and Receivers must not name flux-system objects.
- target:
    kind: Deployment
    name: notification-controller
  patch: |
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --no-cross-namespace-refs=true
