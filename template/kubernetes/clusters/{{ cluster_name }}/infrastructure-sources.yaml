---
# Stage 1/5 — HelmRepository sources plus the cluster-versions and
# cluster-config ConfigMaps every later stage reads. No postBuild: this stage
# creates them and carries no placeholders of its own.

# wait:false: these CRs are usable the moment they are applied, and waiting on
# chart index fetches would stall the crds -> controllers -> configs chain.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-sources
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/infrastructure/sources
  prune: true
  wait: false
