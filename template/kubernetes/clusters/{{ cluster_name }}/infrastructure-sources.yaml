---
# HelmRepository sources, the PriorityClasses and the cluster-versions and
# cluster-config ConfigMaps every later stage reads. No postBuild: this stage
# creates them and carries no placeholders of its own.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-sources
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/infrastructure/sources
  prune: true
  # These CRs are usable once applied; waiting on chart index fetches would
  # stall the whole downstream chain. helm-controller already waits per chart.
  wait: false
