---
# Workloads, one directory per app. dependsOn infrastructure-configs, not
# observability: apps wait for the platform chain (sources -> crds ->
# controllers -> configs) and run parallel to the observability stage.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  # Headroom over the slowest release this stage waits on (authentik, 15m).
  timeout: 25m
  dependsOn:
    - name: infrastructure-configs
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-versions
        optional: false
      - kind: ConfigMap
        name: cluster-config
        optional: false
