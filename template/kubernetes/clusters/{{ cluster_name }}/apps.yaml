---
# Workloads (one directory per app).
#
# dependsOn infrastructure-configs, NOT observability: apps wait for the
# platform chain (sources -> crds -> controllers -> configs) but never on
# observability health. Trade-off: on a truly-fresh bootstrap an app that ships
# a ServiceMonitor/PodMonitor retries until the crds stage's CRDs land — which
# it already has, since crds runs first.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  dependsOn:
    - name: infrastructure-configs
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps
  prune: true
  wait: true
  # optional:false — see infrastructure-sources.yaml for why only that stage
  # tolerates a miss.
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-versions
        optional: false
      - kind: ConfigMap
        name: cluster-config
        optional: false
