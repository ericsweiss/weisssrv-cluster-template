---
# Cluster entrypoint: the bootstrap flux-system Kustomization reconciles this
# path. Stage order lives in each stage file's dependsOn.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - flux-system
  - infrastructure-sources.yaml
  - infrastructure-crds.yaml
  - infrastructure-controllers.yaml
  - infrastructure-configs.yaml
  - infrastructure-observability.yaml
  - infrastructure-metrics-server.yaml
  - apps.yaml
  - tenants
