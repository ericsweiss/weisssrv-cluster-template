---
# Stage 2/5 — CRD bootstrap. Installs the monitoring.coreos.com CRDs before
# the controllers stage, which renders ServiceMonitors: on a fresh cluster the
# Traefik chart hard-fails its template render when that API is absent
# ("you have to deploy monitoring.coreos.com/v1 first"). wait:true holds the
# controllers stage until the CRDs are Established.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-crds
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  dependsOn:
    - name: infrastructure-sources
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/infrastructure/crds
  prune: true
  wait: true
  # Both ConfigMaps come from infrastructure-sources, which must be Ready
  # before this stage runs — optional:false so a missing one fails loudly
  # instead of rendering empty versions/domains.
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-versions
        optional: false
      - kind: ConfigMap
        name: cluster-config
        optional: false
