---
# Stage 2/5 — CRD bootstrap. Installs the monitoring.coreos.com CRDs before the
# controllers stage, whose charts fail to render ServiceMonitors without them.
# wait:true holds the controllers stage until the CRDs are Established.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-crds
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  # Headroom over the slowest release this stage waits on (the CRD chart, 10m).
  timeout: 15m
  dependsOn:
    - name: infrastructure-sources
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/infrastructure/crds
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-versions
        optional: false
      - kind: ConfigMap
        name: cluster-config
        optional: false
