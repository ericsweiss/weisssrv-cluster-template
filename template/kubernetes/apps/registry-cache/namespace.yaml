---
apiVersion: v1
kind: Namespace
metadata:
  name: registry-cache
  labels:
    app.kubernetes.io/name: registry-cache
    app.kubernetes.io/part-of: registry-cache
    app.kubernetes.io/managed-by: flux
    # ClusterSecretStore opt-in label (configs/cluster-secret-store.yaml).
    ${cluster_node_label_domain}/cluster-secrets: "true"
    # enforce baseline / warn+audit restricted: the pod already applies
    # restricted-style hardening, but the upstream image is used verbatim and is
    # not guaranteed to start under a strict restricted enforce.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
