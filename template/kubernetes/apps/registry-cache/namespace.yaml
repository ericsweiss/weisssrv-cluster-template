---
apiVersion: v1
kind: Namespace
metadata:
  name: registry-cache
  labels:
    app.kubernetes.io/name: registry-cache
    app.kubernetes.io/part-of: registry-cache
    app.kubernetes.io/managed-by: flux
    # Opts this namespace into the platform ClusterSecretStore, whose
    # spec.conditions admit only namespaces carrying this label.
    ${cluster_node_label_domain}/cluster-secrets: "true"
    # enforce baseline / warn+audit restricted: the pod already applies
    # restricted-style hardening, but the upstream image is used verbatim and is
    # not guaranteed to start under a strict restricted enforce.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
