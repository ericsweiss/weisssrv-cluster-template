---
# Pull-through registry cache. See README.md.
#
# replicas 1 + Recreate: the cache is a single-instance node-local store
# (emptyDir). A second replica is just a second cold cache — there is nothing to
# make HA, and nothing to lose on a restart.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-cache
  namespace: registry-cache
  labels:
    app.kubernetes.io/name: registry-cache
    app.kubernetes.io/part-of: registry-cache
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: registry-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry-cache
        app.kubernetes.io/part-of: registry-cache
    spec:
      # Steer off the storage node: this is disposable node-local scratch, and
      # the storage node's memory is spoken for. Soft, so a small cluster still
      # schedules it.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: ${cluster_node_label_domain}/nas
                    operator: DoesNotExist
      nodeSelector:
        ${cluster_node_label_domain}/general: "true"
      automountServiceAccountToken: false
      # Uncomment when the upstream registry's name resolves publicly but is
      # actually served by this cluster's internal ingress VIP — otherwise pods
      # hairpin out to the WAN and back. Node-level /etc/hosts entries do NOT
      # reach pods (they resolve via CoreDNS), so the pin is repeated here.
      # hostAliases:
      #   - ip: "${cluster_metallb_internal_vip}"
      #     hostnames:
      #       - registry.${cluster_git_host}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # fsGroup so the non-root process can write the blob store on the
        # emptyDir below.
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: registry
          image: registry:${registry_cache_version}
          imagePullPolicy: IfNotPresent
          env:
            - name: REGISTRY_PROXY_REMOTEURL
              value: https://registry.${cluster_git_host}
            - name: REGISTRY_PROXY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: registry-cache-secrets
                  key: proxy-username
            - name: REGISTRY_PROXY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: registry-cache-secrets
                  key: proxy-password
            - name: REGISTRY_HTTP_ADDR
              value: ":5000"
            # Explicit so readOnlyRootFilesystem leaves exactly one writable path.
            - name: REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY
              value: /var/lib/registry
            # Metrics live on a separate debug listener, not the registry API.
            - name: REGISTRY_HTTP_DEBUG_ADDR
              value: ":5001"
            - name: REGISTRY_HTTP_DEBUG_PROMETHEUS_ENABLED
              value: "true"
            - name: REGISTRY_HTTP_DEBUG_PROMETHEUS_PATH
              value: /metrics
            - name: REGISTRY_LOG_LEVEL
              value: info
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
            - name: metrics
              containerPort: 5001
              protocol: TCP
          # /v2/ is the registry API version endpoint — 200 once the server is up
          # (the cache runs no auth of its own; auth is only toward the upstream).
          startupProbe:
            httpGet:
              path: /v2/
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /v2/
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /v2/
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              # No CPU limit (blob proxying is bursty and I/O-bound); memory
              # capped because OOM is a real failure mode.
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: cache
              mountPath: /var/lib/registry
      volumes:
        # Node-local scratch with a hard cap: exceeding it evicts the pod, which
        # reschedules and re-warms. Size it to the working set of images you
        # actually pull through.
        - name: cache
          emptyDir:
            sizeLimit: 10Gi
