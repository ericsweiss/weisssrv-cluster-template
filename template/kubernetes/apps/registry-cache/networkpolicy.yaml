---
# Ingress: :5000 from gitlab-runner-privileged only (the shared runner is not
# admitted), :5001 from the Prometheus pod.
# Kubelet health probes are node-local and not gated by NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-registry-cache-ingress
  namespace: registry-cache
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: registry-cache
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gitlab-runner-privileged
      ports:
        - protocol: TCP
          port: 5000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 5001

---
# Egress: the self-hosted upstream through this cluster's ingress pod, plus DNS
# from the netpol-egress-dns component. For a public upstream, swap in the
# netpol-egress-public component.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-registry-upstream
  namespace: registry-cache
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: registry-cache
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
        # Belt-and-braces: the namespaceSelector matches post-DNAT; the VIP
        # ipBlock also admits the pre-DNAT form so a CNI change cannot silently
        # break the fetch.
        - ipBlock:
            cidr: ${cluster_metallb_internal_vip}/32
      ports:
        - protocol: TCP
          port: 443
