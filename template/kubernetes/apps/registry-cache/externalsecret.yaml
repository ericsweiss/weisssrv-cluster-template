---
# Upstream-registry read-only credentials for the pull-through cache. Both
# fields MUST exist on the item: a missing field fails the whole Secret sync
# and the pod waits on the absent key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry-cache-secrets
  namespace: registry-cache
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: ${cluster_secret_store}
  target:
    name: registry-cache-secrets
    creationPolicy: Owner
  data:
    - secretKey: proxy-username
      remoteRef:
        key: Registry Cache Upstream
        property: username
    - secretKey: proxy-password
      remoteRef:
        key: Registry Cache Upstream
        property: password
