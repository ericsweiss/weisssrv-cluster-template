---
# Registry metrics from the debug listener (:5001), enabled by
# REGISTRY_HTTP_DEBUG_PROMETHEUS_ENABLED. networkpolicy.yaml opens the
# observability -> :5001 ingress, scoped to the Prometheus pods.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: registry-cache
  namespace: registry-cache
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: registry-cache
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
