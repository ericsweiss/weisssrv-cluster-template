---
# Initial: resize on natural restarts. The emptyDir cache is disposable, so an
# eviction costs a re-warm and never data — but there is no reason to evict a
# warm cache proactively either.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: registry-cache
  namespace: registry-cache
spec:
  targetRef: {apiVersion: apps/v1, kind: Deployment, name: registry-cache}
  updatePolicy: {updateMode: Initial}
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 25m, memory: 64Mi}
        maxAllowed: {cpu: 1, memory: 409Mi}
        controlledResources: [cpu, memory]
