---
# Deletes leaked runner job pods and their orphaned per-job dockercfg Secrets
# in both runner namespaces. The program is gitlab-runner-reaper.py, mounted
# from the configMapGenerator in kustomization.yaml; guard model in README.md.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gitlab-runner-reaper
  namespace: gitlab-runner-reaper
spec:
  schedule: "*/15 * * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      # Ceiling for the WHOLE Job, retries included: backoffLimit+1 = 3 attempts
      # of BUDGET_SECONDS (90s) plus one API_TIMEOUT_SECONDS overrun and startup
      # each. Well under the */15 schedule; Forbid covers the rest.
      activeDeadlineSeconds: 360
      # Bounds how long a finished Job lingers, leaving a half-day to inspect a
      # failure (the history limits bound the count).
      ttlSecondsAfterFinished: 43200
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: true
          serviceAccountName: gitlab-runner-reaper
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reaper
              # Digest-pinned: this workload deletes pods. The image must ship
              # python3 — the program is gitlab-runner-reaper.py, stdlib only;
              # a shell-only base cannot run it at all.
              image: python:3.14-slim@sha256:b877e50bd90de10af8d82c57a022fc2e0dc731c5320d762a27986facfc3355c1
              command:
                - python3
                - /opt/reaper/gitlab-runner-reaper.py
              env:
                - name: NAMESPACES
                  value: "gitlab-runner-privileged gitlab-runner"
                # Guard 1: the label every executor pod carries and no manager pod
                # does. Must match pod_labels in BOTH runner releases.
                - name: RUNNER_CLASS_LABEL
                  value: "${cluster_node_label_domain}/runner-class"
                - name: MAX_AGE_MINUTES
                  value: "30"
                - name: MAX_SECRET_AGE_MINUTES
                  value: "180"
                # One namespace-rotation slot per run, so it must equal the
                # schedule period above (*/15 = 900s); the unit test parses both
                # out of this file and asserts they match.
                - name: ROTATE_PERIOD_SECONDS
                  value: "900"
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: script
                  mountPath: /opt/reaper
                  readOnly: true
          volumes:
            - name: script
              configMap:
                # kustomize rewrites this to the hashed generator name, so a
                # script edit rolls a new ConfigMap instead of mutating in place.
                name: gitlab-runner-reaper-script
                defaultMode: 0555
