---
# CRITICAL: no top-level `namespace:`. The namespace transformer overrides each
# resource's own metadata.namespace and would break the cross-namespace
# RoleBindings. Every resource carries its own namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - rbac.yaml
  - cronjob.yaml

# The reaper only talks to the kube-API: DNS + apiserver are its whole egress,
# and nothing serves traffic, hence the baseline ingress deny.
components:
  - ../../components/netpol-baseline
  - ../../components/netpol-egress-dns
  - ../../components/netpol-egress-apiserver

# The CronJob's program. It sits beside this kustomization because kustomize
# refuses generator sources outside the kustomization root.
# Unit tests: tests/test_gitlab_runner_reaper.py.
configMapGenerator:
  - name: gitlab-runner-reaper-script
    namespace: gitlab-runner-reaper
    files:
      - gitlab-runner-reaper.py

patches:
  # No namespace transformer here (see above), so namespace the component-shipped
  # policies explicitly. `name` is a regex.
  - target:
      kind: NetworkPolicy
      name: (default-deny-ingress|allow-egress-dns|allow-egress-apiserver)
    patch: |
      - op: add
        path: /metadata/namespace
        value: gitlab-runner-reaper
