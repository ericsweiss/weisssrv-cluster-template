---
# One ServiceAccount, plus a ClusterRole of pods and secrets list+delete bound
# by two namespaced RoleBindings, never a ClusterRoleBinding, so the grant
# reaches only the two runner namespaces. See README.md, section RBAC.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitlab-runner-reaper
  namespace: gitlab-runner-reaper
  labels:
    app.kubernetes.io/managed-by: flux
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gitlab-runner-reaper
  labels:
    app.kubernetes.io/managed-by: flux
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-runner-reaper
  namespace: gitlab-runner-privileged
  labels:
    app.kubernetes.io/managed-by: flux
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gitlab-runner-reaper
subjects:
  - kind: ServiceAccount
    name: gitlab-runner-reaper
    namespace: gitlab-runner-reaper
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-runner-reaper
  namespace: gitlab-runner
  labels:
    app.kubernetes.io/managed-by: flux
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gitlab-runner-reaper
subjects:
  - kind: ServiceAccount
    name: gitlab-runner-reaper
    namespace: gitlab-runner-reaper
