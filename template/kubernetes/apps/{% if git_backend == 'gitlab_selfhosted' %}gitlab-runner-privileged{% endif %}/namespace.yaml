---
# CRITICAL: this namespace runs `privileged` PSS for Docker-in-Docker job pods.
# Untrusted jobs must never land here; they belong in the shared runner.
# Namespace separation is the isolation boundary for the runner token Secret.
apiVersion: v1
kind: Namespace
metadata:
  name: gitlab-runner-privileged
  labels:
    app.kubernetes.io/name: gitlab-runner-privileged
    app.kubernetes.io/part-of: gitlab
    app.kubernetes.io/managed-by: flux
    # ClusterSecretStore opt-in label (configs/cluster-secret-store.yaml).
    ${cluster_node_label_domain}/cluster-secrets: "true"
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
