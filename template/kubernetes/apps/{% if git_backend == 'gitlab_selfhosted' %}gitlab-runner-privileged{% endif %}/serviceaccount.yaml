---
# ServiceAccount for JOB pods (runners.kubernetes.service_account in
# release.yaml), deliberately separate from the chart-managed manager SA: the
# manager's Role grants secrets get/list and pods/exec/patch in this namespace,
# and job pods here run root + Docker-in-Docker off unprotected branches. This
# SA has NO RoleBinding and no mounted token, so a job cannot read the runner
# token, other jobs' pod specs (CI variables), or exec into the manager. Jobs
# that genuinely need the kube-API bring an explicit kubeconfig.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitlab-runner-privileged-jobs
  namespace: gitlab-runner-privileged
automountServiceAccountToken: false
