---
# CRITICAL: job-pod SA (runners.kubernetes.service_account), separate from the
# chart-managed manager SA, which can read Secrets and exec pods here.
# It has no RoleBinding and no mounted token; jobs needing the kube-API bring
# their own kubeconfig.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitlab-runner-privileged-jobs
  namespace: gitlab-runner-privileged
automountServiceAccountToken: false
