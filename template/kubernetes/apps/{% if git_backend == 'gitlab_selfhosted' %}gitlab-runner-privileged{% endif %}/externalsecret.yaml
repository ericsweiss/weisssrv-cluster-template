---
# Privileged runner authentication token. Lives in this namespace so the shared
# runner's namespace-scoped RBAC cannot read it — the two tokens co-resided once,
# which made the untrusted tier able to read the trusted tier's credential.
#
# The chart's projected-secrets volume requires BOTH `runner-token` and
# `runner-registration-token`, even though the legacy registration flow is unused
# — the template supplies the second as an empty string so the mount succeeds.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-runner-privileged-token
  namespace: gitlab-runner-privileged
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: ${cluster_secret_store}
  target:
    name: gitlab-runner-privileged-token
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        runner-token: "{{ .token }}"
        runner-registration-token: ""
  data:
    - secretKey: token
      remoteRef:
        key: GitLab Runner Privileged
        property: runner-token
