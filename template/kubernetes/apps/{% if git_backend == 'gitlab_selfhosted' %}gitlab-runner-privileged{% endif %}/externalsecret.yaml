---
# Privileged runner authentication token. It lives in this namespace so the
# shared runner's namespace-scoped RBAC cannot read it — the two tiers must never
# share a namespace.
#
# THE TOKEN'S SCOPE IS THE SECURITY BOUNDARY. It must come from
# Project -> Settings -> CI/CD -> Runners -> "New project runner" on THIS
# repository — not from Admin Area (instance) and not from a group that contains
# untrusted projects. Confirm with `GET /api/v4/runners/<id>` returning
# "runner_type": "project_type" before storing the token in the vault, and again
# after any rotation: rotating through the wrong screen silently converts this
# into an instance runner. See release.yaml and README.md.
#
# The chart's projected-secrets volume requires BOTH `runner-token` and
# `runner-registration-token`, even though the legacy registration flow is unused
# — the template supplies the second as an empty string so the mount succeeds.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-runner-privileged-token
  namespace: gitlab-runner-privileged
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: ${cluster_secret_store}
  target:
    name: gitlab-runner-privileged-token
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        runner-token: "{{ .token }}"
        runner-registration-token: ""
  data:
    - secretKey: token
      remoteRef:
        key: GitLab Runner Privileged
        property: runner-token
