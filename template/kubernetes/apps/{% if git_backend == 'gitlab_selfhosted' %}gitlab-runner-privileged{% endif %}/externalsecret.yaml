---
# CRITICAL: the token's scope is the security boundary. Create it only from
# this project's Settings -> CI/CD -> Runners -> "New project runner", never
# from Admin Area or a group holding untrusted projects, and confirm
# `GET /api/v4/runners/<id>` returns "runner_type": "project_type" after every
# rotation. It lives in its own namespace so the shared runner's RBAC cannot
# read it. See README.md.

# The chart's projected-secrets volume requires both `runner-token` and
# `runner-registration-token`; the second is supplied empty.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-runner-privileged-token
  namespace: gitlab-runner-privileged
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: ${cluster_secret_store}
  target:
    name: gitlab-runner-privileged-token
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        runner-token: "{{ .token }}"
        runner-registration-token: ""
  data:
    - secretKey: token
      remoteRef:
        key: GitLab Runner Privileged
        property: runner-token
