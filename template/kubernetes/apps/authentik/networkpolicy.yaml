---
# Server: HTTP from Traefik, metrics from observability.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-server-ingress
  namespace: authentik
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: authentik
      app.kubernetes.io/component: server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 9000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9300

---
# Worker: no HTTP surface, but observability scrapes its metrics port (9300) via
# the authentik-worker PodMonitor. The server rule above selects
# component=server only, so the worker needs its own allow.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-worker-metrics
  namespace: authentik
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: authentik
      app.kubernetes.io/component: worker
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9300

---
# PostgreSQL: 5432 only from authentik pods and the dump CronJob; observability
# scrapes the postgres_exporter sidecar on 9187 (release.yaml postgresql.metrics).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-from-authentik
  namespace: authentik
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: authentik
      app.kubernetes.io/name: postgresql
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: authentik
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: authentik-pg-dump
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9187

---
# Dump CronJob egress: PostgreSQL only (DNS comes from the shared component).
# NFS is mounted by the kubelet on the node, not by the pod, so it is not policed
# here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-pg-dump
  namespace: authentik
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: authentik-pg-dump
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: authentik
              app.kubernetes.io/name: postgresql
      ports:
        - protocol: TCP
          port: 5432

---
# Server + worker egress: PostgreSQL, the kube-apiserver and the SMTP relay.
# The apiserver rule allowlists the server node range, not the in-cluster API
# VIP, because kube-proxy DNATs the VIP before NetworkPolicy evaluation.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-authentik
  namespace: authentik
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: authentik
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: authentik
              app.kubernetes.io/name: postgresql
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - ipBlock:
            cidr: ${cluster_apiserver_egress_cidr}
      ports:
        - protocol: TCP
          port: 6443
    - to:
        - ipBlock:
            cidr: ${cluster_lan_cidr}
      ports:
        # Submission + STARTTLS only; nothing here dials cleartext 25.
        - protocol: TCP
          port: 587
