---
# Initial for the stateless server and worker, so a live identity provider is
# never evicted; Off for PostgreSQL, recommendations only. The server is
# memory-only: the chart-native HPA owns its CPU.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: authentik-server
  namespace: authentik
spec:
  targetRef: {apiVersion: apps/v1, kind: Deployment, name: authentik-server}
  updatePolicy: {updateMode: Initial}
  resourcePolicy:
    containerPolicies:
      # RequestsOnly: maxAllowed.memory tracks the fixed limit in release.yaml -
      # move both in the same commit.
      - containerName: "*"
        controlledValues: RequestsOnly
        minAllowed: {memory: 256Mi}
        maxAllowed: {memory: 1536Mi}
        controlledResources: [memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: authentik-worker
  namespace: authentik
spec:
  targetRef: {apiVersion: apps/v1, kind: Deployment, name: authentik-worker}
  updatePolicy: {updateMode: Initial}
  resourcePolicy:
    containerPolicies:
      # Same shape as the server: maxAllowed.memory equals release.yaml's
      # hand-set memory limit, so move both together. The worker sets no CPU
      # limit, so the CPU cap is request headroom only.
      - containerName: "*"
        controlledValues: RequestsOnly
        minAllowed: {cpu: 25m, memory: 256Mi}
        maxAllowed: {cpu: 1, memory: 1536Mi}
        controlledResources: [cpu, memory]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: authentik-postgresql
  namespace: authentik
spec:
  targetRef: {apiVersion: apps/v1, kind: StatefulSet, name: authentik-postgresql}
  updatePolicy: {updateMode: "Off"}
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 50m, memory: 128Mi}
        maxAllowed: {cpu: 2, memory: 2Gi}
        controlledResources: [cpu, memory]
