---
# ForwardAuth for SSO-protected routes.
# Usage: middlewares: [{name: authentik-auth, namespace: authentik}]
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-auth
  namespace: authentik
spec:
  forwardAuth:
    address: http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
      - X-authentik-meta-jwks
      - X-authentik-meta-outpost
      - X-authentik-meta-provider
      - X-authentik-meta-app

---
# Identical to authentik-auth, PLUS `Authorization` in authResponseHeaders.
#
# Traefik DELETES every listed header from the client request and re-adds it only
# if the auth response carries it — so putting `Authorization` on the SHARED
# middleware above would strip client-sent credentials (API keys, basic auth) on
# every route that uses it. Attach this variant ONLY to routes whose upstream
# expects the injected credentials (a proxy provider with basic_auth_enabled);
# those upstreams validate the injected header against their own local users, so
# the double login disappears while direct access still needs the real password.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-auth-basic
  namespace: authentik
spec:
  forwardAuth:
    address: http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
      - X-authentik-meta-jwks
      - X-authentik-meta-outpost
      - X-authentik-meta-provider
      - X-authentik-meta-app
      - Authorization
