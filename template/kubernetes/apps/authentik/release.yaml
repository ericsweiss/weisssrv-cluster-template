---
# authentik — the cluster's identity provider. Chart and image versions come from
# the versions ConfigMap; hostnames and backend addresses from cluster-config.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 30m
  releaseName: authentik
  # The chart omits .spec.replicas while server.autoscaling is on and injects no
  # webhook caBundle, so drift detection is safe here.
  driftDetection:
    mode: enabled
  # Upgrades run PostgreSQL schema migrations that routinely take 5-10 minutes.
  # Flux's 5m default would trigger remediation mid-migration.
  timeout: 15m
  chart:
    spec:
      chart: authentik
      version: "${authentik_version}"
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: flux-system
      interval: 12h
  install:
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
      remediateLastFailure: true
  # Image tags substituted from the cluster-versions ConfigMap. Values stay
  # inline: HelmRelease.spec.valuesFrom has no namespace field, so a referenced
  # ConfigMap would have to live in this namespace.
  values:
    # Canonical origin: the OIDC issuer is always the EXTERNAL host, even for
    # internal-only apps (AUTHENTIK_WEB__BASE_URL in server.env/worker.env).
    authentik:
      email:
        host: ${cluster_smtp_host}
        port: 587
        use_tls: true
        use_ssl: false
        from: "Authentik SSO <authentik@${cluster_internal_domain}>"
        # Credentials arrive via AUTHENTIK_EMAIL__* env below.
        username: ""
        password: ""

      error_reporting:
        enabled: false

      postgresql:
        host: '{{ .Release.Name }}-postgresql'
        name: authentik
        user: authentik
        password: ""  # from existingSecret

    server:
      # Chart-native HPA: with server.autoscaling on the chart omits
      # .spec.replicas, so a helm upgrade cannot churn against the HPA. CPU is
      # owned here; vpa.yaml scopes the server to memory only.
      autoscaling:
        enabled: true
        minReplicas: 2
        maxReplicas: 4
        metrics:
          - type: Resource
            resource:
              name: cpu
              target:
                type: Utilization
                averageUtilization: 75
        # Stabilization windows damp flap from sub-minute login bursts and
        # background task reconciles; sustained load still scales out.
        behavior:
          scaleUp:
            stabilizationWindowSeconds: 120
            policies:
              - type: Pods
                value: 1
                periodSeconds: 60
          scaleDown:
            stabilizationWindowSeconds: 300
            policies:
              - type: Pods
                value: 1
                periodSeconds: 120

      pdb:
        enabled: true
        minAvailable: 1

      # NOTE: the SA token mount stays ENABLED — authentik drives its
      # integration/outpost controller through the Kubernetes API. seccompProfile
      # is the only hardening the chart cleanly exposes at pod level here.
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      image:
        tag: "${authentik_version}"

      env:
        # Base URL (scheme+host only): advisory in 2026.8, REQUIRED from 2026.11.
        # The canonical origin is the EXTERNAL issuer host — the OIDC issuer is
        # always auth.<external> even for internal-only apps.
        - name: AUTHENTIK_WEB__BASE_URL
          value: "https://auth.${cluster_external_domain}"
        - name: AUTHENTIK_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: secret-key
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: postgresql-password
        - name: AUTHENTIK_EMAIL__USERNAME
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: smtp-username
        - name: AUTHENTIK_EMAIL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: smtp-password

      # The CPU request is sized so the HPA's 75% target sits well above idle
      # draw — otherwise the threshold trips at near-idle and the HPA pins to
      # maxReplicas. The VPA manages memory only here, so this stays static.
      resources:
        requests:
          cpu: 200m
          memory: 1Gi
        limits:
          memory: 1536Mi

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: server
                    app.kubernetes.io/name: authentik
                topologyKey: kubernetes.io/hostname

      metrics:
        enabled: true
        serviceMonitor:
          enabled: true

      ingress:
        enabled: false  # Traefik IngressRoute instead

    worker:
      replicas: 1

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      image:
        tag: "${authentik_version}"

      # The worker's healthcheck writes a PID file to /dev/shm; without this
      # volume it fails with "open /dev/shm/authentik-worker.pid: no such file".
      # The chart's keys are additionalVolumes/additionalVolumeMounts, not volumes.
      additionalVolumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi

      additionalVolumeMounts:
        - name: shm
          mountPath: /dev/shm

      # Generous probe timing — the worker can be slow while processing tasks.
      livenessProbe:
        exec:
          command:
            - ak
            - healthcheck
        initialDelaySeconds: 30
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 5

      startupProbe:
        exec:
          command:
            - ak
            - healthcheck
        initialDelaySeconds: 60
        periodSeconds: 10
        timeoutSeconds: 10
        failureThreshold: 30

      env:
        # Base URL (scheme+host only): advisory in 2026.8, REQUIRED from 2026.11.
        # The canonical origin is the EXTERNAL issuer host — the OIDC issuer is
        # always auth.<external> even for internal-only apps.
        - name: AUTHENTIK_WEB__BASE_URL
          value: "https://auth.${cluster_external_domain}"
        - name: AUTHENTIK_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: secret-key
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: postgresql-password
        - name: AUTHENTIK_EMAIL__USERNAME
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: smtp-username
        - name: AUTHENTIK_EMAIL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: smtp-password

      resources:
        requests:
          cpu: 100m
          memory: 768Mi
        limits:
          memory: 1536Mi

    # Bundled PostgreSQL. Move to an external/HA database if this becomes
    # load-bearing for more than SSO.
    postgresql:
      enabled: true
      image:
        tag: "${postgresql_version}"
      # postgres_exporter sidecar; its only scrape is the chart-rendered
      # ServiceMonitor, its ingress allow is in networkpolicy.yaml. extraEnvVars
      # re-point it at the `authentik` role (the subchart hardcodes `postgres`).
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
          interval: 30s
        extraEnvVars:
          - name: DATA_SOURCE_USER
            value: authentik
          - name: DATA_SOURCE_PASS_FILE
            value: /opt/bitnami/postgresql/secrets/postgresql-password
          - name: DATA_SOURCE_URI
            value: 127.0.0.1:5432/authentik?sslmode=disable
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
      auth:
        username: authentik
        database: authentik
        existingSecret: authentik-secrets
        secretKeys:
          adminPasswordKey: postgresql-admin-password
          userPasswordKey: postgresql-password
      primary:
        persistence:
          enabled: true
          size: 10Gi
          storageClass: ""
          existingClaim: authentik-postgres-data
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
        # Pinned to the storage node, where the data volume lives.
        nodeSelector:
          ${cluster_node_label_domain}/nas: "true"
        tolerations:
          - key: ${cluster_node_label_domain}/nas
            operator: Equal
            value: "true"
            effect: PreferNoSchedule

    # No bundled Redis — all authentik state lives in PostgreSQL.
    redis:
      enabled: false

    serviceAccount:
      create: true
