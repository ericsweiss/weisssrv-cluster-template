---
# Shared transport for Traefik -> off-cluster HTTPS backends. serverName is a
# sentinel covered by the internal wildcard SAN, so verification succeeds
# without insecureSkipVerify. See README.md.
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: vm-tls-wildcard
  namespace: vm-ingress
spec:
  serverName: vm.${cluster_internal_domain}
  maxIdleConnsPerHost: 32
  forwardingTimeouts:
    dialTimeout: 10s
    responseHeaderTimeout: 30s
    idleConnTimeout: 90s
