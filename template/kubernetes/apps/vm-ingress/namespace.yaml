---
# Routes to off-cluster backends live in their own namespace rather than in
# `default`, so they can be listed, pruned and RBAC-scoped as a unit. No pods run
# here — only Services, EndpointSlices, IngressRoutes and the ServersTransport.
apiVersion: v1
kind: Namespace
metadata:
  name: vm-ingress
  labels:
    app.kubernetes.io/name: vm-ingress
    app.kubernetes.io/managed-by: flux
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
