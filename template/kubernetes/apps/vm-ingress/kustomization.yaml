---
# example-route.yaml and certificate.yaml are deliberately NOT listed: nothing
# terminates TLS here until you add a real route. Copy the example, edit it,
# then list YOUR file and certificate.yaml below (README.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - serverstransport.yaml

# Free here — nothing runs in this namespace, but the deny is mandatory and the
# first helper pod would otherwise land unfenced.
components:
  - ../../components/netpol-baseline
patches:
  # No namespace transformer here, so namespace the shared policy explicitly.
  - target:
      kind: NetworkPolicy
      name: default-deny-ingress
    patch: |
      - op: add
        path: /metadata/namespace
        value: vm-ingress
