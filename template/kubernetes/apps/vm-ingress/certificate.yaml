# Not reconciled until kustomization.yaml lists it beside your first route.
# Stagger renewBefore against the other wildcard copies; README.md,
# Certificates in this namespace, says why.
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: internal-wildcard
  namespace: vm-ingress
spec:
  secretName: internal-wildcard-tls
  issuerRef:
    name: ${cluster_issuer}
    kind: ClusterIssuer
  # `dnsNames` alone: Let's Encrypt issues no Common Name, and a CN built from a
  # long domain would breach the 64-byte X.509 limit.
  dnsNames:
    - "*.${cluster_internal_domain}"
    - ${cluster_internal_domain}
  renewBefore: 660h
