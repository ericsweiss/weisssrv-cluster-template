# CRITICAL: template, not reconciled as-is. Enable it together with your first
# route, adding both files to kustomization.yaml. This namespace needs its own
# wildcard copy because Traefik reads Secrets only from the IngressRoute's
# namespace. Each copy fires its own ACME order, so stagger renewBefore against
# the other copies or a shared renewal window burns the duplicate-certificate
# rate limit. README.md, Certificates in this namespace.
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: internal-wildcard
  namespace: vm-ingress
spec:
  secretName: internal-wildcard-tls
  issuerRef:
    name: ${cluster_issuer}
    kind: ClusterIssuer
  # `dnsNames` alone: Let's Encrypt issues no Common Name, and a CN built from a
  # long domain would breach the 64-byte X.509 limit.
  dnsNames:
    - "*.${cluster_internal_domain}"
    - ${cluster_internal_domain}
  renewBefore: 660h
