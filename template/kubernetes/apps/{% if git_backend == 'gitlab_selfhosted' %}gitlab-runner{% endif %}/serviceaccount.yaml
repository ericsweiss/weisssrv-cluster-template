---
# CRITICAL: job-pod SA, separate from the chart-managed manager SA, which can
# read Secrets and exec pods here. Job pods run untrusted branch code.
# It has no RoleBinding and no mounted token; jobs needing the kube-API bring
# their own kubeconfig.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitlab-runner-jobs
  namespace: gitlab-runner
automountServiceAccountToken: false
