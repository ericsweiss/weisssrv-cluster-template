---
# ServiceAccount for JOB pods, deliberately separate from the chart-managed
# manager SA: the manager's Role grants secrets get/list and pods/exec in this
# namespace, and job pods run untrusted branch code from any project. This SA has
# NO RoleBinding and no mounted token, so a malicious job cannot read the runner
# token, other jobs' pod specs (CI variables), or exec into the manager. Jobs that
# genuinely need the API bring an explicit kubeconfig.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitlab-runner-jobs
  namespace: gitlab-runner
automountServiceAccountToken: false
