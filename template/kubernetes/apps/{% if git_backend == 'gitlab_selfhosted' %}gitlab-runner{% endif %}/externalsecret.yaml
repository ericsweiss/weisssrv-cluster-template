---
# Shared runner authentication token, consumed by the HelmRelease via
# runners.secret. The chart's projected-secrets volume requires both keys, so
# `runner-registration-token` is supplied empty.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-runner-token
  namespace: gitlab-runner
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: ${cluster_secret_store}
  target:
    name: gitlab-runner-token
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        runner-token: "{{ .token }}"
        runner-registration-token: ""
  data:
    - secretKey: token
      remoteRef:
        key: GitLab Runner
        property: runner-token
