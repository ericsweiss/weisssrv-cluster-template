---
# Initial: resize on natural restarts, never evict a live resolver. CoreDNS is
# lightweight; small caps stop a runaway estimate from over-requesting.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: tailnet-dns
  namespace: tailnet-dns
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tailnet-dns
  updatePolicy:
    updateMode: Initial
  resourcePolicy:
    containerPolicies:
      - containerName: coredns
        minAllowed: {cpu: 25m, memory: 32Mi}
        maxAllowed: {cpu: 200m, memory: 102Mi}
        controlledResources: [cpu, memory]
