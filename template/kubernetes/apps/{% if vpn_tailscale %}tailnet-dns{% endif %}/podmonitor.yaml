---
# Scrapes the CoreDNS prometheus plugin for query-rate, cache and SERVFAIL
# visibility. Reaching :9153 requires the allow-observability-scrape policy,
# since this namespace is default-deny ingress.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: tailnet-dns
  namespace: tailnet-dns
  labels:
    app: tailnet-dns
spec:
  selector:
    matchLabels:
      app: tailnet-dns
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
