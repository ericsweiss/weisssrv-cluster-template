---
# Corefile for the tailnet split-horizon resolver. See README.md — in
# particular, the two cluster-config keys this file cannot work without.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tailnet-dns-corefile
  namespace: tailnet-dns
data:
  Corefile: |
    # Override zone: names that must resolve to a real LAN address rather than
    # to Traefik. Which names belong here: README.md, The override list. Parity
    # with the resolver's rewrites is enforced by check-tailnet-dns-parity.py.
    ${cluster_nas_host} ${cluster_smtp_host} dns.${cluster_internal_domain} k3s.${cluster_internal_domain} vip-public.${cluster_internal_domain} {
        errors
        forward . ${cluster_upstream_dns_servers}
        cache 30
    }

    # Every other internal name is Traefik-fronted, so answer with a CNAME to
    # the Traefik tailnet device, which MagicDNS resolves over the mesh. Query
    # types other than A/AAAA fall through to the LAN resolvers.
    ${cluster_internal_domain} {
        errors
        template IN A ${cluster_internal_domain} {
            answer "{{ .Name }} 60 IN CNAME traefik-tailnet.${cluster_tailnet_dns_suffix}."
        }
        template IN AAAA ${cluster_internal_domain} {
            answer "{{ .Name }} 60 IN CNAME traefik-tailnet.${cluster_tailnet_dns_suffix}."
        }
        forward . ${cluster_upstream_dns_servers}
        cache 30
    }

    # Catch-all (Split-DNS already scopes queries to the internal domain, so this
    # is belt-and-braces) plus the health/readiness/metrics endpoints.
    .:53 {
        errors
        forward . ${cluster_upstream_dns_servers}
        cache 30
        health :8080
        ready :8181
        prometheus :9153
        reload
    }
