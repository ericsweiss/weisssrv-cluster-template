---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tailnet-dns

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  - podmonitor.yaml
  - pdb.yaml
  - vpa.yaml

# No netpol-egress-dns component here: this IS a resolver, and it forwards to the
# LAN resolvers directly rather than through cluster DNS.
components:
  - ../../components/netpol-baseline
