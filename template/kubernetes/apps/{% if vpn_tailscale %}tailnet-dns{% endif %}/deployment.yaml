---
# CoreDNS for the tailnet split-horizon view (see configmap.yaml). Two replicas
# for availability; the reloader annotation restarts pods when the Corefile
# changes. The image is the same CoreDNS build k3s already caches on every node,
# so there is no new pull.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailnet-dns
  namespace: tailnet-dns
  labels:
    app: tailnet-dns
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tailnet-dns
  template:
    metadata:
      labels:
        app: tailnet-dns
    spec:
      priorityClassName: system-cluster-critical
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: tailnet-dns
      containers:
        - name: coredns
          image: rancher/mirrored-coredns-coredns:${coredns_tailnet_version}
          imagePullPolicy: IfNotPresent
          args: ["-conf", "/etc/coredns/Corefile"]
          ports:
            - { name: dns-udp, containerPort: 53, protocol: UDP }
            - { name: dns-tcp, containerPort: 53, protocol: TCP }
            - { name: metrics, containerPort: 9153, protocol: TCP }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet: { path: /ready, port: 8181 }
            periodSeconds: 5
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - name: config
              mountPath: /etc/coredns
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: tailnet-dns-corefile
            items:
              - key: Corefile
                path: Corefile
