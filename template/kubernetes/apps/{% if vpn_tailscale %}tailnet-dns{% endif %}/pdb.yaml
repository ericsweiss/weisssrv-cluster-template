---
# Both replicas can land on one node, since the spread constraint is
# ScheduleAnyway. This keeps a node drain from evicting both and taking tailnet
# DNS offline.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tailnet-dns
  namespace: tailnet-dns
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: tailnet-dns
