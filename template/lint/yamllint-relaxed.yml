---
# The weisssrv family's yamllint profile: yamllint's `relaxed` with line-length
# off, document-start back on as a warning, and the comments and octal-values
# settings ansible-lint requires of a yamllint config it loads.

# Keep it off a repo-root `.yamllint`: ansible-lint discovers one there and
# merges it over its own yaml[*] rules. Every caller passes `-c <path>`.
extends: relaxed

rules:
  line-length: disable
  document-start:
    present: true
    level: warning
  # ansible-lint rejects a config it discovers without these and turns fix mode
  # off. Warning level, so re-vendoring cannot red a consumer's yaml-lint job.
  comments:
    min-spaces-from-content: 1
    level: warning
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
    level: warning
  # One blank line between blocks (warning, as in `relaxed`).
  empty-lines:
    max: 1

# Provider checkouts are not the repo's YAML, and a local tree has them
# wherever `terraform init` ran.
ignore: |
  .terraform/
  terraform/**/.terraform/
