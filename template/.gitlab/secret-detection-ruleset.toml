# GitLab Secret Detection custom ruleset.
#
# GitLab's Secret-Detection job runs gitleaks under the hood. The
# `SECRET_DETECTION_RULESET_PATH` variable is NOT a documented GitLab variable
# and is silently ignored, so a bare gitleaks.toml has no effect.
#
# Per GitLab docs (Custom rulesets schema), the supported mechanism is a
# `[[secrets.passthrough]]` entry in `.gitlab/secret-detection-ruleset.toml`
# (this file, at that exact path in the consumer repo) that points at the actual
# gitleaks config.
# https://docs.gitlab.com/ee/user/application_security/secret_detection/pipeline/#custom-rulesets-schema
[secrets]
  description = "Shared Secret Detection ruleset for weisssrv-family repos"
  [[secrets.passthrough]]
    type = "file"
    target = "gitleaks.toml"
    value = ".gitleaks.toml"
