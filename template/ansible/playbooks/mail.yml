---
# The SMTP relay on its own, so a mail-only change ships without re-running
# every other host's base configuration. site.yml deploys the same roles as
# part of a full base run.

- name: Provision SMTP relay container
  hosts: mail
  gather_facts: false
  roles:
    - weisssrv.infra.proxmox_lxc

- name: Deploy SMTP relay configuration
  hosts: mail
  become: true
  roles:
    - weisssrv.infra.base
    - weisssrv.infra.smtp_relay
    # Shared with site.yml; tests/test_shared_role_playbook_sync.py keeps the two
    # in step, so a standalone mail deploy still meters the relay.
    - weisssrv.infra.node_exporter_host
    - weisssrv.infra.alloy_host

- name: Deploy guest firewall rules
  hosts: mail
  roles:
    - weisssrv.infra.proxmox_firewall

# weisssrv.infra.base above rewrites the relay's authorized_keys, which drops
# the pinned cert-distribution key. Re-seed it once its host_key is pinned;
# until then postflight.yml reports the relay as an unpinned target.
- name: Re-seed the cert-distribution key on the relay
  hosts: dns_primary
  become: true
  gather_facts: false
  ignore_unreachable: true
  tasks:
    - name: Re-seed the relay
      ansible.builtin.include_role:
        name: weisssrv.infra.acme_certs
        tasks_from: reseed
      vars:
        acme_certs_reseed_hosts: >-
          {{ acme_certs_distribution_targets | default([]) | map(attribute='host')
             | select('in', groups['mail'] | default([])) | list }}
