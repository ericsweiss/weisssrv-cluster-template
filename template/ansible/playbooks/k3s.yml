---
# Full k3s cluster deployment: base configuration, then servers, then agents.
# The VMs must already exist (k3s-provision-vms.yml).

- name: Deploy base configuration to k3s nodes
  hosts: k3s
  become: true
  roles:
    - weisssrv.infra.base
    - weisssrv.infra.qol
    - weisssrv.infra.postfix_null_client
    # Shared with site.yml; tests/test_shared_role_playbook_sync.py keeps the two
    # in step.
    - weisssrv.infra.alloy_host

# MUST precede the server/agent plays: the k3s role asserts tlshd is active
# before it mounts the off-node etcd-snapshot export, and the agents mount the
# NAS-backed PVs. Both are pure TLS clients — no cert of their own.
- name: Deploy the NFS-over-TLS handshake daemon
  hosts: k3s
  become: true
  roles:
    - weisssrv.infra.nfs_tls

- name: Deploy k3s servers
  hosts: k3s_servers
  become: true
  serial: 1  # one etcd member at a time
  roles:
    - weisssrv.infra.k3s
    # The servers' etcd snapshot copy writes its freshness metric to the
    # node_exporter textfile directory. site.yml skips the servers on a first
    # run, so EtcdSnapshotStale needs this role here to be scrapable.
    - weisssrv.infra.node_exporter_host

- name: Deploy k3s agents
  hosts: k3s_agents
  become: true
  # One at a time: a config change restarts the kubelet, and the ingress
  # controller plus the MetalLB speaker run on the agents — a cluster-wide
  # simultaneous bounce would blip the VIPs.
  serial: 1
  roles:
    - weisssrv.infra.k3s

# The tenant-local provisioner refuses a root without this marker, so a claim
# fails rather than landing on the boot disk when the zvol is not mounted.
- name: Mark the mounted tenant-volumes zvol
  hosts: k3s_agents
  become: true
  gather_facts: false
  vars:
    tenant_volumes_disks: >-
      {{ vm_additional_disks | default([])
         | selectattr('mount_point', 'equalto', '/mnt/tenant-volumes') | list }}
  tasks:
    - name: Probe the tenant-volumes mount
      ansible.builtin.command: mountpoint -q /mnt/tenant-volumes
      register: tenant_volumes_mount
      changed_when: false
      failed_when: false
      check_mode: false
      when: tenant_volumes_disks | length > 0

    # --check on a fresh VM runs before the k3s role has mounted anything.
    - name: Assert the tenant-volumes zvol is mounted
      ansible.builtin.assert:
        that:
          - tenant_volumes_mount.rc == 0 or ansible_check_mode
        fail_msg: >-
          /mnt/tenant-volumes is not a mount point; the k3s role mounts the
          tenant-volumes zvol there. Refusing to mark the VM's own filesystem.
        quiet: true
      when: tenant_volumes_disks | length > 0

    - name: Write the tenant-volumes marker
      ansible.builtin.copy:
        dest: /mnt/tenant-volumes/.tenant-volumes-zvol
        content: "{{ tenant_volumes_disks[0].zvol }}\n"
        owner: root
        group: root
        mode: "0644"
      when:
        - tenant_volumes_disks | length > 0
        - tenant_volumes_mount.rc == 0

- name: Deploy guest firewall rules
  hosts: k3s
  gather_facts: false
  roles:
    - weisssrv.infra.proxmox_firewall

- name: Verify cluster health
  hosts: k3s_servers[0]
  become: true
  # Read-only probes, so --check must still run them: a skipped command
  # registers no stdout and the asserts below would abort on it.
  check_mode: false
  tasks:
    - name: Get node status
      ansible.builtin.command: k3s kubectl get nodes -o wide
      register: node_status
      changed_when: false

    - name: Display cluster status
      ansible.builtin.debug:
        msg: "{{ node_status.stdout_lines }}"

    # STATUS is column 2; "Ready,SchedulingDisabled" (cordoned but healthy)
    # passes. Skip the header row.
    - name: Fail if any node is not Ready
      ansible.builtin.assert:
        that:
          - item.split()[1] is match('^Ready')
        fail_msg: "Node not Ready: {{ item }}"
        quiet: true
      loop: "{{ node_status.stdout_lines[1:] }}"
      loop_control:
        label: "{{ item.split()[0] }}"

    - name: Get pod status across all namespaces
      ansible.builtin.command: k3s kubectl get pods -A
      register: pod_status
      changed_when: false

    - name: Display pod status
      ansible.builtin.debug:
        msg: "{{ pod_status.stdout_lines }}"

    - name: Display next steps
      ansible.builtin.debug:
        msg: |
          k3s cluster deployment complete.

          Next: fetch the kubeconfig, then bootstrap Flux — every platform
          controller and application reconciles from kubernetes/ in this repo.
