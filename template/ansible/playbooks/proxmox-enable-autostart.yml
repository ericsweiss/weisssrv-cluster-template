---
# Reconcile onboot + boot order on guests that already exist; the provisioning
# roles do it for guests they create - docs/RUNBOOKS.md, Guest autostart and
# boot order.

# Precedence mirrors proxmox_lxc: the neutral proxmox_autostart_* names win, then
# the per-container proxmox_lxc_* ones, then the role defaults.
- name: Reconcile autostart and boot order for LXC containers
  hosts: lxc_containers
  gather_facts: false
  vars:
    lxc_onboot: "{{ proxmox_autostart_enabled | default(proxmox_lxc_onboot | default(true)) }}"
    lxc_startup_order: "{{ proxmox_startup_order | default(proxmox_lxc_startup_order | default(100)) }}"
    lxc_startup_delay: "{{ proxmox_startup_delay | default(proxmox_lxc_startup_delay | default(0)) }}"
    desired_onboot: "onboot: {{ lxc_onboot | ternary(1, 0) }}"
    desired_startup: "startup: order={{ lxc_startup_order }},up={{ lxc_startup_delay }}"
  tasks:
    # pvesh answers cluster-wide, so this returns the guest's node after a
    # migration or an HA failover; the inventory's proxmox_host only orders the
    # probe. The role task fails terminally when no host answers.
    - name: Query the cluster for this container's current node
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_vm
        tasks_from: probe-cluster-resources
      vars:
        _proxmox_vm_probe_hosts: >-
          {{ [proxmox_host] + (groups['proxmox'] | difference([proxmox_host])) }}

    # A guest absent from the answer leaves the fact unset for the fail below.
    - name: Set the container's Proxmox host
      vars:
        pve_container_entry: >-
          {{ (_proxmox_vm_cluster_json | from_json)
             | selectattr('vmid', 'equalto', vmid | int) | list }}
      ansible.builtin.set_fact:
        container_pve_host: "{{ pve_container_entry | map(attribute='node') | first }}"
      when: pve_container_entry | length > 0

    # Every task below needs the node, so an unresolved one fails the play.
    - name: Fail when the container's Proxmox node could not be determined
      ansible.builtin.fail:
        msg: >-
          {{ inventory_hostname }} ({{ vmid }}) is in no Proxmox cluster
          resource list - autostart NOT reconciled.
          Probes: {{ _proxmox_vm_probe_results | default([]) | join('; ') }}
      when: container_pve_host is not defined

    - name: Read the current container config
      delegate_to: "{{ container_pve_host }}"
      ansible.builtin.command: "pct config {{ vmid }}"
      register: current_config
      changed_when: false
      check_mode: false

    - name: Apply autostart and boot order
      delegate_to: "{{ container_pve_host }}"
      ansible.builtin.command: >-
        pct set {{ vmid }}
        --onboot {{ lxc_onboot | ternary(1, 0) }}
        --startup order={{ lxc_startup_order }},up={{ lxc_startup_delay }}
      changed_when: true
      when:
        - desired_onboot not in current_config.stdout_lines
          or desired_startup not in current_config.stdout_lines

    - name: Report the container's state
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} ({{ vmid }}) on {{ container_pve_host }}:
          onboot={{ lxc_onboot | ternary(1, 0) }},
          order={{ lxc_startup_order }}, delay={{ lxc_startup_delay }}s

# `services` guests run no Ansible, so every task here is delegated. An LXC
# outside lxc_containers, such as a services appliance, is reconciled with pct.
- name: Reconcile autostart and boot order for VMs and app guests
  hosts: k3s:app_servers:services:!lxc_containers
  gather_facts: false
  vars:
    desired_onboot: "onboot: {{ proxmox_autostart_enabled | default(true) | ternary(1, 0) }}"
    desired_startup: "startup: order={{ proxmox_startup_order | default(100) }},up={{ proxmox_startup_delay | default(0) }}"
  tasks:
    # proxmox_host seeds the probe order, so a guest without one fails here.
    - name: Assert the VM declares a Proxmox host
      ansible.builtin.assert:
        that:
          - proxmox_host is defined
          - proxmox_host | default('') | trim | length > 0
        fail_msg: >-
          {{ inventory_hostname }} ({{ vmid }}) has no proxmox_host in the
          inventory - autostart NOT reconciled. It also seeds the probe order
          below.

    # Same shape as the LXC play above: the cluster-wide API, so a migrated or
    # failed-over guest is still found on its real node.
    - name: Query the cluster for this VM's current node
      ansible.builtin.include_role:
        name: weisssrv.infra.proxmox_vm
        tasks_from: probe-cluster-resources
      vars:
        _proxmox_vm_probe_hosts: >-
          {{ [proxmox_host] + (groups['proxmox'] | difference([proxmox_host])) }}

    # Same guard as the LXC play above.
    - name: Set the VM's Proxmox host
      vars:
        pve_vm_entry: >-
          {{ (_proxmox_vm_cluster_json | from_json)
             | selectattr('vmid', 'equalto', vmid | int) | list }}
      ansible.builtin.set_fact:
        vm_pve_host: "{{ pve_vm_entry | map(attribute='node') | first }}"
        vm_guest_cli: "{{ 'pct' if (pve_vm_entry | first).type == 'lxc' else 'qm' }}"
      when: pve_vm_entry | length > 0

    - name: Fail when the VM's Proxmox node could not be determined
      ansible.builtin.fail:
        msg: >-
          {{ inventory_hostname }} ({{ vmid }}) is in no Proxmox cluster
          resource list - autostart NOT reconciled.
          Probes: {{ _proxmox_vm_probe_results | default([]) | join('; ') }}
      when: vm_pve_host is not defined

    - name: Read the current VM config
      delegate_to: "{{ vm_pve_host }}"
      ansible.builtin.command: "{{ vm_guest_cli }} config {{ vmid }}"
      register: current_config
      changed_when: false
      check_mode: false

    - name: Apply autostart and boot order
      delegate_to: "{{ vm_pve_host }}"
      ansible.builtin.command: >-
        {{ vm_guest_cli }} set {{ vmid }}
        --onboot {{ proxmox_autostart_enabled | default(true) | ternary(1, 0) }}
        --startup order={{ proxmox_startup_order | default(100) }},up={{ proxmox_startup_delay | default(0) }}
      changed_when: true
      when:
        - desired_onboot not in current_config.stdout_lines
          or desired_startup not in current_config.stdout_lines

    - name: Report the VM's state
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} ({{ vmid }}) on {{ vm_pve_host }}:
          onboot={{ proxmox_autostart_enabled | default(true) | ternary(1, 0) }},
          order={{ proxmox_startup_order | default(100) }},
          delay={{ proxmox_startup_delay | default(0) }}s
