---
# Base configuration only (SSH hardening, packages, timezone, fail2ban, NIC
# tuning). Use it for a first contact with a new host; site.yml supersedes it.

# See _reachability-probe.yml: the probe/gate pair is what stops a host this
# playbook configured NOTHING on from exiting 0.
- name: Probe reachability before deploying
  ansible.builtin.import_playbook: _reachability-probe.yml

- name: Deploy base configuration
  # !deploy_skipped drops probe misses; ignore_unreachable covers a host that
  # dies between probe and play. See _reachability-probe.yml.
  hosts: base_managed:!deploy_skipped
  become: true
  ignore_unreachable: true
  roles:
    - role: weisssrv.infra.base
      tags: [base]
    - role: weisssrv.infra.nic_tuning
      tags: [nic_tuning, network]

# weisssrv.infra.base above rewrites each guest's authorized_keys, which drops
# the pinned cert-distribution key. Re-seed every sudo target the probe reached;
# the gate below reports a skipped one, and any other miss fails here.
- name: Re-seed the cert-distribution key on every cert target
  hosts: dns_primary:!deploy_skipped
  become: true
  gather_facts: false
  ignore_unreachable: true
  tasks:
    - name: Re-seed the cert-distribution targets
      ansible.builtin.include_role:
        name: weisssrv.infra.acme_certs
        tasks_from: reseed
      vars:
        acme_certs_reseed_hosts: >-
          {{ acme_certs_distribution_targets | default([])
             | map(attribute='host')
             | reject('in', acme_certs_distribution_targets | default([])
                 | selectattr('ssh_no_sudo', 'defined')
                 | selectattr('ssh_no_sudo') | map(attribute='host') | list)
             | difference(groups['deploy_skipped'] | default([])) }}

- name: Gate on the reachability ledger
  ansible.builtin.import_playbook: _reachability-gate.yml
