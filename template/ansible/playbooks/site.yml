---
# Base infrastructure: Proxmox hosts, DNS, mail, NAS storage, firewall and
# host-level observability. k3s has its own lifecycle (k3s.yml), as does every
# application you add.

# FIRST, and purely delegated: these containers may not exist yet, and the
# base_managed play below connects to them directly, which would mark them
# unreachable and skip the whole DNS stack on a fresh cluster.
- name: Provision DNS containers
  hosts: dns
  gather_facts: false
  roles:
    - role: weisssrv.infra.proxmox_lxc
      tags: [proxmox_lxc]

- name: Provision SMTP relay container
  hosts: mail
  gather_facts: false
  roles:
    - role: weisssrv.infra.proxmox_lxc
      tags: [proxmox_lxc]

# Runs after the provisioning plays above (which must own the first connection
# attempt to a fresh container) and before anything is deployed. Its companion
# gate is imported at the very bottom of this file.
- name: Probe reachability before deploying
  ansible.builtin.import_playbook: _reachability-probe.yml

- name: Deploy base configuration to all managed hosts
  # Reachability contract for the multi-host plays: `!deploy_skipped` drops what
  # the probe could not reach and `ignore_unreachable` covers a host that dies
  # afterwards. Single-host plays carry neither.
  hosts: base_managed:!deploy_skipped
  become: true
  ignore_unreachable: true
  roles:
    - role: weisssrv.infra.base
      tags: [base]
    - role: weisssrv.infra.nic_tuning
      tags: [nic_tuning, network]

- name: Deploy Proxmox host configuration
  hosts: proxmox:!deploy_skipped
  become: true
  # See the reachability note on the base_managed play above.
  ignore_unreachable: true
  roles:
    - role: weisssrv.infra.qol
      tags: [qol]
    - role: weisssrv.infra.postfix_null_client
      tags: [postfix_null_client]
    # Config only — activation waits for the host's next reboot.
    - role: weisssrv.infra.encrypted_swap
      tags: [encrypted_swap]
    # The NAS owns its own ARC cap through nas_storage; capping it twice would
    # let the two sources drift.
    - role: weisssrv.infra.zfs_arc_cap
      tags: [zfs_arc_cap]
      when: proxmox_role != 'nas'
    # Stages the IOMMU cmdline + vfio-pci bind and reports reboot-required; it
    # never reboots. Composed unconditionally so a host turned off is reconciled
    # off; apply either direction in a maintenance window.
    - role: weisssrv.infra.vfio_passthrough
      tags: [vfio_passthrough]
    - role: weisssrv.infra.tailscale
      tags: [tailscale]
      when: tailscale_enabled | default(false) | bool
    # Client mode only. The server (the NAS) is excluded here because its setup
    # needs the wildcard cert, which the acme_certs play below distributes —
    # that ordering is what makes a fresh bootstrap work.
    - role: weisssrv.infra.nfs_tls
      tags: [nfs_tls]
      when: not (nfs_tls_is_server | default(false))
    - role: weisssrv.infra.proxmox_firewall
      tags: [proxmox_firewall]

- name: Deploy DNS server configuration
  hosts: dns:!deploy_skipped
  become: true
  serial: 1  # never restart unbound/AdGuard on both resolvers at once
  # It matters more here than on the base_managed play: with serial: 1 an
  # unreachable resolver is a batch of one, and a failed batch ends the play, so
  # the OTHER resolver would never be reconciled.
  ignore_unreachable: true
  roles:
    - role: weisssrv.infra.postfix_null_client
      tags: [postfix_null_client]
    - role: weisssrv.infra.unbound
      tags: [unbound]
    - role: weisssrv.infra.unbound_exporter
      tags: [unbound_exporter]
    - role: weisssrv.infra.adguard_home
      tags: [adguard_home]

- name: Deploy certificate management and config replication
  hosts: dns:!deploy_skipped
  become: true
  serial: 1  # a cert reload restarts AdGuard — keep the other resolver up
  # Same serial-batch reasoning as the DNS play above.
  ignore_unreachable: true
  roles:
    - role: weisssrv.infra.acme_certs
      tags: [acme_certs]
    - role: weisssrv.infra.adguard_sync
      tags: [adguard_sync]

# After the cert plays: nfs_tls fails loud if the wildcard cert/key are not on
# the server yet, so an earlier position would break a fresh bootstrap.
- name: Deploy NAS storage configuration
  hosts: nas
  become: true
  roles:
    # Before nas_storage, so the handshake daemon is verified before any
    # require-TLS export is (re)published.
    - role: weisssrv.infra.nfs_tls
      tags: [nfs_tls]
    - role: weisssrv.infra.nas_storage
      tags: [nas_storage]
    - role: weisssrv.infra.restic_offsite
      tags: [restic_offsite]
    # storage.cfg and vzdump jobs are cluster-wide, so they are written from
    # this one node.
    - role: weisssrv.infra.proxmox_backup
      tags: [proxmox_backup]
    - role: weisssrv.infra.zfs_exporter
      tags: [zfs_exporter]

- name: Deploy DNS guest firewall rules
  hosts: dns:!deploy_skipped
  # See the reachability note on the base_managed play above.
  ignore_unreachable: true
  roles:
    - role: weisssrv.infra.proxmox_firewall
      tags: [proxmox_firewall]

- name: Deploy SMTP relay configuration
  hosts: mail
  become: true
  roles:
    - role: weisssrv.infra.smtp_relay
      tags: [smtp_relay]

- name: Deploy SMTP guest firewall rules
  hosts: mail
  roles:
    - role: weisssrv.infra.proxmox_firewall
      tags: [proxmox_firewall]

- name: Deploy host-level metrics
  hosts: proxmox:dns:mail:app_servers:k3s_servers:!deploy_skipped
  become: true
  # An application VM provisioned by its own playbook does not exist on a first
  # run; skipping it here keeps that from failing the whole base deploy. A
  # genuinely down host surfaces through alerting, not through this play.
  ignore_unreachable: true
  roles:
    - role: weisssrv.infra.node_exporter_host
      tags: [node_exporter_host]
  post_tasks:
    # app_servers and k3s_servers sit outside the base_managed ledger, so a skip
    # here reaches neither probe nor gate. A play with no active host runs no
    # task, so probe first and read the registered result.
    - name: Probe the connection the metrics play needed
      ansible.builtin.ping:
      register: metrics_probe
      tags: [always]
    - name: Report hosts the metrics play could not reach
      vars:
        missed: >-
          {{ ansible_play_hosts_all | map('extract', hostvars)
             | selectattr('metrics_probe.unreachable', 'defined')
             | map(attribute='inventory_hostname') | list }}
      ansible.builtin.debug:
        msg: "Host metrics NOT converged on: {{ missed | join(', ') }}"
      when: missed | length > 0
      run_once: true
      delegate_to: localhost
      become: false
      tags: [always]

- name: Deploy host-side log collection (Alloy -> Loki)
  hosts: base_managed:app_servers:k3s:!deploy_skipped
  become: true
  ignore_unreachable: true
  roles:
    - role: weisssrv.infra.alloy_host
      tags: [alloy_host]
  post_tasks:
    # app_servers and the k3s guests sit outside the base_managed ledger, so this
    # play reports for itself. ignore_unreachable keeps the host in the play, so
    # the probe's registered result is what names a host that never converged.
    - name: Probe the connection the log-shipping play needed
      ansible.builtin.ping:
      register: logging_probe
      tags: [always]
    - name: Report hosts the log-shipping play could not reach
      vars:
        missed: >-
          {{ ansible_play_hosts_all | map('extract', hostvars)
             | selectattr('logging_probe.unreachable', 'defined')
             | map(attribute='inventory_hostname') | list }}
      ansible.builtin.debug:
        msg: "Journald shipping NOT converged on: {{ missed | join(', ') }}"
      when: missed | length > 0
      run_once: true
      delegate_to: localhost
      become: false
      tags: [always]

# Guests that cannot run Ansible: the .fw write is delegated to their Proxmox
# host, so an inventory-only security-group change still deploys.
- name: Deploy guest firewall rules for delegation-only guests
  hosts: services
  gather_facts: false
  roles:
    - role: weisssrv.infra.proxmox_firewall
      tags: [proxmox_firewall]

# Including the k3s guests here ships an inventory-only security-group edit with
# a base deploy. The role self-gates on vmid + guest_security_groups and
# cluster.fw is run_once-guarded, so this writes guest files only.
- name: Deploy k3s guest firewall rules
  hosts: k3s
  gather_facts: false
  roles:
    - role: weisssrv.infra.proxmox_firewall
      tags: [proxmox_firewall]

# Last, once every play has had its chance to converge: fail the run if any
# base_managed host was skipped as unreachable or has stopped answering. It
# carries the probe's host pattern, so the scoped CI deploy jobs are gated too.
- name: Gate on the reachability ledger
  ansible.builtin.import_playbook: _reachability-gate.yml
