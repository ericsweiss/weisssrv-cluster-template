---
# The DNS stack on its own, one resolver at a time.

- name: Provision DNS containers
  hosts: dns
  gather_facts: false
  serial: 1
  roles:
    - weisssrv.infra.proxmox_lxc

- name: Deploy DNS server configuration
  hosts: dns
  become: true
  serial: 1
  roles:
    - weisssrv.infra.base
    - weisssrv.infra.postfix_null_client
    - weisssrv.infra.unbound
    - weisssrv.infra.unbound_exporter
    - weisssrv.infra.adguard_home
    # Shared with site.yml; tests/test_shared_role_playbook_sync.py keeps the two
    # in step, so a standalone DNS deploy leaves no resolver unmetered.
    - weisssrv.infra.node_exporter_host
    - weisssrv.infra.alloy_host

- name: Deploy certificate management and config replication
  hosts: dns
  become: true
  serial: 1
  roles:
    - weisssrv.infra.acme_certs
    - weisssrv.infra.adguard_sync

- name: Deploy guest firewall rules
  hosts: dns
  roles:
    - weisssrv.infra.proxmox_firewall
