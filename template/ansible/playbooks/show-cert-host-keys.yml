---
# Capture the SSH host key of every certificate-distribution target and print it
# in a paste-ready form for acme_certs_distribution_targets.
#
# The cert push uses StrictHostKeyChecking=yes against a pinned key, so a
# rebuilt target fails the push loudly until you re-capture it here.

- name: Show SSH host keys for certificate distribution targets
  hosts: dns_primary
  gather_facts: false
  become: false
  tasks:
    - name: Capture each target's ed25519 host key
      ansible.builtin.command:
        cmd: "ssh-keyscan -t ed25519 -T 5 -p {{ item.ssh_port | default(22) }} {{ item.ip }}"
      loop: "{{ acme_certs_distribution_targets }}"
      loop_control:
        label: "{{ item.host }} ({{ item.ip }}:{{ item.ssh_port | default(22) }})"
      register: ssh_keyscans
      changed_when: false
      # Render NOT_AVAILABLE for an unreachable target instead of aborting, so
      # the operator sees which one did not answer.
      failed_when: false

    - name: Render paste-ready host_key values
      ansible.builtin.debug:
        msg: |
          Paste each host_key into the matching acme_certs_distribution_targets
          entry in group_vars/dns.yml, replacing the empty placeholder.

          {% for r in ssh_keyscans.results %}
          {% set key_line = (r.stdout_lines | default([])) | reject('match', '^#') | first | default('') %}
          {% set key_value = key_line.split(' ', 1)[1] | default('NOT_AVAILABLE') if key_line else 'NOT_AVAILABLE' %}
          - host: {{ r.item.host }}
            host_key: "{{ key_value }}"
          {% endfor %}
