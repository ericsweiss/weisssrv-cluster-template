---
# Rolling OS package updates, one host at a time.

- name: Update OS packages on base infrastructure (rolling)
  hosts: base_managed
  become: true
  serial: 1
  tasks:
    - name: Upgrade packages and reboot if needed
      ansible.builtin.include_tasks: _apt-upgrade-and-reboot.yml
      vars:
        apt_upgrade_phase_label: "=== Updating {{ inventory_hostname }} ==="

- name: Update OS packages on k3s nodes (kernel reboots delegated to kured)
  hosts: k3s
  become: true
  serial: 1
  tasks:
    # Verify up front that kured is rolled out: absent, the sentinel flagged
    # below promises a reboot that never happens. Pinned to the play's first
    # host because run_once with serial:1 runs once per node.
    - name: Verify the kured DaemonSet is healthy before delegating reboots to it
      ansible.builtin.command: >-
        k3s kubectl -n kube-system rollout status ds/kured --timeout=120s
      register: kured_rollout
      changed_when: false
      retries: 6
      delay: 20
      until: kured_rollout.rc == 0
      run_once: true
      when: inventory_hostname == ansible_play_hosts_all[0]
      delegate_to: "{{ k3s_delegate_server }}"

    - name: Upgrade packages
      ansible.builtin.include_tasks: _apt-upgrade.yml
      vars:
        apt_upgrade_phase_label: "=== Updating k3s node {{ inventory_hostname }} ==="

    - name: Detect whether a reboot is needed (kured performs it, not us)
      ansible.builtin.include_tasks: _reboot-if-needed.yml
      vars:
        skip_reboot: true

    # CRITICAL: never cordon, drain or reboot a k3s node from here. Run from CI
    # it would drain the node hosting this job's own executor pod and deadlock.
    # Flag the sentinel instead; kured reboots flagged nodes one at a time,
    # outliving this run.
    - name: Flag the node for a kured reboot
      ansible.builtin.file:
        path: /var/run/reboot-required
        state: touch
        mode: "0644"
      when: reboot_required | bool

    - name: Report the node as flagged
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} flagged for reboot; kured will cordon, drain, reboot and uncordon it."
      when: reboot_required | bool

- name: Update OS packages on application hosts (rolling)
  hosts: app_servers
  become: true
  serial: 1
  tasks:
    - name: Upgrade packages and reboot if needed
      ansible.builtin.include_tasks: _apt-upgrade-and-reboot.yml
      vars:
        apt_upgrade_phase_label: "=== Updating application host {{ inventory_hostname }} ==="
