---
# OS packages on the base infrastructure, then every application update. The
# reboot protections live in _reboot-if-needed.yml, not in inventory order.

- name: Full update - OS packages (rolling)
  hosts: base_managed
  become: true
  serial: 1
  tasks:
    - name: Upgrade packages and reboot if needed
      ansible.builtin.include_tasks: _apt-upgrade-and-reboot.yml
      vars:
        apt_upgrade_phase_label: "=== Updating {{ inventory_hostname }} - OS packages ==="

- name: Full update - applications
  ansible.builtin.import_playbook: update-applications.yml

- name: Full update - summary
  hosts: localhost
  gather_facts: false
  connection: local
  vars:
    ansible_become: false
  tasks:
    - name: Display the completion message
      ansible.builtin.debug:
        msg: >-
          Full update complete for the base infrastructure and applications.
          k3s nodes and application hosts are patched by update-packages.yml;
          k3s itself by update-k3s-nodes.yml. Verify before walking away.
