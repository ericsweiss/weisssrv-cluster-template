---
# Upgrade the platform services installed as binaries or packages rather than
# reconciled by Flux, to the versions pinned in group_vars/all.yml. Add a play
# here for any application host you introduce.

- name: Update AdGuard Home
  hosts: dns
  become: true
  serial: 1  # keep one resolver serving throughout
  # With serial: 1 a failure on the first resolver must stop the run before the
  # second batch takes the surviving resolver down too.
  any_errors_fatal: true
  tasks:
    - name: Check for an installed AdGuard Home configuration
      ansible.builtin.stat:
        path: "{{ adguard_home_install_path }}/AdGuardHome.yaml"
      register: adguard_home_config_stat

    # CRITICAL: a skip here is invisible. The binary swap below then runs with
    # no pre-upgrade copy to roll back to, and the loss is only discovered once
    # the upgraded resolver fails to start.
    - name: Fail when no AdGuard Home configuration is there to back up
      ansible.builtin.fail:
        msg: >-
          {{ adguard_home_install_path }}/AdGuardHome.yaml does not exist, so
          the upgrade would run without a rollback copy. Point
          adguard_home_install_path (group_vars/dns.yml) at this host's
          AdGuard Home install directory.
      when: not adguard_home_config_stat.stat.exists

    # One fixed pre-upgrade copy, overwritten each run: the sync replicates the
    # config continuously, so a growing backup-<epoch> set only clutters the
    # install directory.
    - name: Back up the AdGuard Home configuration before the upgrade
      ansible.builtin.copy:
        src: "{{ adguard_home_install_path }}/AdGuardHome.yaml"
        dest: "{{ adguard_home_install_path }}/AdGuardHome.yaml.pre-upgrade"
        remote_src: true
        owner: "{{ adguard_home_user | default('adguard') }}"
        group: "{{ adguard_home_group | default(adguard_home_user | default('adguard')) }}"
        mode: "0600"

    # DNS chicken-and-egg: each resolver resolves through itself, so the binary
    # swap would leave it with no resolution. Borrow the peer for the window
    # (serial: 1); a single-resolver cluster has no peer and skips the swap.
    - name: Upgrade AdGuard Home behind the peer resolver
      vars:
        dns_peer: "{{ (groups['dns'] | difference([inventory_hostname]) | first) | default('') }}"
      block:
        - name: Clear the immutable flag on resolv.conf for the upgrade window
          ansible.builtin.command:
            cmd: chattr -i /etc/resolv.conf
          changed_when: false
          # The file may not be immutable, or the FS may not support attrs.
          failed_when: false

        - name: Back up resolv.conf for the upgrade window
          ansible.builtin.copy:
            src: /etc/resolv.conf
            dest: /etc/resolv.conf.pre-upgrade
            remote_src: true
            mode: "0644"

        - name: Point resolv.conf at the peer resolver for the upgrade window
          ansible.builtin.copy:
            content: |
              # Temporary: {{ inventory_hostname }} is mid-upgrade
              nameserver {{ hostvars[dns_peer].ansible_host }}
            dest: /etc/resolv.conf
            mode: "0644"
          when: dns_peer | length > 0

        - name: Reconcile AdGuard Home to the pinned version
          ansible.builtin.include_role:
            name: weisssrv.infra.adguard_home

        - name: Record that the AdGuard Home reconcile completed
          ansible.builtin.set_fact:
            adguard_reconcile_ok: true
      always:
        # Best effort first, then re-lock, and only then fail: a fail: placed
        # earlier would skip the rest of this block. resolv.conf pointing at the
        # peer still resolves, but leaving it MUTABLE lets DHCP clobber it.
        - name: Start AdGuard Home again after the upgrade window
          ansible.builtin.service:
            name: AdGuardHome
            state: started
          failed_when: false

        - name: Read the AdGuard Home service state  # noqa: command-instead-of-module
          ansible.builtin.command: systemctl is-active AdGuardHome
          register: adguard_home_active
          changed_when: false
          failed_when: false
          check_mode: false

        # The +i below must never lock the temporary peer pointer, so put the
        # pre-upgrade file back whenever the resolver did not come up.
        - name: Restore resolv.conf when the resolver did not come back
          ansible.builtin.copy:
            src: /etc/resolv.conf.pre-upgrade
            dest: /etc/resolv.conf
            remote_src: true
            mode: "0644"
          register: resolv_conf_restore
          failed_when: false
          when: >-
            not (adguard_reconcile_ok | default(false))
            or (adguard_home_active.stdout | default('') | trim) != 'active'

        - name: Remove the resolv.conf upgrade-window backup
          ansible.builtin.file:
            path: /etc/resolv.conf.pre-upgrade
            state: absent
          failed_when: false
          when:
            - adguard_reconcile_ok | default(false)
            - (adguard_home_active.stdout | default('') | trim) == 'active'

        - name: Re-assert the immutable flag on resolv.conf
          ansible.builtin.command:
            cmd: chattr +i /etc/resolv.conf
          register: resolv_conf_relock
          changed_when: false
          failed_when: false

        - name: Fail when AdGuard Home is still down after the upgrade window
          ansible.builtin.fail:
            msg: >-
              AdGuard Home on {{ inventory_hostname }} is
              '{{ adguard_home_active.stdout | default('unknown') | trim }}' after the
              upgrade window - this resolver is NOT answering.
              {{ 'resolv.conf restored from the pre-upgrade copy'
                 if resolv_conf_restore.dest is defined
                 else 'resolv.conf still names the peer, chattr -i it before hand-fixing'
              }}, re-lock
              rc={{ resolv_conf_relock.rc | default('?') }}
              {{ '(NOT immutable - DHCP can clobber it)'
                 if (resolv_conf_relock.rc | default(1)) != 0 else '(immutable)' }};
              fix this host before the peer's own serial: 1 turn takes the other
              resolver down.
          when: (adguard_home_active.stdout | default('') | trim) != 'active'

- name: Update adguardhome-sync
  hosts: dns_primary
  become: true
  tasks:
    # The role self-gates on adguard_sync_enabled (hosts.yml), so it is a no-op
    # wherever the sync is not deployed - a single-resolver cluster included.
    - name: Reconcile adguardhome-sync to the pinned version
      ansible.builtin.include_role:
        name: weisssrv.infra.adguard_sync

- name: Update Tailscale on the subnet routers
  hosts: proxmox
  become: true
  serial: 1
  tasks:
    - name: Check the current version
      ansible.builtin.command: tailscale version
      register: current_tailscale_version
      changed_when: false
      failed_when: false
      when: tailscale_enabled | default(false) | bool

    - name: Determine whether an upgrade is needed
      ansible.builtin.set_fact:
        # Tailscale's apt packages carry no Debian revision suffix, so the first
        # line of `tailscale version` compares directly to the pin.
        needs_tailscale_upgrade: >-
          {{ current_tailscale_version.rc | default(1) != 0
             or (current_tailscale_version.stdout_lines[0] | default('')) != tailscale_version }}
      when: tailscale_enabled | default(false) | bool

    - name: Upgrade the Tailscale package
      ansible.builtin.apt:
        name: "tailscale={{ tailscale_version }}"
        state: present
        update_cache: true
        allow_downgrade: true
      when:
        - tailscale_enabled | default(false) | bool
        - needs_tailscale_upgrade | default(false)

    - name: Restart tailscaled  # noqa no-handler
      ansible.builtin.systemd:
        name: tailscaled
        state: restarted
        daemon_reload: true
      when:
        - tailscale_enabled | default(false) | bool
        - needs_tailscale_upgrade | default(false)

- name: Update Ansible collections
  hosts: localhost
  gather_facts: false
  connection: local
  vars:
    ansible_become: false
  tasks:
    - name: Reinstall the pinned collections
      ansible.builtin.command: ansible-galaxy collection install -r requirements.yml --force
      args:
        chdir: "{{ playbook_dir }}/../.."
      become: false
      register: collection_update
      changed_when: "'was installed successfully' in collection_update.stdout"

    - name: Display the result
      ansible.builtin.debug:
        msg: "{{ collection_update.stdout_lines }}"
