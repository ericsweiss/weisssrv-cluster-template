---
# Rolling k3s binary upgrade to the pinned k3s_version: servers first (one etcd
# member at a time), then agents.

- name: Pre-flight checks
  hosts: k3s
  gather_facts: true
  tasks:
    - name: Check the k3s service state
      ansible.builtin.systemd:
        name: "{{ 'k3s' if k3s_role == 'server' else 'k3s-agent' }}"
      check_mode: true

    - name: Display the current cluster state
      ansible.builtin.command: k3s kubectl get nodes -o wide
      changed_when: false
      delegate_to: "{{ groups['k3s_servers'][0] }}"
      run_once: true
      register: node_status

    - name: Show the current cluster state
      ansible.builtin.debug:
        msg: "{{ node_status.stdout_lines }}"
      run_once: true

- name: Update k3s server nodes
  hosts: k3s_servers
  become: true
  serial: 1
  tasks:
    - name: Display the node being updated
      ansible.builtin.debug:
        msg: "=== Updating k3s server {{ inventory_hostname }} ==="

    # Shares the role's staged-installer path: the tag-pinned install.sh is
    # downloaded to /root and checksum-verified before it runs as root — no
    # `curl | sh`.
    - name: Detect the k3s version and stage the install script
      ansible.builtin.include_role:
        name: weisssrv.infra.k3s
        tasks_from: install-script.yml

    - name: Skip if the version already matches
      ansible.builtin.meta: end_host
      when: k3s_installed_version is defined and k3s_installed_version == k3s_version

    - name: Upgrade k3s server with a guaranteed uncordon
      block:
        # Restarting this server briefly drops its etcd member; doing that while
        # kured reboots ANOTHER server loses quorum. Checked before the upgrade
        # and again immediately before the restart to shrink the window.
        - name: Serialize against kured before cordoning
          ansible.builtin.include_tasks: _wait-no-kured-server-reboot.yml
          vars:
            kured_clear_reason: "before upgrading {{ inventory_hostname }}"
            kured_clear_delegate: "{{ k3s_delegate_server }}"

        # Cordon, never drain: containerd keeps running pods alive across a
        # kubelet restart, and draining the node running this job's own executor
        # pod would deadlock the run.
        - name: Cordon the node
          ansible.builtin.command: k3s kubectl cordon {{ inventory_hostname }}
          changed_when: true
          delegate_to: "{{ k3s_delegate_server }}"

        - name: Upgrade the k3s server binary
          ansible.builtin.command: /root/k3s-install.sh server
          environment:
            INSTALL_K3S_VERSION: "{{ k3s_version }}"
            INSTALL_K3S_SKIP_START: "true"
          changed_when: true

        - name: Re-assert kured is idle right before the restart
          ansible.builtin.include_tasks: _wait-no-kured-server-reboot.yml
          vars:
            kured_clear_reason: "before restarting k3s on {{ inventory_hostname }}"
            kured_clear_delegate: "{{ k3s_delegate_server }}"

        - name: Restart k3s
          ansible.builtin.systemd:
            name: k3s
            state: restarted
            daemon_reload: true

        # /readyz, not `get nodes`: the latter can pass while etcd is still
        # rejoining, letting serial:1 advance to the next server too early.
        - name: Wait for the API to be ready
          ansible.builtin.command: k3s kubectl --request-timeout=5s get --raw=/readyz
          register: k3s_ready
          retries: 30
          delay: 10
          until: k3s_ready.rc == 0
          changed_when: false

        - name: Verify the new version
          ansible.builtin.command: k3s --version
          register: k3s_new_version
          changed_when: false

        - name: Display the upgrade result
          ansible.builtin.debug:
            msg: "Server {{ inventory_hostname }} upgraded to: {{ k3s_new_version.stdout }}"

      always:
        - name: Uncordon and wait for Ready
          ansible.builtin.include_tasks: _uncordon-and-wait-ready.yml

- name: Update k3s agent nodes
  hosts: k3s_agents
  become: true
  serial: 1
  tasks:
    - name: Display the node being updated
      ansible.builtin.debug:
        msg: "=== Updating k3s agent {{ inventory_hostname }} ==="

    - name: Detect the k3s version and stage the install script
      ansible.builtin.include_role:
        name: weisssrv.infra.k3s
        tasks_from: install-script.yml

    - name: Skip if the version already matches
      ansible.builtin.meta: end_host
      when: k3s_installed_version is defined and k3s_installed_version == k3s_version

    - name: Upgrade k3s agent with a guaranteed uncordon
      block:
        - name: Cordon the node
          ansible.builtin.command: k3s kubectl cordon {{ inventory_hostname }}
          changed_when: true
          delegate_to: "{{ k3s_delegate_server }}"

        # The "agent" argument is required: without it the installer sets up
        # server mode and creates k3s.service instead of k3s-agent.service.
        - name: Upgrade the k3s agent binary
          ansible.builtin.command: /root/k3s-install.sh agent
          environment:
            INSTALL_K3S_VERSION: "{{ k3s_version }}"
            INSTALL_K3S_SKIP_START: "true"
            K3S_URL: "https://{{ k3s_api_vip }}:{{ k3s_api_port | default(6443) }}"
            # The worker-only token, so an upgrade rewrites the agent env file
            # with it rather than the cluster token.
            K3S_TOKEN: "{{ k3s_agent_token }}"
          changed_when: true
          # no_log censors the whole result, so the failure is reported by the
          # assert below instead - it names the host, version and rc.
          no_log: true
          failed_when: false
          register: k3s_agent_install

        - name: Verify the staged k3s agent installer succeeded
          ansible.builtin.assert:
            that:
              - (k3s_agent_install.rc | default(1)) == 0
            fail_msg: >-
              /root/k3s-install.sh agent failed on {{ inventory_hostname }} for
              k3s {{ k3s_version }} (rc={{ k3s_agent_install.rc | default('?') }}).
              Re-run it by hand on the node to see the output; it is censored
              here because K3S_TOKEN is in the task environment.
          when: not (k3s_agent_install.skipped | default(false))

        # Guards against an earlier bad upgrade (or a future bug) having
        # installed server mode here.
        - name: Check whether the server unit exists on this agent
          ansible.builtin.stat:
            path: /etc/systemd/system/k3s.service
          register: k3s_server_service

        - name: Stop and disable the server unit if present
          ansible.builtin.systemd:
            name: k3s
            state: stopped
            enabled: false
            daemon_reload: true
          when: k3s_server_service.stat.exists

        - name: Restart the k3s agent
          ansible.builtin.systemd:
            name: k3s-agent
            state: restarted
            daemon_reload: true

        - name: Wait for the agent to register
          ansible.builtin.command: k3s kubectl get node {{ inventory_hostname }}
          register: k3s_agent_ready
          retries: 30
          delay: 10
          until: k3s_agent_ready.rc == 0
          changed_when: false
          delegate_to: "{{ k3s_delegate_server }}"

        - name: Wait for pods on the node to stabilize
          # Mirrors list_unhealthy_pods in scripts/maintenance-lib.sh so this gate
          # and post-maintenance-verify.sh agree. Inlined because the task
          # delegates to a k3s server, which has no copy of the repo.
          ansible.builtin.shell: |
            set -o pipefail
            k3s kubectl get pods --all-namespaces \
              --field-selector spec.nodeName={{ inventory_hostname }} \
              --no-headers 2>/dev/null \
            | awk -v runner_ns='{{ maintenance_ci_runner_namespaces | default([]) | join(" ") }}' \
                  -v runner_prefix='{{ maintenance_ci_executor_pod_prefix | default("runner-") }}' '
                BEGIN { n = split(runner_ns, ns, " "); for (i = 1; i <= n; i++) runner[ns[i]] = 1 }
                $4 == "Completed" || $4 == "Succeeded" || $4 == "Error" || $4 == "Failed" { next }
                # Runner JOB pods are pipeline state, not cluster health.
                ($1 in runner) && index($2, runner_prefix) == 1 { next }
                { split($3, a, "/"); if ($4 != "Running" || a[1] != a[2]) print }' \
            | wc -l
          args:
            executable: /bin/bash
          register: unhealthy_on_node
          retries: 30
          delay: 10
          until: unhealthy_on_node.stdout | int == 0
          changed_when: false
          delegate_to: "{{ k3s_delegate_server }}"

        - name: Verify the new version
          ansible.builtin.command: k3s --version
          register: k3s_new_version
          changed_when: false

        - name: Display the upgrade result
          ansible.builtin.debug:
            msg: "Agent {{ inventory_hostname }} upgraded to: {{ k3s_new_version.stdout }}"

      always:
        - name: Uncordon and wait for Ready
          ansible.builtin.include_tasks: _uncordon-and-wait-ready.yml

- name: Post-upgrade verification
  hosts: k3s_servers
  run_once: true
  tasks:
    - name: Display the final cluster state
      ansible.builtin.command: k3s kubectl get nodes -o wide
      changed_when: false
      register: final_nodes

    - name: Show the final node status
      ansible.builtin.debug:
        msg: "{{ final_nodes.stdout_lines }}"

    # No `|| true`: pipefail must still catch a kubectl failure, and awk on the
    # STATUS column reports an empty list when every node is Ready.
    - name: Check for NotReady nodes
      ansible.builtin.shell: |
        set -o pipefail
        k3s kubectl get nodes --no-headers | awk '$2 !~ /^Ready/ {print $1}'
      args:
        executable: /bin/bash
      changed_when: false
      register: not_ready_nodes

    - name: Assert every node is Ready after the upgrade
      ansible.builtin.assert:
        that:
          - not_ready_nodes.stdout == ""
        fail_msg: "nodes not ready: {{ not_ready_nodes.stdout }}"
        quiet: true

    - name: Check for unhealthy pods
      # Mirrors list_unhealthy_pods, like the stabilization wait above. The
      # retries give a just-upgraded node a settle window so the assert below
      # fails only on a pod that stays unhealthy.
      ansible.builtin.shell: |
        set -o pipefail
        k3s kubectl get pods --all-namespaces --no-headers 2>/dev/null \
        | awk -v runner_ns='{{ maintenance_ci_runner_namespaces | default([]) | join(" ") }}' \
              -v runner_prefix='{{ maintenance_ci_executor_pod_prefix | default("runner-") }}' '
            BEGIN { n = split(runner_ns, ns, " "); for (i = 1; i <= n; i++) runner[ns[i]] = 1 }
            $4 == "Completed" || $4 == "Succeeded" || $4 == "Error" || $4 == "Failed" { next }
            # Runner JOB pods are pipeline state, not cluster health.
            ($1 in runner) && index($2, runner_prefix) == 1 { next }
            { split($3, a, "/"); if ($4 != "Running" || a[1] != a[2]) print $1" "$2 }'
      args:
        executable: /bin/bash
      changed_when: false
      register: unhealthy_pods
      retries: 6
      delay: 10
      until: unhealthy_pods.stdout == ""

    - name: Assert no pod is left unhealthy after the upgrade
      ansible.builtin.assert:
        that:
          - unhealthy_pods.stdout == ""
        fail_msg: "unhealthy pods: {{ unhealthy_pods.stdout_lines }}"
        quiet: true
