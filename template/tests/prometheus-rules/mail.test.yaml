---
# promtool unit tests for platform.mail: the Postfix relay's queue collector.
rule_files:
  - rules.yaml
evaluation_interval: 5m
tests:
  # PostfixQueueBacklog: 12 queued for 30m fires; 5 is the boundary and does not.
  - interval: 5m
    input_series:
      - series: 'postfix_queue_depth{job="node-exporter-host", instance="192.0.2.23:9101"}'
        values: '12+0x12'
      - series: 'postfix_queue_depth{job="node-exporter-host", instance="192.0.2.24:9101"}'
        values: '5+0x12'
      - series: 'postfix_queue_collector_last_success_seconds{job="node-exporter-host", instance="192.0.2.23:9101"}'
        values: '-300+300x12'
    alert_rule_test:
      - eval_time: 25m
        alertname: PostfixQueueBacklog
        exp_alerts: []
      - eval_time: 35m
        alertname: PostfixQueueBacklog
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node-exporter-host
              instance: '192.0.2.23:9101'
      - eval_time: 35m
        alertname: PostfixQueueCollectorStale
        exp_alerts: []

  # PostfixDown after its 10m hold.
  - interval: 5m
    input_series:
      - series: 'postfix_up{job="node-exporter-host", instance="192.0.2.23:9101"}'
        values: '1 0+0x6'
    alert_rule_test:
      - eval_time: 10m
        alertname: PostfixDown
        exp_alerts: []
      - eval_time: 20m
        alertname: PostfixDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: node-exporter-host
              instance: '192.0.2.23:9101'

  # PostfixQueueCollectorStale: a frozen timestamp past 15m, then no collector.
  - interval: 5m
    input_series:
      - series: 'postfix_queue_collector_last_success_seconds{job="node-exporter-host", instance="192.0.2.23:9101"}'
        values: '0+0x12'
    alert_rule_test:
      - eval_time: 20m
        alertname: PostfixQueueCollectorStale
        exp_alerts: []
      - eval_time: 30m
        alertname: PostfixQueueCollectorStale
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node-exporter-host
              instance: '192.0.2.23:9101'

  - interval: 5m
    input_series: []
    alert_rule_test:
      - eval_time: 10m
        alertname: PostfixQueueCollectorStale
        exp_alerts:
          - exp_labels:
              severity: warning
