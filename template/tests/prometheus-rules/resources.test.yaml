---
# promtool unit tests for the container memory alerts and the non-CI quota
# overcommit pair. ContainerMemoryNearLimit reads RSS against the container's
# own limit; the quota pair excludes the gitlab-runner* namespaces.
rule_files:
  - rules.yaml
evaluation_interval: 1m
tests:
  # An ordinary container holding 95% of its limit in RSS fires; one with room
  # to spare stays silent.
  - interval: 1m
    input_series:
      - series: 'container_memory_rss{namespace="traefik", pod="traefik-0", container="traefik"}'
        values: '95+0x30'
      - series: 'kube_pod_container_resource_limits{resource="memory", namespace="traefik", pod="traefik-0", container="traefik"}'
        values: '100+0x30'
      - series: 'container_memory_rss{namespace="registry-cache", pod="registry-cache-0", container="registry"}'
        values: '40+0x30'
      - series: 'kube_pod_container_resource_limits{resource="memory", namespace="registry-cache", pod="registry-cache-0", container="registry"}'
        values: '100+0x30'
    alert_rule_test:
      # Inside the 15m hold.
      - eval_time: 10m
        alertname: ContainerMemoryNearLimit
        exp_alerts: []
      - eval_time: 20m
        alertname: ContainerMemoryNearLimit
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: traefik
              pod: traefik-0
              container: traefik

  # Page cache is not a warning: a working set at its ceiling over an RSS of
  # 20% of the limit is the log-shipping and Loki shape, and it stays silent.
  - interval: 1m
    input_series:
      - series: 'container_memory_working_set_bytes{namespace="observability", pod="loki-0", container="loki"}'
        values: '115+0x30'
      - series: 'container_memory_rss{namespace="observability", pod="loki-0", container="loki"}'
        values: '20+0x30'
      - series: 'kube_pod_container_resource_limits{resource="memory", namespace="observability", pod="loki-0", container="loki"}'
        values: '100+0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: ContainerMemoryNearLimit
        exp_alerts: []

  # authentik/postgresql is judged on its working set, which carries the shared
  # buffers RSS omits: 93% of the limit fires on an RSS of 8%.
  - interval: 1m
    input_series:
      - series: 'container_memory_working_set_bytes{namespace="authentik", pod="authentik-postgresql-0", container="postgresql"}'
        values: '93+0x30'
      - series: 'container_memory_rss{namespace="authentik", pod="authentik-postgresql-0", container="postgresql"}'
        values: '8+0x30'
      - series: 'kube_pod_container_resource_limits{resource="memory", namespace="authentik", pod="authentik-postgresql-0", container="postgresql"}'
        values: '100+0x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: ContainerMemoryNearLimit
        exp_alerts: []
      - eval_time: 20m
        alertname: ContainerMemoryNearLimit
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: authentik
              pod: authentik-postgresql-0
              container: postgresql

  # The same database comfortably inside its limit on both metrics: the
  # working-set arm is a band, not a licence to page on any value.
  - interval: 1m
    input_series:
      - series: 'container_memory_working_set_bytes{namespace="authentik", pod="authentik-postgresql-0", container="postgresql"}'
        values: '40+0x30'
      - series: 'container_memory_rss{namespace="authentik", pod="authentik-postgresql-0", container="postgresql"}'
        values: '8+0x30'
      - series: 'kube_pod_container_resource_limits{resource="memory", namespace="authentik", pod="authentik-postgresql-0", container="postgresql"}'
        values: '100+0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: ContainerMemoryNearLimit
        exp_alerts: []

  # ContainerOOMKilled: a restart whose last-terminated reason is OOMKilled
  # fires; a restart for any other reason does not.
  - interval: 1m
    input_series:
      - series: 'kube_pod_container_status_restarts_total{namespace="registry-cache", pod="registry-cache-0", container="registry"}'
        values: '0+0x30 1+0x30'
      - series: 'kube_pod_container_status_last_terminated_reason{reason="OOMKilled", namespace="registry-cache", pod="registry-cache-0", container="registry"}'
        values: '0+0x30 1+0x30'
      - series: 'kube_pod_container_status_restarts_total{namespace="traefik", pod="traefik-0", container="traefik"}'
        values: '0+0x30 1+0x30'
      - series: 'kube_pod_container_status_last_terminated_reason{reason="Error", namespace="traefik", pod="traefik-0", container="traefik"}'
        values: '0+0x30 1+0x30'
    alert_rule_test:
      - eval_time: 40m
        alertname: ContainerOOMKilled
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: registry-cache
              pod: registry-cache-0
              container: registry

  # The reason sticks for the life of the pod, so the restart counter is what
  # makes the alert edge-triggered: a kill older than 1h is history.
  - interval: 1m
    input_series:
      - series: 'kube_pod_container_status_restarts_total{namespace="registry-cache", pod="registry-cache-0", container="registry"}'
        values: '1+0x150'
      - series: 'kube_pod_container_status_last_terminated_reason{reason="OOMKilled", namespace="registry-cache", pod="registry-cache-0", container="registry"}'
        values: '1+0x150'
    alert_rule_test:
      - eval_time: 140m
        alertname: ContainerOOMKilled
        exp_alerts: []

  # Non-CI quotas at 10 of 6 allocatable CPUs (1.67x) fire; the gitlab-runner
  # quota, 100 CPUs on its own, is excluded and never counts.
  - interval: 1m
    input_series:
      - series: 'kube_resourcequota{job="kube-state-metrics", type="hard", resource="requests.cpu", namespace="apps", resourcequota="apps"}'
        values: '10+0x15'
      - series: 'kube_resourcequota{job="kube-state-metrics", type="hard", resource="requests.cpu", namespace="gitlab-runner", resourcequota="ci"}'
        values: '100+0x15'
      - series: 'kube_node_status_allocatable{job="kube-state-metrics", resource="cpu", node="node-1"}'
        values: '4+0x15'
      - series: 'kube_node_status_allocatable{job="kube-state-metrics", resource="cpu", node="node-2"}'
        values: '2+0x15'
    alert_rule_test:
      # Inside the 5m hold.
      - eval_time: 3m
        alertname: KubeCPUQuotaOvercommitNonCI
        exp_alerts: []
      - eval_time: 8m
        alertname: KubeCPUQuotaOvercommitNonCI
        exp_alerts:
          - exp_labels:
              severity: warning

  # Just inside the budget: 8.9 of 6 CPUs (1.48x) stays silent however large
  # the CI quota is.
  - interval: 1m
    input_series:
      - series: 'kube_resourcequota{job="kube-state-metrics", type="hard", resource="requests.cpu", namespace="apps", resourcequota="apps"}'
        values: '8.9+0x15'
      - series: 'kube_resourcequota{job="kube-state-metrics", type="hard", resource="requests.cpu", namespace="gitlab-runner-privileged", resourcequota="ci"}'
        values: '100+0x15'
      - series: 'kube_node_status_allocatable{job="kube-state-metrics", resource="cpu", node="node-1"}'
        values: '6+0x15'
    alert_rule_test:
      - eval_time: 8m
        alertname: KubeCPUQuotaOvercommitNonCI
        exp_alerts: []

  # One quota declaring both cpu and requests.cpu at 5 counts once: 5 of 6
  # CPUs (0.83x) is silent, where a double count (1.67x) would fire.
  - interval: 1m
    input_series:
      - series: 'kube_resourcequota{job="kube-state-metrics", type="hard", resource="cpu", namespace="apps", resourcequota="apps"}'
        values: '5+0x15'
      - series: 'kube_resourcequota{job="kube-state-metrics", type="hard", resource="requests.cpu", namespace="apps", resourcequota="apps"}'
        values: '5+0x15'
      - series: 'kube_node_status_allocatable{job="kube-state-metrics", resource="cpu", node="node-1"}'
        values: '6+0x15'
    alert_rule_test:
      - eval_time: 8m
        alertname: KubeCPUQuotaOvercommitNonCI
        exp_alerts: []

  # The same for memory: 10 declared twice against 12 counts once (0.83x).
  - interval: 1m
    input_series:
      - series: 'kube_resourcequota{job="kube-state-metrics", type="hard", resource="memory", namespace="apps", resourcequota="apps"}'
        values: '10+0x15'
      - series: 'kube_resourcequota{job="kube-state-metrics", type="hard", resource="requests.memory", namespace="apps", resourcequota="apps"}'
        values: '10+0x15'
      - series: 'kube_node_status_allocatable{job="kube-state-metrics", resource="memory", node="node-1"}'
        values: '12+0x15'
    alert_rule_test:
      - eval_time: 8m
        alertname: KubeMemoryQuotaOvercommitNonCI
        exp_alerts: []

  # Memory: 20 of 12 allocatable (1.67x) fires; 17.9 of 12 (1.49x) does not,
  # however large the CI quota is.
  - interval: 1m
    input_series:
      - series: 'kube_resourcequota{job="kube-state-metrics", type="hard", resource="requests.memory", namespace="apps", resourcequota="apps"}'
        values: '20+0x15'
      - series: 'kube_resourcequota{job="kube-state-metrics", type="hard", resource="requests.memory", namespace="gitlab-runner", resourcequota="ci"}'
        values: '500+0x15'
      - series: 'kube_node_status_allocatable{job="kube-state-metrics", resource="memory", node="node-1"}'
        values: '12+0x15'
    alert_rule_test:
      - eval_time: 3m
        alertname: KubeMemoryQuotaOvercommitNonCI
        exp_alerts: []
      - eval_time: 8m
        alertname: KubeMemoryQuotaOvercommitNonCI
        exp_alerts:
          - exp_labels:
              severity: warning
  - interval: 1m
    input_series:
      - series: 'kube_resourcequota{job="kube-state-metrics", type="hard", resource="requests.memory", namespace="apps", resourcequota="apps"}'
        values: '17.9+0x15'
      - series: 'kube_resourcequota{job="kube-state-metrics", type="hard", resource="requests.memory", namespace="gitlab-runner-privileged", resourcequota="ci"}'
        values: '500+0x15'
      - series: 'kube_node_status_allocatable{job="kube-state-metrics", resource="memory", node="node-1"}'
        values: '12+0x15'
    alert_rule_test:
      - eval_time: 8m
        alertname: KubeMemoryQuotaOvercommitNonCI
        exp_alerts: []
