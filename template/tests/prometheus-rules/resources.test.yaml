---
# promtool unit tests for the two memory alerts. ContainerMemoryNearLimit is a
# ratio against the container's own limit, read on RSS so reclaimable page cache
# never counts; ContainerOOMKilled catches the kill RSS cannot see coming.
rule_files:
  - rules.yaml
evaluation_interval: 1m
tests:
  # An ordinary container holding 95% of its limit in RSS fires; one with room
  # to spare stays silent.
  - interval: 1m
    input_series:
      - series: 'container_memory_rss{namespace="traefik", pod="traefik-0", container="traefik"}'
        values: '95+0x30'
      - series: 'kube_pod_container_resource_limits{resource="memory", namespace="traefik", pod="traefik-0", container="traefik"}'
        values: '100+0x30'
      - series: 'container_memory_rss{namespace="registry-cache", pod="registry-cache-0", container="registry"}'
        values: '40+0x30'
      - series: 'kube_pod_container_resource_limits{resource="memory", namespace="registry-cache", pod="registry-cache-0", container="registry"}'
        values: '100+0x30'
    alert_rule_test:
      # Inside the 15m hold.
      - eval_time: 10m
        alertname: ContainerMemoryNearLimit
        exp_alerts: []
      - eval_time: 20m
        alertname: ContainerMemoryNearLimit
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: traefik
              pod: traefik-0
              container: traefik

  # Page cache is not a warning: a working set at its ceiling over an RSS of
  # 20% of the limit is the log-shipping and Loki shape, and it stays silent.
  - interval: 1m
    input_series:
      - series: 'container_memory_working_set_bytes{namespace="observability", pod="loki-0", container="loki"}'
        values: '115+0x30'
      - series: 'container_memory_rss{namespace="observability", pod="loki-0", container="loki"}'
        values: '20+0x30'
      - series: 'kube_pod_container_resource_limits{resource="memory", namespace="observability", pod="loki-0", container="loki"}'
        values: '100+0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: ContainerMemoryNearLimit
        exp_alerts: []

  # authentik/postgresql is judged on its working set, which carries the shared
  # buffers RSS omits: 93% of the limit fires on an RSS of 8%.
  - interval: 1m
    input_series:
      - series: 'container_memory_working_set_bytes{namespace="authentik", pod="authentik-postgresql-0", container="postgresql"}'
        values: '93+0x30'
      - series: 'container_memory_rss{namespace="authentik", pod="authentik-postgresql-0", container="postgresql"}'
        values: '8+0x30'
      - series: 'kube_pod_container_resource_limits{resource="memory", namespace="authentik", pod="authentik-postgresql-0", container="postgresql"}'
        values: '100+0x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: ContainerMemoryNearLimit
        exp_alerts: []
      - eval_time: 20m
        alertname: ContainerMemoryNearLimit
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: authentik
              pod: authentik-postgresql-0
              container: postgresql

  # The same database comfortably inside its limit on both metrics: the
  # working-set arm is a band, not a licence to page on any value.
  - interval: 1m
    input_series:
      - series: 'container_memory_working_set_bytes{namespace="authentik", pod="authentik-postgresql-0", container="postgresql"}'
        values: '40+0x30'
      - series: 'container_memory_rss{namespace="authentik", pod="authentik-postgresql-0", container="postgresql"}'
        values: '8+0x30'
      - series: 'kube_pod_container_resource_limits{resource="memory", namespace="authentik", pod="authentik-postgresql-0", container="postgresql"}'
        values: '100+0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: ContainerMemoryNearLimit
        exp_alerts: []

  # ContainerOOMKilled: a restart whose last-terminated reason is OOMKilled
  # fires; a restart for any other reason does not.
  - interval: 1m
    input_series:
      - series: 'kube_pod_container_status_restarts_total{namespace="registry-cache", pod="registry-cache-0", container="registry"}'
        values: '0+0x30 1+0x30'
      - series: 'kube_pod_container_status_last_terminated_reason{reason="OOMKilled", namespace="registry-cache", pod="registry-cache-0", container="registry"}'
        values: '0+0x30 1+0x30'
      - series: 'kube_pod_container_status_restarts_total{namespace="traefik", pod="traefik-0", container="traefik"}'
        values: '0+0x30 1+0x30'
      - series: 'kube_pod_container_status_last_terminated_reason{reason="Error", namespace="traefik", pod="traefik-0", container="traefik"}'
        values: '0+0x30 1+0x30'
    alert_rule_test:
      - eval_time: 40m
        alertname: ContainerOOMKilled
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: registry-cache
              pod: registry-cache-0
              container: registry

  # The reason sticks for the life of the pod, so the restart counter is what
  # makes the alert edge-triggered: a kill older than 1h is history.
  - interval: 1m
    input_series:
      - series: 'kube_pod_container_status_restarts_total{namespace="registry-cache", pod="registry-cache-0", container="registry"}'
        values: '1+0x150'
      - series: 'kube_pod_container_status_last_terminated_reason{reason="OOMKilled", namespace="registry-cache", pod="registry-cache-0", container="registry"}'
        values: '1+0x150'
    alert_rule_test:
      - eval_time: 140m
        alertname: ContainerOOMKilled
        exp_alerts: []
