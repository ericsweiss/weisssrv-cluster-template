---
# promtool unit tests for MetalLBSpeakerNotScheduled and the ingress VIP rules:
# each `absent()` arm is the one a selector typo would silence, so it is asserted
# with the series gone, and a sibling object must not satisfy the selector.
rule_files:
  - rules.yaml
evaluation_interval: 5m
tests:
  # The DaemonSet is gone from kube-state-metrics entirely.
  - interval: 5m
    input_series:
      - series: 'kube_daemonset_status_desired_number_scheduled{namespace="metallb-system", daemonset="metallb-controller", job="kube-state-metrics", instance="10.42.1.5:8080"}'
        values: '1+0x24'
    alert_rule_test:
      # Inside the 10m hold.
      - eval_time: 5m
        alertname: MetalLBSpeakerNotScheduled
        exp_alerts: []
      - eval_time: 20m
        alertname: MetalLBSpeakerNotScheduled
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: metallb-system
              daemonset: metallb-speaker

  # The DaemonSet is reported, with no node left to schedule on.
  - interval: 5m
    input_series:
      - series: 'kube_daemonset_status_desired_number_scheduled{namespace="metallb-system", daemonset="metallb-speaker", job="kube-state-metrics", instance="10.42.1.5:8080"}'
        values: '9+0x12 0+0x12'
    alert_rule_test:
      - eval_time: 55m
        alertname: MetalLBSpeakerNotScheduled
        exp_alerts: []
      - eval_time: 1h25m
        alertname: MetalLBSpeakerNotScheduled
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: metallb-system
              daemonset: metallb-speaker
              job: kube-state-metrics
              instance: '10.42.1.5:8080'

  # Traefik*VipMissing: the public VIP is gone while the internal one is held,
  # and an IP on the wrong Service does not count.
  - interval: 5m
    input_series:
      - series: 'kube_service_status_load_balancer_ingress{namespace="traefik", service="traefik-internal", ip="${cluster_metallb_internal_vip}", job="kube-state-metrics"}'
        values: '1+0x12'
      - series: 'kube_service_status_load_balancer_ingress{namespace="traefik", service="traefik-internal", ip="${cluster_metallb_public_vip}", job="kube-state-metrics"}'
        values: '1+0x12'
    alert_rule_test:
      # Inside the 10m hold.
      - eval_time: 5m
        alertname: TraefikPublicVipMissing
        exp_alerts: []
      - eval_time: 20m
        alertname: TraefikPublicVipMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: traefik
              service: traefik
              ip: '${cluster_metallb_public_vip}'
      - eval_time: 20m
        alertname: TraefikInternalVipMissing
        exp_alerts: []

  # The internal VIP drops off its Service after an hour.
  - interval: 5m
    input_series:
      - series: 'kube_service_status_load_balancer_ingress{namespace="traefik", service="traefik-internal", ip="${cluster_metallb_internal_vip}", job="kube-state-metrics"}'
        values: '1+0x12 _x12'
    alert_rule_test:
      - eval_time: 55m
        alertname: TraefikInternalVipMissing
        exp_alerts: []
      # Absent, but inside the 10m hold.
      - eval_time: 1h10m
        alertname: TraefikInternalVipMissing
        exp_alerts: []
      - eval_time: 1h25m
        alertname: TraefikInternalVipMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: traefik
              service: traefik-internal
              ip: '${cluster_metallb_internal_vip}'
