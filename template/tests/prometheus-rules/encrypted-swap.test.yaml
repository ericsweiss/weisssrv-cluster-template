---
# promtool unit tests for the encrypted-swap finalize arms. Both are joins on
# instance, so each case asserts the other alert stays quiet: the pair must
# split plaintext fallback from the swapless failure, never double-page.
rule_files:
  - rules.yaml
evaluation_interval: 5m
tests:
  # EncryptedSwapPlaintextFallback: the mapper is not the swap device but the
  # host still swaps, so finalize fell back to the plaintext device.
  - interval: 5m
    input_series:
      - series: 'encrypted_swap_mapper_active{instance="pve-01:9101", job="node-exporter-host"}'
        values: '0+0x24'
      - series: 'encrypted_swap_any_swap_active{instance="pve-01:9101", job="node-exporter-host"}'
        values: '1+0x24'
    alert_rule_test:
      # Inside the 30m hold.
      - eval_time: 25m
        alertname: EncryptedSwapPlaintextFallback
        exp_alerts: []
      - eval_time: 35m
        alertname: EncryptedSwapPlaintextFallback
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: 'pve-01:9101'
              job: node-exporter-host
      - eval_time: 35m
        alertname: EncryptedSwapRestoreFailed
        exp_alerts: []

  # EncryptedSwapRestoreFailed: the mapper failed and the plaintext fallback
  # could not be restored, so the host runs with no swap at all.
  - interval: 5m
    input_series:
      - series: 'encrypted_swap_mapper_active{instance="pve-01:9101", job="node-exporter-host"}'
        values: '0+0x24'
      - series: 'encrypted_swap_any_swap_active{instance="pve-01:9101", job="node-exporter-host"}'
        values: '0+0x24'
      - series: 'node_memory_SwapTotal_bytes{instance="pve-01:9101", job="node-exporter-host"}'
        values: '0+0x24'
    alert_rule_test:
      # Inside the 30m hold.
      - eval_time: 25m
        alertname: EncryptedSwapRestoreFailed
        exp_alerts: []
      - eval_time: 35m
        alertname: EncryptedSwapRestoreFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: 'pve-01:9101'
              job: node-exporter-host
      # The swapless failure is this alert's page, not the fallback one's.
      - eval_time: 35m
        alertname: EncryptedSwapPlaintextFallback
        exp_alerts: []

  # Healthy: the mapper IS the swap device, so neither arm may fire. An
  # operator who puts plaintext swap back by hand clears the restore alert
  # through SwapTotal, which is why that arm reads the node gauge too.
  - interval: 5m
    input_series:
      - series: 'encrypted_swap_mapper_active{instance="pve-01:9101", job="node-exporter-host"}'
        values: '1+0x24'
      - series: 'encrypted_swap_any_swap_active{instance="pve-01:9101", job="node-exporter-host"}'
        values: '1+0x24'
      - series: 'node_memory_SwapTotal_bytes{instance="pve-01:9101", job="node-exporter-host"}'
        values: '34359738368+0x24'
    alert_rule_test:
      - eval_time: 35m
        alertname: EncryptedSwapPlaintextFallback
        exp_alerts: []
      - eval_time: 35m
        alertname: EncryptedSwapRestoreFailed
        exp_alerts: []
