# Mirrors weisssrv-lib `lint/ruff.toml`: same target-version and rule selection,
# so local `ruff check` and the python-lint CI job agree.
# `target-version` matches the lowest Python the render tests run on.
target-version = "py39"

[lint]
# Correctness-first selection; formatting-only rules are excluded.
# Rationale: weisssrv-lib lint/ruff.toml.
select = ["E4", "E7", "E9", "F", "W", "B"]
