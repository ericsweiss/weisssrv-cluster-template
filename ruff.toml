# Forked from weisssrv-lib `lint/ruff.toml` (narrower target set) so `ruff
# check` locally and the python-lint CI job, which uses ruff's own config
# discovery, agree.
#
# `target-version` matches the lowest Python the render tests run on.
target-version = "py39"

[lint]
# Correctness-first selection; formatting-only rules are deliberately out.
# Rationale: weisssrv-lib lint/ruff.toml.
select = ["E4", "E7", "E9", "F", "W", "B"]
