---
# CI for the template itself. Generic jobs come from the shared library, so the
# template is linted by the tooling it hands to a generated cluster; every job is
# TAG-LESS and non-root safe (pip --user, workspace-local tool downloads) so they
# land on the shared runner.
#
# `render-validate` (below) is the gate that matters. `release` is declared LAST
# so stage ordering gates a tag on it — a template tag must never be cut from a
# tree that does not render. See docs/VERSIONING.md.
stages:
  - lint
  - test
  - security
  - ai-review
  - release

# Settings every job inherits unless it says otherwise. No image or tags here —
# each job and every library include already names its own, and this repository's
# jobs are deliberately tag-less so they land on the shared runner.
default:
  # Cancel a superseded pipeline's jobs on a new commit; see the workflow policy
  # below. The library's `release` job overrides this to false itself.
  interruptible: true

workflow:
  # AUTHORITATIVE description of this pipeline's cancellation policy; jobs that
  # override `interruptible` point here rather than restating it.
  #
  # MR refs: `on_new_commit: interruptible` — a new push cancels the previous
  # pipeline's interruptible jobs instead of letting render-validate, the
  # heaviest job here, pile up on the shared runner it is already quota-refused
  # on. GitLab's project default is "conservative", which stops cancelling as
  # soon as any non-interruptible job has started, so it leaves them running.
  #
  # main: `on_new_commit: none` (the rule below) — a merged pipeline always runs
  # to completion, because `release` cuts the tag every generated cluster's
  # `copier update` resolves to and a cancelled one leaves that tag uncut with a
  # green pipeline behind it.
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
      auto_cancel:
        on_new_commit: none
    - if: '$CI_PIPELINE_SOURCE == "web"'

variables:
  LIB_PROJECT: "eric/weisssrv-lib"
  # Single source for the library pin. `include:` CANNOT read this — it is
  # resolved before job variables exist — so each entry below repeats the tag as
  # a literal and scripts/check-lib-pins.py (vendored from the library) fails the
  # pipeline if they drift from it or pin a branch. Bump here, then
  # `scripts/check-lib-pins.py --fix`.
  WEISSSRV_LIB_REF: "v0.9.7"
  COPIER_VERSION: "9.17.0"
  PYYAML_VERSION: "6.0.2"
  YAMLLINT_VERSION: "1.38.0"
  ANSIBLE_CORE_VERSION: "2.18.18"
  KUBECONFORM_VERSION: "0.6.7"
  KUBECONFORM_SHA256: "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73"
  KUSTOMIZE_VERSION: "5.4.3"
  KUSTOMIZE_SHA256: "3669470b454d865c8184d6bce78df05e977c9aea31c30df3c669317d43bcc7a7"
  # Same 1.15 line as the library's terraform-validate image; render-validate
  # needs the binary alongside python/ansible, so it is fetched, not imaged.
  TERRAFORM_VERSION: "1.15.8"
  TERRAFORM_SHA256: "d25ce7b6902013ad905db3d2eab0be4cd905887fe88b81a6171b8d5503c31f3d"

include:
  # Only genuine YAML: files under template/ that carry the .jinja suffix are
  # Jinja sources, not documents. The render-validate job below yamllints the
  # rendered tree, which is where template/ actually gets covered.
  - project: eric/weisssrv-lib
    ref: v0.9.7
    file: /ci/lint/yaml-lint.yml
    inputs:
      tags: []
      image: python:3.13-slim
      config: "-c .yamllint"
      targets: "copier.yml tests/ .gitlab-ci.yml scripts/vendored-manifest.yml"
      changes:
        - "copier.yml"
        - "tests/**/*"
        - "scripts/vendored-manifest.yml"
        - ".yamllint"
        - ".gitlab-ci.yml"

  - project: eric/weisssrv-lib
    ref: v0.9.7
    file: /ci/lint/python-lint.yml
    inputs:
      tags: []
      image: python:3.13-slim
      # The Python under template/ is static (no .jinja suffix), so it is linted
      # here as well as in every repository it ships to. `scripts` is this
      # repository's OWN tooling (the vendored release script), not payload.
      targets: "scripts tests template/tests template/scripts template/kubernetes"
      changes:
        - "scripts/**/*.py"
        - "tests/**/*.py"
        - "template/**/*.py"
        - "ruff.toml"
        - ".gitlab-ci.yml"

  # The shell the template ships is static (no .jinja suffix), so it can be
  # checked in place rather than only after a render.
  - project: eric/weisssrv-lib
    ref: v0.9.7
    file: /ci/lint/shellcheck.yml
    inputs:
      tags: []
      direct_globs: "template/scripts/*.sh"
      find_dir: ""
      changes:
        - "template/scripts/**/*.sh"
        - ".gitlab-ci.yml"

  # copier.yml schema checks + the full render invariants. Everything in the
  # repository feeds the render, hence the catch-all `changes`.
  - project: eric/weisssrv-lib
    ref: v0.9.7
    file: /ci/test/python-tests.yml
    inputs:
      tags: []
      image: python:3.13
      apt_packages: ""
      test_dir: "tests"
      pip_packages: "copier==9.17.0"
      changes:
        - "**/*"

  # Self-application: the template ships this gate into every generated cluster,
  # and its own docs carry the same relative cross-links.
  - project: eric/weisssrv-lib
    ref: v0.9.7
    file: /ci/lint/docs-link-check.yml
    inputs:
      tags: []
      changes:
        - "docs/**/*"
        - "README.md"
        - "scripts/check-doc-links.py"
        - ".gitlab-ci.yml"

  # Pin drift in the SHIPPED defaults. The checker runs inside a RENDER of this
  # template (all.yml.jinja is Jinja, not a vars file), so it reports what a
  # freshly generated cluster would be pinned to. Soft-fail: rc 1 is "updates
  # available".
  - project: eric/weisssrv-lib
    ref: v0.9.7
    file: /ci/maintenance/version-check.yml
    inputs:
      tags: []
      image: python:3.13
      setup_command: >-
        pip install --user --quiet "copier==$COPIER_VERSION" "pyyaml==$PYYAML_VERSION"
      check_command: >-
        python3 tests/render_cluster.py --out .render > /dev/null;
        python3 .render/scripts/check-versions.py --json > "$REPORT_PATH"; RC=$?;
        [ -s "$REPORT_PATH" ] ||
        { echo "check-versions wrote no report (rc=$RC)"; exit 2; };
        exit "$RC"
      changes:
        - "template/ansible/inventories/prod/group_vars/all.yml.jinja"
        - "template/scripts/version-registry.py.jinja"
        - "tests/answers-weisssrv-shaped.yml"
        - ".gitlab-ci.yml"

  - project: eric/weisssrv-lib
    ref: v0.9.7
    file: /ci/security/secret-detection.yml
    inputs:
      tags: []

  - project: eric/weisssrv-lib
    ref: v0.9.7
    file: /ci/review/pr-agent.yml
    inputs:
      tags: []
      # Interlocked, so stated rather than inherited: `timeout` must outlast
      # ai_timeout (per CALL) x len(commands), plus image pull and clone.
      # reasoning_effort `high` — xhigh overruns this timeout.
      reasoning_effort: "high"
      ai_timeout: "1200"
      timeout: "45m"
      needs:
        - job: yaml-lint
          optional: true
        - job: python-tests
          optional: true
        - job: render-validate
          optional: true

  # Cuts THIS template's tag from the conventional commits merged to main — the
  # tag a generated cluster's `copier update` resolves to. All inputs are the
  # library defaults; `release` is declared LAST above so stage order gates the
  # tag on every job here. Policy and the major_on_zero decision:
  # docs/VERSIONING.md.
  - project: eric/weisssrv-lib
    ref: v0.9.7
    file: /ci/release/semantic-release.yml
    inputs:
      tags: []

render-validate:
  stage: test
  image: python:3.13
  tags: []
  needs: []
  # This job requests the largest limits in the pipeline, so on the quota-capped
  # shared runner it is the first to be refused at POD-CREATION time when several
  # pipelines overlap. That arrives as a system failure rather than a test
  # failure, which the retry turns into throttling instead of a red pipeline that
  # says nothing about the render.
  retry:
    max: 2
    when:
      - runner_system_failure
      - scheduler_failure
  variables:
    # The collection is cloned rather than installed from the pinned ref, so the
    # gate does not depend on anonymous access to the library project.
    LIB_CHECKOUT: "$CI_PROJECT_DIR/.tmp/lib"
    # The runner pod's uid has no passwd entry, and ansible resolves the current
    # user from these — without them every `--syntax-check` in this job dies with
    # "No username set in the environment" before parsing a single playbook. The
    # library's collection-checks job carries the same pair for the same reason.
    USER: gitlab-runner
    LOGNAME: gitlab-runner
  before_script:
    - export PATH="$CI_PROJECT_DIR/.bin:$(python -m site --user-base)/bin:$PATH"
    - mkdir -p "$CI_PROJECT_DIR/.bin"
    - |
      pip install --user --quiet \
        "copier==${COPIER_VERSION}" \
        "pyyaml==${PYYAML_VERSION}" \
        "yamllint==${YAMLLINT_VERSION}" \
        "ansible-core==${ANSIBLE_CORE_VERSION}"
    - |
      set -eo pipefail
      # Non-root tool install: stdlib download, sha256 verify, extract into a
      # workspace bin that before_script already put on PATH.
      fetch_verified() {  # <file> <url> <sha256>
        python -c "import urllib.request,sys; urllib.request.urlretrieve(sys.argv[1], sys.argv[2])" "$2" "/tmp/$1"
        echo "$3  /tmp/$1" | sha256sum -c -
      }
      fetch_verified kubeconform.tar.gz \
        "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
        "$KUBECONFORM_SHA256"
      tar xzf /tmp/kubeconform.tar.gz -C "$CI_PROJECT_DIR/.bin" kubeconform
      fetch_verified kustomize.tar.gz \
        "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
        "$KUSTOMIZE_SHA256"
      tar xzf /tmp/kustomize.tar.gz -C "$CI_PROJECT_DIR/.bin" kustomize
      fetch_verified terraform.zip \
        "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" \
        "$TERRAFORM_SHA256"
      python -c "import zipfile,sys; zipfile.ZipFile('/tmp/terraform.zip').extract('terraform', sys.argv[1])" "$CI_PROJECT_DIR/.bin"
      chmod +x "$CI_PROJECT_DIR/.bin/terraform"
      kubeconform -v && kustomize version && terraform version
    - |
      set -eo pipefail
      # The ref under test is copier.yml's lib_ref default — the single source the
      # fixtures inherit (they no longer restate it) — so the gate, the render and
      # the generated requirements.yml can never disagree about which library is
      # exercised.
      LIB_REF=$(python -c "import yaml; print(yaml.safe_load(open('copier.yml'))['lib_ref']['default'])")
      git clone --depth 1 --branch "$LIB_REF" \
        "${CI_SERVER_PROTOCOL}://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}:${CI_SERVER_PORT}/${LIB_PROJECT}.git" \
        "$LIB_CHECKOUT"
  script:
    # BOTH fixtures — see tests/answers-unlike.yml for why the contrast render
    # is not optional.
    - python3 tests/validate_render.py --lib-path "$LIB_CHECKOUT"
    - |
      python3 tests/validate_render.py \
        --answers tests/answers-unlike.yml \
        --lib-path "$LIB_CHECKOUT"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "**/*"
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - "**/*"
    - if: '$CI_PIPELINE_SOURCE == "web"'
