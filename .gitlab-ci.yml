---
# CI for the template itself. Generic jobs come from the shared library, and
# every job is tag-less and non-root safe so it lands on the shared runner.
# `validate-rendered-cluster` is the gate that matters; see docs/VERSIONING.md.
stages:
  - lint
  - test
  - security
  - ai-review
  - release

# Settings every job inherits unless it says otherwise. No image or tags here:
# each job and every library include names its own.
default:
  # Cancel a superseded pipeline's jobs on a new commit; see the workflow policy
  # below. The library's `release` job overrides this to false itself.
  interruptible: true

workflow:
  # MR refs cancel superseded pipelines; main never cancels, because `release`
  # cuts the tag every generated cluster's `copier update` resolves to.
  # See docs/CI.md.
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
      auto_cancel:
        on_new_commit: none
    - if: '$CI_PIPELINE_SOURCE == "web"'

variables:
  LIB_PROJECT: "eric/weisssrv-lib"
  # Single source for the library pin. `include:` cannot read it, so each entry
  # repeats the tag; scripts/check-lib-pins.py fails drift. `--fix` rewrites.
  WEISSSRV_LIB_REF: "v0.19.0"
  # Library checkout the python-tests job clones into and tests/test_render.py
  # reads for the ruleset parity gate, which fails rather than skips in CI.
  WEISSSRV_LIB_PATH: "$CI_PROJECT_DIR/.tmp/weisssrv-lib"
  COPIER_VERSION: "9.17.0"
  PYYAML_VERSION: "6.0.2"
  YAMLLINT_VERSION: "1.38.0"
  # The core line template/requirements.txt's `ansible==` pin resolves to:
  # the render's nested pytest drives ansible-playbook, so it must run the
  # interpreter a generated cluster deploys with.
  ANSIBLE_CORE_VERSION: "2.21.5"

include:
  # Only genuine YAML: files under template/ that carry the .jinja suffix are
  # Jinja sources, not documents. validate-rendered-cluster below yamllints the
  # rendered tree, which is where template/ actually gets covered.
  - project: eric/weisssrv-lib
    ref: v0.19.0
    file: /ci/lint/yaml-lint.yml
    inputs:
      tags: []
      image: python:3.13-slim
      config: "-c lint/yamllint-relaxed.yml"
      targets: "copier.yml tests/ lint/ .gitlab-ci.yml scripts/vendored-manifest.yml"
      changes:
        - "copier.yml"
        - "tests/**/*"
        - "scripts/vendored-manifest.yml"
        - "lint/yamllint-relaxed.yml"
        - ".gitlab-ci.yml"

  - project: eric/weisssrv-lib
    ref: v0.19.0
    file: /ci/lint/python-lint.yml
    inputs:
      tags: []
      image: python:3.13-slim
      # ruff walks by .py suffix, so it sees only the plain-named Python under
      # template/. Jinja-named sources (`{% if .. %}x.py{% endif %}`,
      # `*.py.jinja`) are linted only by the generated cluster's own ruff job.
      targets: "scripts tests template/tests template/scripts template/kubernetes"
      changes:
        - "scripts/**/*.py"
        - "tests/**/*.py"
        - "template/**/*.py"
        - "ruff.toml"
        - ".gitlab-ci.yml"

  # Most of the shell the template ships is static, so it is checked in place.
  # The one .sh.jinja source is covered by the render check in
  # tests/validate_render.py, which shellchecks the generated scripts.
  - project: eric/weisssrv-lib
    ref: v0.19.0
    file: /ci/lint/shellcheck.yml
    inputs:
      tags: []
      direct_globs: "template/scripts/*.sh"
      find_dir: ""
      changes:
        - "template/scripts/**/*.sh"
        - ".gitlab-ci.yml"

  # The comment-length house rule over this repository's own sources, the Jinja
  # ones included: the gate reads a `.jinja` source as the file it renders into.
  # No config file, so PyYAML is not installed.
  - project: eric/weisssrv-lib
    ref: v0.19.0
    file: /ci/lint/comment-length.yml
    inputs:
      tags: []
      pyyaml_version: ""

  # copier.yml schema checks + the full render invariants. Everything in the
  # repository feeds the render, hence the catch-all `changes`.
  - project: eric/weisssrv-lib
    ref: v0.19.0
    file: /ci/test/python-tests.yml
    inputs:
      tags: []
      image: python:3.13
      # jq: the nested `pytest tests scripts` inside the render collects
      # scripts/test_collect_state_lib.py and test_deploy_verify_lib.py, which
      # drive the shipped jq filters and fail rather than skip without it.
      apt_packages: "jq"
      test_dir: "tests"
      # ansible-core: the nested `pytest tests scripts` inside the render runs
      # test_deploy_preflight.py, which fails rather than skips without it.
      pip_packages: "copier==9.17.0 ansible-core==2.21.5"
      # The library checkout the ruleset parity gate compares against; the
      # python:3.13 image already ships git.
      setup_command: 'python3 scripts/ci-fetch-tools.py jq kustomize kubeconform shellcheck && mkdir -p "$(dirname "$WEISSSRV_LIB_PATH")" && git clone --depth 1 --branch "$WEISSSRV_LIB_REF" "${CI_SERVER_PROTOCOL}://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}:${CI_SERVER_PORT}/${LIB_PROJECT}.git" "$WEISSSRV_LIB_PATH"'
      changes:
        - "**/*"

  # Self-application: the template ships this gate into every generated cluster,
  # and its own docs carry the same relative cross-links.
  - project: eric/weisssrv-lib
    ref: v0.19.0
    file: /ci/lint/docs-link-check.yml
    inputs:
      job_name: lint-docs-links
      tags: []
      changes:
        - "docs/**/*"
        - "README.md"
        - "scripts/check-doc-links.py"
        - ".gitlab-ci.yml"

  # Pin drift in the SHIPPED defaults, checked inside a render of this template.
  # Soft-fail: rc 1 means updates are available.
  - project: eric/weisssrv-lib
    ref: v0.19.0
    file: /ci/maintenance/version-check.yml
    inputs:
      tags: []
      image: python:3.13
      setup_command: >-
        pip install --user --quiet "copier==$COPIER_VERSION" "pyyaml==$PYYAML_VERSION"
      check_command: >-
        python3 tests/render_cluster.py --out .render > /dev/null;
        python3 .render/scripts/check-versions.py --json > "$REPORT_PATH"; RC=$?;
        [ -s "$REPORT_PATH" ] ||
        { echo "check-versions wrote no report (rc=$RC)"; exit 2; };
        exit "$RC"
      # Stated, not inherited: rc=1 is "updates available", rc=2 a checker
      # error, and the weekly sweep must red on the second.
      soft_fail_exit_codes: [1]
      changes:
        - "template/ansible/inventories/prod/group_vars/all.yml.jinja"
        - "template/scripts/version-registry.py.jinja"
        - "tests/answers-weisssrv-shaped.yml"
        - ".gitlab-ci.yml"

  - project: eric/weisssrv-lib
    ref: v0.19.0
    file: /ci/security/secret-detection.yml
    inputs:
      tags: []
      # gitleaks needs SSE4.2 and SIGILLs on the legacy-CPU agents. A literal
      # label, because this is the template's OWN pipeline; the rendered half
      # passes the generated cluster's answer instead.
      cpu_selector: "esweiss.com/cpu=modern"

  - project: eric/weisssrv-lib
    ref: v0.19.0
    file: /ci/review/pr-agent.yml
    inputs:
      tags: []
      # Interlocked, so stated rather than inherited: `timeout` must outlast
      # ai_timeout (per CALL) x len(commands), plus image pull and clone.
      # reasoning_effort `high` — xhigh overruns this timeout.
      reasoning_effort: "high"
      ai_timeout: "1200"
      timeout: "45m"
      needs:
        - job: yaml-lint
          optional: true
        - job: python-tests
          optional: true
        - job: validate-rendered-cluster
          optional: true

  # Cuts this template's tag from the commits merged to main - the tag a
  # generated cluster's `copier update` resolves to. `release` is declared last
  # above, so stage order gates it on every job here. Policy: docs/VERSIONING.md.
  - project: eric/weisssrv-lib
    ref: v0.19.0
    file: /ci/release/semantic-release.yml
    inputs:
      tags: []

validate-rendered-cluster:
  stage: test
  image: python:3.13
  tags: []
  needs: []
  # Largest limits in the pipeline: on the quota-capped shared runner a
  # pod-creation refusal arrives as a system failure - retry it as throttling.
  retry:
    max: 2
    when:
      - runner_system_failure
      - scheduler_failure
  variables:
    # The collection is cloned rather than installed from the pinned ref, so the
    # gate does not depend on anonymous access to the library project.
    LIB_CHECKOUT: "$CI_PROJECT_DIR/.tmp/lib"
    # ansible reads the current user from USER/LOGNAME; the runner pod's uid has
    # no passwd entry, so `--syntax-check` dies without them.
    USER: gitlab-runner
    LOGNAME: gitlab-runner
    # go-task is outside scripts/ci-fetch-tools.py's set, and the flux-lint
    # check runs the render's own `task flux:lint`, so it is pinned here and
    # sha256-verified in before_script like every other fetched binary.
    TASK_VERSION: "3.53.1"
    TASK_SHA256: "a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7"
    # The render's `task flux:lint` renders through GNU envsubst; the runner is
    # not root, so the trixie gettext-base package is unpacked next to the
    # fetched binaries instead of installed.
    GETTEXT_BASE_VERSION: "0.23.1-2"
    GETTEXT_BASE_SHA256: "1a3dfadd661520ff01d379fd89cd0d49972a5a775d490609f1712134ee3d62ca"
  before_script:
    - export PATH="$CI_PROJECT_DIR/.bin:$CI_PROJECT_DIR/.deb/usr/bin:$(python -m site --user-base)/bin:$PATH"
    - mkdir -p "$CI_PROJECT_DIR/.bin" "$CI_PROJECT_DIR/.deb"
    - |
      curl -fsSL -o gettext-base.deb "https://deb.debian.org/debian/pool/main/g/gettext/gettext-base_${GETTEXT_BASE_VERSION}_amd64.deb"
      echo "${GETTEXT_BASE_SHA256}  gettext-base.deb" | sha256sum -c -
      dpkg-deb -x gettext-base.deb "$CI_PROJECT_DIR/.deb"
      envsubst --version | head -1
    - |
      pip install --user --quiet \
        "copier==${COPIER_VERSION}" \
        "pyyaml==${PYYAML_VERSION}" \
        "yamllint==${YAMLLINT_VERSION}" \
        "ansible-core==${ANSIBLE_CORE_VERSION}"
    # The pins live in the vendored fetcher, so this gate and every generated
    # cluster download the same verified binaries.
    - python3 scripts/ci-fetch-tools.py kubeconform kustomize terraform promtool amtool shellcheck
    - kubeconform -v && kustomize version && terraform version
    - promtool --version && amtool --version && shellcheck --version
    - |
      set -eo pipefail
      # The ref under test is copier.yml's lib_ref default, so the gate, the
      # render and the generated requirements.yml cannot disagree.
      LIB_REF=$(python -c "import yaml; print(yaml.safe_load(open('copier.yml'))['lib_ref']['default'])")
      git clone --depth 1 --branch "$LIB_REF" \
        "${CI_SERVER_PROTOCOL}://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}:${CI_SERVER_PORT}/${LIB_PROJECT}.git" \
        "$LIB_CHECKOUT"
    - |
      set -eo pipefail
      # The flux-lint check runs the render's own `task flux:lint`: task runs
      # it, helm renders its values arm, flux is its substitution authority.
      # Both pins come from the library include, never a second spelling.
      LINT_PINS=$(python3 - "$LIB_CHECKOUT/ci/validate/flux-lint.yml" <<'PY'
      import sys, yaml
      inputs = next(yaml.safe_load_all(open(sys.argv[1])))["spec"]["inputs"]
      print(*(inputs[key]["default"] for key in (
          "helm_version", "helm_sha256", "flux_version", "flux_sha256")))
      PY
      )
      read -r HELM_VERSION HELM_SHA256 FLUX_VERSION FLUX_SHA256 <<<"$LINT_PINS"
      curl -fsSL -o helm.tar.gz "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
      echo "${HELM_SHA256}  helm.tar.gz" | sha256sum -c -
      tar xzf helm.tar.gz -C "$CI_PROJECT_DIR/.bin" --strip-components=1 linux-amd64/helm
      curl -fsSL -o task.tar.gz "https://github.com/go-task/task/releases/download/v${TASK_VERSION}/task_linux_amd64.tar.gz"
      echo "${TASK_SHA256}  task.tar.gz" | sha256sum -c -
      tar xzf task.tar.gz -C "$CI_PROJECT_DIR/.bin" task
      curl -fsSL -o flux.tar.gz "https://github.com/fluxcd/flux2/releases/download/v${FLUX_VERSION}/flux_${FLUX_VERSION}_linux_amd64.tar.gz"
      echo "${FLUX_SHA256}  flux.tar.gz" | sha256sum -c -
      tar xzf flux.tar.gz -C "$CI_PROJECT_DIR/.bin" flux
      rm -f helm.tar.gz task.tar.gz flux.tar.gz
      helm version --short && task --version && flux --version
  script:
    # BOTH fixtures — see tests/answers-unlike.yml for why the contrast render
    # is not optional. --self-checks rides on this line alone: its arms read no
    # render, so running them twice only repeats the output.
    - python3 tests/validate_render.py --lib-path "$LIB_CHECKOUT" --self-checks
    - |
      python3 tests/validate_render.py \
        --answers tests/answers-unlike.yml \
        --lib-path "$LIB_CHECKOUT"
    # One optional module on: the two fixtures move vpn_tailscale, gpu and
    # use_unifi together, so a conditional coupling two of them has an arm
    # neither render takes. Paired with MODULES_MIXED in tests/test_render.py.
    - |
      python3 tests/validate_render.py \
        --answers tests/answers-unlike.yml \
        --data vpn_tailscale=true \
        --data gpu=none \
        --data use_unifi=false \
        --lib-path "$LIB_CHECKOUT"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "**/*"
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - "**/*"
    - if: '$CI_PIPELINE_SOURCE == "web"'
